<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revue d'inspection</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #dfe3e8;
    --ink: #1a1d21;
    --ink-soft: #5c6470;
    --ink-faint: #868e9a;
    --arret: #b3261e;
    --arret-bg: #fdecea;
    --critique: #c2410c;
    --critique-bg: #fdf0e7;
    --majeur: #a16207;
    --majeur-bg: #fbf4e3;
    --mineur: #0f6f8f;
    --mineur-bg: #e9f3f7;
    --ok: #0f7b46;
    --ok-bg: #e7f4ed;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 72px; }

  header.page { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--ink-soft); font-size: 13px; }
  .meta code { background: #eceef1; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .disclaimer {
    margin-top: 12px; padding: 9px 12px; border-radius: var(--radius);
    background: #eef1f4; border: 1px solid var(--border);
    color: var(--ink-soft); font-size: 13px;
  }

  .stop-banner {
    display: none;
    margin: 18px 0; padding: 14px 16px; border-radius: var(--radius);
    background: var(--arret); color: #fff;
    font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    box-shadow: 0 1px 3px rgba(179, 38, 30, 0.35);
  }
  .stop-banner small {
    display: block; margin-top: 4px;
    font-weight: 500; text-transform: none; letter-spacing: 0; opacity: 0.92;
  }

  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 22px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; color: var(--ink-soft);
  }
  .chip b { font-size: 14px; color: var(--ink); }
  .chip.arret { background: var(--arret-bg); border-color: #f3c6c2; color: var(--arret); }
  .chip.arret b { color: var(--arret); }
  .chip.critique { background: var(--critique-bg); border-color: #f3d3bd; color: var(--critique); }
  .chip.critique b { color: var(--critique); }
  .chip.majeur { background: var(--majeur-bg); border-color: #ecdcae; color: var(--majeur); }
  .chip.majeur b { color: var(--majeur); }
  .chip.mineur { background: var(--mineur-bg); border-color: #c4dfe9; color: var(--mineur); }
  .chip.mineur b { color: var(--mineur); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
  }
  .card.arret { border-left-color: var(--arret); }
  .card.critique { border-left-color: var(--critique); }
  .card.majeur { border-left-color: var(--majeur); }
  .card.mineur { border-left-color: var(--mineur); }
  .card.rejected { opacity: 0.55; }

  .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rule-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-faint); }
  .sev {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 4px;
  }
  .sev.arret { background: var(--arret); color: #fff; }
  .sev.critique { background: var(--critique); color: #fff; }
  .sev.majeur { background: var(--majeur); color: #fff; }
  .sev.mineur { background: var(--mineur); color: #fff; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--ink-soft); background: #f7f8f9;
  }
  .badge.review { background: var(--majeur-bg); border-color: #ecdcae; color: var(--majeur); }
  .badge.approved { background: var(--ok-bg); border-color: #bfe0cd; color: var(--ok); }
  .badge.rejected { background: #f1f2f4; }
  .badge.queued { background: var(--ok-bg); border-color: #bfe0cd; color: var(--ok); }
  .badge.failed { background: var(--arret-bg); border-color: #f3c6c2; color: var(--arret); }
  dd.failure { color: var(--arret); }
  .spacer { flex: 1; }
  .ts { font-size: 12px; color: var(--ink-faint); }

  .title { font-weight: 600; margin-bottom: 6px; }
  .observation { margin-bottom: 10px; }
  .reason {
    font-size: 13px; color: var(--ink-soft);
    border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 12px;
  }

  dl.facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 16px; margin: 0 0 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  dl.facts div { min-width: 0; }
  dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 2px; }
  dd { margin: 0; font-size: 13px; word-break: break-word; }
  dd.due { font-weight: 600; }
  dd.confidence.low { color: var(--majeur); font-weight: 600; }
  dd.due.now { color: var(--arret); }

  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 14px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0f2f4; }
  button:disabled { cursor: default; opacity: 0.5; }
  button.approve[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.reject[aria-pressed="true"] { background: #5c6470; border-color: #5c6470; color: #fff; }

  .dispatch-bar {
    margin-top: 24px; padding: 16px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  button.primary {
    background: var(--ink); border-color: var(--ink); color: #fff;
    font-weight: 600; padding: 9px 18px;
  }
  button.primary:hover:not(:disabled) { background: #33383f; }
  .dispatch-note { font-size: 13px; color: var(--ink-soft); }

  .evidence {
    display: block; width: 100%; max-width: 420px; border-radius: 6px;
    border: 1px solid var(--border); margin-bottom: 12px;
  }
  .badge.edited { background: #eef1f4; }
  .badge.manual { background: #e9f3f7; border-color: #c4dfe9; color: var(--mineur); }
  .editor { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
  .editor label { display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 3px; }
  .editor .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .editor .row > div { flex: 1 1 200px; min-width: 0; }
  select, textarea, input[type="text"] {
    font: inherit; font-size: 13px; width: 100%; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  textarea { resize: vertical; min-height: 72px; }
  .original { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .cc-field { flex: 1 1 260px; min-width: 200px; }
  .cc-field label { display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 3px; }
  .cc-error { color: var(--arret); font-size: 12px; margin-top: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  a.button {
    font-size: 13px; padding: 7px 14px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--ink);
    text-decoration: none; display: inline-block;
  }
  a.button:hover { background: #f0f2f4; }
  .notice { padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
  .notice.error { background: var(--arret-bg); border-color: #f3c6c2; color: var(--arret); }
  pre.result {
    margin: 12px 0 0; padding: 12px; background: #f7f8f9; border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Revue d'inspection</h1>
    <div class="meta">
      <code id="inspection-id"></code>
      <span id="meta-rest"></span>
    </div>
    <div class="disclaimer">
      Analyse assistée par IA — validation humaine requise. Rien n'est transmis
      tant qu'un valideur n'a pas approuvé.
    </div>
  </header>

  <div class="stop-banner" id="stop-banner">
    Arrêt immédiat de l'activité
    <small id="stop-detail"></small>
  </div>

  <div class="summary" id="summary"></div>
  <div class="toolbar" id="toolbar" hidden>
    <a class="button" id="pdf-link" href="#" target="_blank" rel="noopener">
      Télécharger le rapport PDF</a>
    <button id="add-btn">Ajouter un constat</button>
  </div>
  <div id="add-form"></div>
  <div id="findings"></div>
  <div id="empty-state"></div>

  <div class="dispatch-bar" id="dispatch-bar" hidden>
    <div class="cc-field">
      <label for="cc-input">Copie à (adresses séparées par des virgules)</label>
      <input type="text" id="cc-input" placeholder="prenom.nom@exemple.fr, autre@exemple.fr">
      <div class="cc-error" id="cc-error" hidden></div>
    </div>
    <button class="primary" id="dispatch-btn">Transmettre les constats approuvés</button>
    <span class="dispatch-note" id="dispatch-note"></span>
  </div>
  <pre class="result" id="dispatch-result" hidden></pre>
</div>

<script>
(function () {
  "use strict";

  var SEVERITIES = ["arret_immediat", "critique", "majeur", "mineur"];
  var SEVERITY_CLASS = {
    arret_immediat: "arret", critique: "critique", majeur: "majeur", mineur: "mineur"
  };
  var SEVERITY_LABEL = {
    arret_immediat: "Arrêt immédiat", critique: "Critique",
    majeur: "Majeur", mineur: "Mineur"
  };

  var id = decodeURIComponent(window.location.pathname.split("/").pop());
  var base = "/inspections/" + encodeURIComponent(id);
  var state = null;

  var el = {
    id: document.getElementById("inspection-id"),
    metaRest: document.getElementById("meta-rest"),
    banner: document.getElementById("stop-banner"),
    bannerDetail: document.getElementById("stop-detail"),
    summary: document.getElementById("summary"),
    findings: document.getElementById("findings"),
    empty: document.getElementById("empty-state"),
    bar: document.getElementById("dispatch-bar"),
    dispatchBtn: document.getElementById("dispatch-btn"),
    dispatchNote: document.getElementById("dispatch-note"),
    dispatchResult: document.getElementById("dispatch-result"),
    toolbar: document.getElementById("toolbar"),
    pdfLink: document.getElementById("pdf-link"),
    addBtn: document.getElementById("add-btn"),
    addForm: document.getElementById("add-form"),
    ccInput: document.getElementById("cc-input"),
    ccError: document.getElementById("cc-error")
  };

  var SEVERITY_CHOICES = [
    ["arret_immediat", "Arrêt immédiat"], ["critique", "Critique"],
    ["majeur", "Majeur"], ["mineur", "Mineur"]
  ];
  var options = { rules: [], roles: [] };
  var editing = null;   // index du constat en cours d'édition

  function select(name, choices, current) {
    var sel = node("select");
    sel.name = name;
    choices.forEach(function (choice) {
      var opt = node("option", null, choice[1]);
      opt.value = choice[0];
      if (choice[0] === current) { opt.selected = true; }
      sel.appendChild(opt);
    });
    return sel;
  }

  function ruleChoices() {
    return options.rules.map(function (r) { return [r.id, r.id + " — " + r.title]; });
  }

  function roleChoices() {
    return options.roles.map(function (r) { return [r.key, r.name]; });
  }

  function node(tag, className, text) {
    var n = document.createElement(tag);
    if (className) { n.className = className; }
    if (text !== undefined && text !== null) { n.textContent = String(text); }
    return n;
  }

  function fact(label, value, className) {
    var box = node("div");
    box.appendChild(node("dt", null, label));
    box.appendChild(node("dd", className || null, value));
    return box;
  }

  function request(url, options) {
    return fetch(url, options).then(function (response) {
      return response.json().then(function (body) {
        if (!response.ok) {
          throw new Error(body && body.detail ? body.detail : "La requête a échoué");
        }
        return body;
      });
    });
  }

  function renderSummary(summary, result) {
    el.summary.textContent = "";
    el.summary.appendChild(chip(null, "Constats", summary.total));
    SEVERITIES.forEach(function (severity) {
      var count = (summary.by_severity || {})[severity] || 0;
      if (count > 0) {
        el.summary.appendChild(chip(SEVERITY_CLASS[severity], SEVERITY_LABEL[severity], count));
      }
    });
    if (summary.requires_review > 0) {
      el.summary.appendChild(chip(null, "Confiance faible", summary.requires_review));
    }
    el.summary.appendChild(chip(null, "Approuvés", summary.approved));
    el.summary.appendChild(chip(null, "Rejetés", summary.rejected));
    el.summary.appendChild(chip(null, "En attente", summary.pending));

    if (summary.has_immediate_stop) {
      var stopping = result.findings.filter(function (f) { return f.immediate; }).length;
      el.bannerDetail.textContent =
        stopping + (stopping === 1 ? " constat impose" : " constats imposent") +
        " l'arrêt immédiat des travaux.";
      el.banner.style.display = "block";
    } else {
      el.banner.style.display = "none";
    }
  }

  function chip(className, label, value) {
    var c = node("span", className ? "chip " + className : "chip");
    c.appendChild(node("b", null, value));
    c.appendChild(document.createTextNode(label));
    return c;
  }

  function renderFinding(finding, index) {
    var severityClass = SEVERITY_CLASS[finding.observed_severity] || "";
    var card = node("div", "card " + severityClass);
    if (finding.validation_status === "rejected") { card.classList.add("rejected"); }

    var head = node("div", "card-head");
    head.appendChild(node("span", "sev " + severityClass,
      SEVERITY_LABEL[finding.observed_severity] || finding.observed_severity));
    head.appendChild(node("span", "rule-id", finding.rule_id));
    if (finding.requires_review) {
      head.appendChild(node("span", "badge review", "Confiance faible — à vérifier"));
    }
    if (finding.validation_status !== "pending") {
      head.appendChild(node("span", "badge " + finding.validation_status,
        finding.validation_status === "approved" ? "Approuvé" : "Rejeté"));
    }
    if (finding.source === "human") {
      head.appendChild(node("span", "badge manual", "Ajouté par l'auditeur"));
    } else if (finding.edited_by_human) {
      head.appendChild(node("span", "badge edited", "Corrigé par l'auditeur"));
    }
    if (finding.dispatch_status === "sent") {
      head.appendChild(node("span", "badge queued", "Transmis"));
    } else if (finding.dispatch_status === "failed") {
      head.appendChild(node("span", "badge failed", "Échec d'envoi"));
    }
    head.appendChild(node("span", "spacer"));
    head.appendChild(node("span", "ts", "t+" + finding.timestamp_sec + "s"));
    card.appendChild(head);

    if (finding.rule_title) { card.appendChild(node("div", "title", finding.rule_title)); }
    if (finding.evidence_image) {
      var img = node("img", "evidence");
      img.src = base + "/evidence/" + encodeURIComponent(finding.evidence_image);
      img.alt = "Image probante du constat";
      img.loading = "lazy";
      card.appendChild(img);
    }
    card.appendChild(node("div", "observation", finding.observation));
    if (finding.severity_reason) {
      card.appendChild(node("div", "reason", finding.severity_reason));
    }

    var facts = node("dl", "facts");
    facts.appendChild(fact("Responsable",
      finding.assigned_name || "Non affecté"));
    facts.appendChild(fact("Notifié",
      (finding.notify_emails || []).join(", ") || "Personne"));
    facts.appendChild(fact("Échéance",
      finding.immediate ? finding.deadline_date + " — immédiat" : finding.deadline_date,
      finding.immediate ? "due now" : "due"));
    facts.appendChild(fact("Confiance", Math.round(finding.confidence * 100) + "%",
      finding.requires_review ? "confidence low" : "confidence"));
    facts.appendChild(fact("ISO 45001", finding.iso_45001_clause));
    facts.appendChild(fact("Statut",
      finding.status === "nc" ? "Non-conformité" : "À vérifier"));
    if (finding.dispatch_status === "sent" && finding.message_id) {
      facts.appendChild(fact("Envoi", finding.message_id));
    } else if (finding.dispatch_status === "failed" && finding.dispatch_error) {
      facts.appendChild(fact("Échec", finding.dispatch_error, "failure"));
    }
    card.appendChild(facts);

    var actions = node("div", "actions");
    actions.appendChild(decisionButton("approve", "Approuver", index, finding));
    actions.appendChild(decisionButton("reject", "Rejeter", index, finding));
    var edit = node("button", "edit", editing === index ? "Annuler" : "Modifier");
    edit.addEventListener("click", function () {
      editing = editing === index ? null : index;
      render(state);
    });
    actions.appendChild(edit);
    card.appendChild(actions);

    if (finding.original_severity || finding.original_observation) {
      var was = [];
      if (finding.original_severity) {
        was.push("gravité initiale : " + (SEVERITY_LABEL[finding.original_severity] ||
          finding.original_severity));
      }
      if (finding.original_observation) {
        was.push("observation initiale : « " + finding.original_observation + " »");
      }
      card.appendChild(node("div", "original", "Analyse d'origine — " + was.join(" · ")));
    }
    if (editing === index) { card.appendChild(editorFor(index, finding)); }
    return card;
  }

  function editorFor(index, finding) {
    var box = node("div", "editor");
    var row1 = node("div", "row");

    var sevBox = node("div");
    sevBox.appendChild(node("label", null, "Gravité retenue"));
    var sev = select("observed_severity", SEVERITY_CHOICES, finding.observed_severity);
    sevBox.appendChild(sev);
    row1.appendChild(sevBox);

    var ruleBox = node("div");
    ruleBox.appendChild(node("label", null, "Règle"));
    var rule = select("rule_id", ruleChoices(), finding.rule_id);
    ruleBox.appendChild(rule);
    row1.appendChild(ruleBox);

    var roleBox = node("div");
    roleBox.appendChild(node("label", null, "Responsable"));
    var role = select("assigned_role", roleChoices(), finding.assigned_role);
    roleBox.appendChild(role);
    row1.appendChild(roleBox);
    box.appendChild(row1);

    var obsBox = node("div");
    obsBox.appendChild(node("label", null, "Observation"));
    var obs = node("textarea");
    obs.value = finding.observation;
    obsBox.appendChild(obs);
    box.appendChild(obsBox);

    var actions = node("div", "actions");
    actions.style.marginTop = "10px";
    var save = node("button", "primary", "Enregistrer la correction");
    save.addEventListener("click", function () {
      var payload = {};
      if (sev.value !== finding.observed_severity) { payload.observed_severity = sev.value; }
      if (rule.value !== finding.rule_id) { payload.rule_id = rule.value; }
      if (role.value !== finding.assigned_role) { payload.assigned_role = role.value; }
      if (obs.value.trim() && obs.value.trim() !== finding.observation) {
        payload.observation = obs.value.trim();
      }
      if (Object.keys(payload).length === 0) { editing = null; render(state); return; }
      setBusy(true);
      request(base + "/findings/" + index, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function (payload) { editing = null; render(payload); })
        .catch(showError)
        .then(function () { setBusy(false); });
    });
    actions.appendChild(save);
    box.appendChild(actions);
    return box;
  }

  function addFormMarkup() {
    var box = node("div", "card");
    box.appendChild(node("div", "title", "Ajouter un constat"));
    var body = node("div", "editor");
    body.style.borderTop = "none";
    body.style.paddingTop = "0";

    var row = node("div", "row");
    var sevBox = node("div");
    sevBox.appendChild(node("label", null, "Gravité retenue"));
    var sev = select("observed_severity", SEVERITY_CHOICES, "majeur");
    sevBox.appendChild(sev); row.appendChild(sevBox);

    var ruleBox = node("div");
    ruleBox.appendChild(node("label", null, "Règle"));
    var rule = select("rule_id", ruleChoices(), null);
    ruleBox.appendChild(rule); row.appendChild(ruleBox);
    body.appendChild(row);

    var obsBox = node("div");
    obsBox.appendChild(node("label", null, "Observation"));
    var obs = node("textarea");
    obs.placeholder = "Décrivez ce que vous avez constaté sur le terrain.";
    obsBox.appendChild(obs); body.appendChild(obsBox);

    var actions = node("div", "actions");
    actions.style.marginTop = "10px";
    var save = node("button", "primary", "Enregistrer le constat");
    save.addEventListener("click", function () {
      if (!obs.value.trim()) { obs.focus(); return; }
      setBusy(true);
      request(base + "/findings", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          rule_id: rule.value, observation: obs.value.trim(),
          observed_severity: sev.value
        })
      }).then(function (payload) { el.addForm.textContent = ""; render(payload); })
        .catch(showError)
        .then(function () { setBusy(false); });
    });
    var cancel = node("button", null, "Annuler");
    cancel.addEventListener("click", function () { el.addForm.textContent = ""; });
    actions.appendChild(save); actions.appendChild(cancel);
    body.appendChild(actions);
    box.appendChild(body);
    return box;
  }

  function decisionButton(kind, label, index, finding) {
    var button = node("button", kind, label);
    var active = finding.validation_status === (kind === "approve" ? "approved" : "rejected");
    button.setAttribute("aria-pressed", active ? "true" : "false");
    button.addEventListener("click", function () {
      setBusy(true);
      request(base + "/findings/" + index + "/" + kind, { method: "POST" })
        .then(render)
        .catch(showError)
        .then(function () { setBusy(false); });
    });
    return button;
  }

  function pendingSendCount() {
    var result = state && state.result;
    if (!result) { return 0; }
    return result.findings.filter(function (f) {
      return f.validation_status === "approved" && f.dispatch_status !== "sent";
    }).length;
  }

  function setBusy(busy) {
    var buttons = document.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) { buttons[i].disabled = busy; }
    // Re-enabling everything would undo the dispatch button's own state.
    if (!busy) { el.dispatchBtn.disabled = pendingSendCount() === 0; }
  }

  function showError(error) {
    el.empty.textContent = "";
    el.empty.appendChild(node("div", "notice error", error.message || String(error)));
  }

  function formatCaptured(raw) {
    var d = new Date(raw);
    if (isNaN(d.getTime())) { return raw; }
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
      " à " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function loadOptions(referentiel) {
    if (options.rules.length) { return; }
    fetch("/referentiels/" + encodeURIComponent(referentiel) + "/options")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (payload) { if (payload) { options = payload; } })
      .catch(function () { /* l'édition reste possible sans les libellés */ });
  }

  function parseCc() {
    var raw = el.ccInput.value.trim();
    if (!raw) { return []; }
    var pattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    var bad = [];
    var list = raw.split(",").map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length > 0; });
    list.forEach(function (address) {
      if (!pattern.test(address)) { bad.push(address); }
    });
    if (bad.length) { throw new Error("Adresse invalide : " + bad.join(", ")); }
    return list;
  }

  function render(payload) {
    state = payload;
    el.id.textContent = payload.inspection_id;
    el.findings.textContent = "";
    el.empty.textContent = "";
    el.dispatchResult.hidden = true;

    var result = payload.result;
    if (!result) {
      el.toolbar.hidden = true;
      el.metaRest.textContent = " · " + payload.status;
      el.summary.textContent = "";
      el.bar.hidden = true;
      el.empty.appendChild(node("div", payload.error ? "notice error" : "notice",
        payload.error || "L'analyse est en cours. Rechargez la page dans un instant."));
      return;
    }

    el.metaRest.textContent =
      " · référentiel " + result.referentiel + " · " + result.scene_detected +
      (result.captured_at
        ? " · prise de vue " + formatCaptured(result.captured_at)
        : " · prise de vue non renseignée");
    el.toolbar.hidden = false;
    el.pdfLink.href = base + "/report.pdf";
    loadOptions(result.referentiel);
    renderSummary(payload.summary, result);

    if (!result.scene_valid) {
      el.empty.appendChild(node("div", "notice",
        "La scène ne correspond pas au référentiel « " + result.referentiel +
        " » : aucun constat n'a été relevé. Refaites la prise de vue ou " +
        "sélectionnez le bon référentiel."));
      el.bar.hidden = true;
      return;
    }
    if (result.findings.length === 0) {
      el.empty.appendChild(node("div", "notice", "Aucune non-conformité observée."));
      el.bar.hidden = true;
      return;
    }

    result.findings.forEach(function (finding, index) {
      el.findings.appendChild(renderFinding(finding, index));
    });

    el.bar.hidden = false;
    // Approval is what queues a finding, low confidence included. Anything
    // already sent stays sent and is never counted again.
    var pendingSend = result.findings.filter(function (f) {
      return f.validation_status === "approved" && f.dispatch_status !== "sent";
    });
    var sent = result.findings.filter(function (f) {
      return f.dispatch_status === "sent";
    }).length;
    var fromReview = pendingSend.filter(function (f) { return f.requires_review; }).length;
    el.dispatchBtn.disabled = pendingSend.length === 0;
    el.dispatchBtn.title = pendingSend.length > 0 ? ""
      : (sent > 0
          ? "Tous les constats approuvés ont déjà été transmis."
          : "Approuvez au moins un constat pour pouvoir le transmettre.");
    el.dispatchNote.textContent =
      (pendingSend.length === 0
        ? "Rien à envoyer"
        : pendingSend.length + (pendingSend.length === 1 ? " constat à envoyer" : " constats à envoyer") +
          (fromReview > 0 ? ", dont " + fromReview + " à confiance faible" : "")) +
      (sent > 0 ? " · " + sent + " déjà transmis" : "") + ".";
  }

  el.addBtn.addEventListener("click", function () {
    if (el.addForm.firstChild) { el.addForm.textContent = ""; return; }
    el.addForm.appendChild(addFormMarkup());
  });

  el.dispatchBtn.addEventListener("click", function () {
    var cc;
    try {
      cc = parseCc();
      el.ccError.hidden = true;
    } catch (error) {
      el.ccError.textContent = error.message;
      el.ccError.hidden = false;
      return;
    }
    setBusy(true);
    request(base + "/dispatch", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ cc: cc })
    })
      .then(function (outcome) {
        // Re-render first: render() clears the panel, so fill it afterwards.
        return request(base + "/review").then(render).then(function () {
          el.dispatchResult.hidden = false;
          var lines = [
            outcome.sent_count + " email(s) envoyé(s)" +
            (outcome.failed_count ? ", " + outcome.failed_count + " en échec" : "") + "."
          ];
          if (outcome.already_sent.length) {
            lines.push(outcome.already_sent.length +
              " constat(s) déjà transmis, non renvoyé(s).");
          }
          if (outcome.unassigned.length) {
            lines.push(outcome.unassigned.length +
              " constat(s) approuvé(s) sans destinataire : rien n'a pu être envoyé.");
          }
          if (outcome.emails.length && outcome.emails[0].cc.length) {
            lines.push("Copie à : " + outcome.emails[0].cc.join(", "));
          }
          outcome.emails.forEach(function (mail) {
            lines.push(
              (mail.status === "sent" ? "  OK   " : "  ECHEC") + " " + mail.email +
              " [" + (mail.kind === "immediate" ? "arret immediat" : "recapitulatif") + "] " +
              mail.finding_indexes.length + " constat(s)" +
              (mail.status === "sent" ? " — " + mail.message_id : " — " + mail.error));
          });
          el.dispatchResult.textContent = lines.join("\n");
        });
      })
      .catch(showError)
      .then(function () { setBusy(false); });
  });

  request(base + "/review").then(render).catch(showError);
}());
</script>
</body>
</html>
