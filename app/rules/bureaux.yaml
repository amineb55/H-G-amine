# Rule catalogue - office and administrative premises inspection
referentiel: bureaux
description: Workspaces, offices, workstations
label: Offices and administrative premises
rules:
  - id: BUR-01
    title: Workstations set up to limit ergonomic risk
    default_severity: mineur
    deadline_days: 30
    iso_45001_clause: "8.1.2"
  - id: BUR-02
    title: Electrical installations - sockets, cables and equipment in good condition and correctly used
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BUR-03
    title: Fire safety provisions - extinguishers, alarms and safety equipment accessible and inspected
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.2"
  - id: BUR-04
    title: Means of escape - exits and evacuation routes kept clear at all times
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.2"
  - id: BUR-05
    title: Lighting suited to the tasks and to circulation areas
    default_severity: mineur
    deadline_days: 30
    iso_45001_clause: "8.1.2"
  - id: BUR-06
    title: Stairs and circulation routes clear and safe
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BUR-07
    title: Floors clean, dry and free from slip and trip hazards
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BUR-08
    title: Ventilation and air conditioning serviced and kept in working order
    default_severity: mineur
    deadline_days: 30
    iso_45001_clause: "8.1.2"
  - id: BUR-09
    title: Cleaning chemicals identified, correctly stored and access restricted
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BUR-10
    title: Manual handling carried out with appropriate aids
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BUR-11
    title: First aid kit available, accessible and checked
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.2"
  - id: BUR-12
    title: Emergency instructions, contact numbers and evacuation procedures accessible to staff
    default_severity: mineur
    deadline_days: 30
    iso_45001_clause: "8.2"
