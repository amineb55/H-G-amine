# Rule catalogue - construction site inspection
referentiel: btp
description: Works, plant, PPE, excavations
label: Construction site
rules:
  - id: BTP-01
    title: Work at height protected against fall risk
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-02
    title: Scaffolding correctly erected, secured, inspected and used as intended
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-03
    title: PPE suited to the risks and correctly worn by exposed workers
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BTP-04
    title: Site plant inspected before use and operated by authorised persons
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "7.2"
  - id: BTP-05
    title: Site traffic management - plant and pedestrian routes organised and segregated
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-06
    title: Lifting operations - equipment and accessories inspected, exclusion zone demarcated
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-07
    title: Temporary electrical installations protected and maintained in a safe condition
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-08
    title: Excavations secured against collapse before anyone enters
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-09
    title: Hot work controlled - welding, cutting and spark-generating operations
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.1.2"
  - id: BTP-10
    title: Hazardous substances identified, stored and handled in line with the applicable controls
    default_severity: majeur
    deadline_days: 7
    iso_45001_clause: "8.1.2"
  - id: BTP-11
    title: First aid, firefighting and evacuation provisions available and accessible
    default_severity: critique
    deadline_days: 1
    iso_45001_clause: "8.2"
  - id: BTP-12
    title: Housekeeping - work areas kept clear to prevent slips, trips and falls
    default_severity: mineur
    deadline_days: 30
    iso_45001_clause: "8.1.2"
