# =====================================================================
# GARDE ANTI-COPYRIGHT — motifs de phrasé de norme
# Le test tests/test_copyright_guard.py doit échouer si un motif « interdit »
# apparaît dans exigence_fr / exigence_en, et avertir pour un motif « à éviter ».
# La règle de fond : on décrit l'état constaté par l'auditeur, jamais
# l'injonction de la norme. Statut : BROUILLON v0.1.
# =====================================================================
version: "0.1-brouillon"

interdits_fr:
  - "L'organisme doit"
  - "l'organisme doit"
  - "doit déterminer"
  - "doit établir"
  - "doit mettre en œuvre"
  - "doit tenir à jour"
  - "doit conserver"
  - "doit s'assurer"
  - "doivent être"
  - "établir, mettre en œuvre, tenir à jour"
  - "tenir à jour des informations documentées"
  - "conserver des informations documentées"
  - "en tant que preuve"
  - "les informations documentées exigées"
  - "la présente norme"
  - "du présent document"
  - "de la présente norme internationale"

interdits_en:
  - "The organization shall"
  - "the organization shall"
  - "shall determine"
  - "shall establish"
  - "shall implement"
  - "shall maintain"
  - "shall retain"
  - "shall ensure"
  - "documented information as evidence"
  - "retain documented information"
  - "maintain documented information"
  - "this document"
  - "this International Standard"

a_eviter_fr:
  - "informations documentées"
  - "de manière appropriée"
  - "si applicable"
  - "le cas échéant"
  - "conformément aux exigences"
  - "et/ou"

a_eviter_en:
  - "documented information"
  - "as appropriate"
  - "where applicable"
  - "and/or"

# Règles complémentaires du test :
# - aucune phrase d'exigence_fr ne commence par « L'organisme doit » ni ne
#   contient un verbe modal d'obligation au présent (« doit », « doivent »)
#   suivi d'un infinitif : compter les occurrences de " doit " et " doivent "
#   → tolérance 0 par enregistrement ;
# - longueur : exigence_fr entre 250 et 900 caractères ;
# - une exigence ne doit pas reproduire la numérotation interne de la norme
#   dans le texte (ex. « a) », « b) », « c) » en début de ligne) ;
# - le relecteur humain compare ensuite chaque enregistrement au texte de la
#   norme qu'il détient légalement : si une phrase est reconnaissable à
#   l'identique, il la réécrit.
