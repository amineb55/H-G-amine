# =====================================================================
# FORMULAIRE DE CADRAGE — questions
# Statut : BROUILLON v0.1 — à valider par Amine Boukha (ordre, formulation,
#          seuils). Les 8 sections reprennent la logique du cahier des charges
#          (§4.1.1) ; les numéros de section sont à faire correspondre.
# Champs : secteur (tous | btp | bureaux | industrie | sante | logistique |
#          horeca), norme (tous | 45001 | 9001 | 14001 | 50001),
#          seuil_minimal (oui = obligatoire pour lancer la génération v1),
#          documents / exigences = ce que la réponse alimente,
#          pourquoi = aide affichée à l'utilisateur (le « pourquoi on demande »).
# =====================================================================
version: "0.1-brouillon"
sections:
  1: "Identité et organisation"
  2: "Périmètre et normes visées"
  3: "Contexte et parties intéressées"
  4: "Direction et gouvernance"
  5: "Processus, activités et dangers"
  6: "Risques, réglementation et urgences"
  7: "Ressources, compétences, infrastructures (et énergie pour 50001)"
  8: "Existant documentaire, objectifs et attentes"

questions:
  - {id: Q01, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Raison sociale, forme juridique, adresse du siège et liste des sites concernés (nom, adresse, activité de chaque site).",
     documents: [declaration_domaine_application], exigences: [45001-4.3],
     pourquoi: "Fixe le périmètre du système et le cartouche de tous les documents."}
  - {id: Q02, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix_et_texte,
     question: "Secteur d'activité principal et activités secondaires. Précisez celles réalisées chez des clients ou sur chantier.",
     documents: [declaration_domaine_application, cartographie_processus], exigences: [45001-4.3, 45001-4.4],
     pourquoi: "Sélectionne les règles terrain sectorielles et les questions spécifiques."}
  - {id: Q03, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: nombres,
     question: "Effectif : permanents, temporaires ou intérimaires, saisonniers, stagiaires, et sous-traitants habituellement présents sur site.",
     documents: [analyse_risques, politique_sst], exigences: [45001-4.2, 45001-8.1.4.2a],
     pourquoi: "Déclenche les obligations liées à l'effectif (comité, médecine du travail) et le périmètre des personnes à protéger."}
  - {id: Q04, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix_multiple,
     question: "Organisation du temps de travail : horaires, travail posté, nuit, week-end, astreintes, travail isolé.",
     documents: [analyse_risques, plan_urgence], exigences: [45001-6.1.2.1, 45001-8.2c],
     pourquoi: "Le travail de nuit et isolé change les scénarios d'urgence et l'accès aux secours."}
  - {id: Q05, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte_ou_fichier,
     question: "Organigramme : qui dirige, qui encadre, où se situe la fonction QSE (temps plein ou partiel, rattachement).",
     documents: [organigramme, matrice_responsabilites], exigences: [45001-5.3],
     pourquoi: "Alimente les responsabilités dans chaque procédure."}
  - {id: Q06, section: 1, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix_multiple,
     question: "Instances existantes : comité de sécurité et d'hygiène, délégués du personnel, médecin du travail (interne ou externe, fréquence), secouristes formés.",
     documents: [procedure_consultation_participation, pv_csh], exigences: [45001-5.4a, 45001-7.1],
     pourquoi: "Vérifie les obligations légales de consultation et de suivi médical."}
  - {id: Q07, section: 1, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: choix_multiple,
     question: "Langues parlées et lues par le personnel opérationnel (arabe, amazigh, français, autres). Part du personnel ne lisant pas le français.",
     documents: [support_sensibilisation, procedure_communication], exigences: [45001-7.3, 45001-7.4.1],
     pourquoi: "Adapte les supports terrain (pictogrammes, langue) ; une consigne non comprise n'existe pas."}

  - {id: Q08, section: 2, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix,
     question: "Norme(s) visée(s) et objectif : structuration interne, certification initiale, renouvellement, réponse à un appel d'offres.",
     documents: [declaration_domaine_application], exigences: [45001-4.3],
     pourquoi: "Charge le bon modèle d'exigences et calibre le niveau de détail."}
  - {id: Q09, section: 2, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: date_et_texte,
     question: "Date cible (audit à blanc, certification) et organisme certificateur pressenti.",
     documents: [programme_audit], exigences: [45001-9.2.2],
     pourquoi: "Permet de rétro-planifier la construction du système et les audits internes."}
  - {id: Q10, section: 2, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Sites, activités ou fonctions que vous souhaitez exclure du périmètre, et pourquoi.",
     documents: [declaration_domaine_application], exigences: [45001-4.3],
     pourquoi: "Une exclusion doit être justifiée ; l'agent alerte si une activité dangereuse est exclue."}
  - {id: Q11, section: 2, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Certifications, labels ou systèmes déjà en place (autre norme, exigences de groupe) et documents réutilisables.",
     documents: [liste_documents], exigences: [45001-7.5.1],
     pourquoi: "Évite de recréer ce qui existe ; prépare l'intégration QSE."}
  - {id: Q12, section: 2, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix,
     question: "Langue des documents à produire (français ou anglais) et langue de la signalisation terrain.",
     documents: [procedure_maitrise_documentaire], exigences: [45001-7.5.2],
     pourquoi: "Paramètre de génération de la plateforme."}

  - {id: Q13, section: 3, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Les trois principaux enjeux internes (turnover, vétusté, croissance, sous-traitance, culture) et externes (clients, réglementation, concurrence, climat) qui pèsent sur la santé-sécurité.",
     documents: [analyse_contexte], exigences: [45001-4.1],
     pourquoi: "Point d'entrée de l'analyse de contexte ; évite une analyse générique."}
  - {id: Q14, section: 3, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Clients ou donneurs d'ordre qui exigent une certification ou des règles SST particulières : lesquels, quelles règles.",
     documents: [registre_parties_interessees, registre_exigences_legales], exigences: [45001-4.2, 45001-6.1.3a],
     pourquoi: "Les exigences clients deviennent des « autres exigences » du registre."}
  - {id: Q15, section: 3, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Autorités et organismes en relation avec vous (inspection du travail, CNSS, ONSSA, environnement, protection civile, assureur) et contrôles ou procès-verbaux reçus ces trois dernières années.",
     documents: [registre_parties_interessees, registre_exigences_legales], exigences: [45001-4.2, 45001-9.1.2],
     pourquoi: "Un PV récent est un écart réglementaire à traiter en priorité."}
  - {id: Q16, section: 3, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Attentes exprimées par les travailleurs ou leurs représentants (réclamations, demandes, conflits, plaintes).",
     documents: [registre_parties_interessees], exigences: [45001-4.2, 45001-5.4a],
     pourquoi: "Les travailleurs sont la première partie intéressée de la norme."}
  - {id: Q17, section: 3, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Accidents ou incidents marquants des cinq dernières années (nature, gravité, conséquences).",
     documents: [analyse_risques, procedure_incident], exigences: [45001-6.1.2.1, 45001-10.2a],
     pourquoi: "L'historique oriente l'identification des dangers et la priorité des règles terrain."}

  - {id: Q18, section: 4, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Qui signera la politique et qui présidera la revue de direction (nom, fonction) ?",
     documents: [politique_sst, compte_rendu_revue_direction], exigences: [45001-5.1a, 45001-5.2],
     pourquoi: "Une politique signée par le responsable QSE est une non-conformité classique."}
  - {id: Q19, section: 4, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix_multiple,
     question: "Engagements que la direction accepte réellement de tenir : arrêt de travaux en cas de danger, budget SST annuel, visites terrain régulières, non-représailles pour les signalements, consultation avant décision.",
     documents: [politique_sst], exigences: [45001-5.1a, 45001-5.1b],
     pourquoi: "La politique ne doit contenir que des engagements tenables ; l'auditeur les vérifiera."}
  - {id: Q20, section: 4, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Comment les travailleurs sont-ils, ou seront-ils, consultés (comité, réunions d'équipe, boîte à idées, application) et à quelle fréquence ?",
     documents: [procedure_consultation_participation], exigences: [45001-5.4a],
     pourquoi: "Exigence propre à la 45001, souvent la moins bien traitée."}
  - {id: Q21, section: 4, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Qui a l'autorité d'arrêter une machine, un chantier ou une tâche dangereuse ? Est-ce écrit quelque part ?",
     documents: [matrice_responsabilites, procedure_maitrise_operationnelle], exigences: [45001-5.3, 45001-8.1.1a],
     pourquoi: "Alimente la matrice des responsabilités et la procédure de maîtrise opérationnelle."}
  - {id: Q22, section: 4, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Comment les responsables d'équipe sont-ils évalués sur la sécurité (objectifs, primes, entretiens annuels) ?",
     documents: [fiche_de_poste, objectifs_sst], exigences: [45001-5.1a, 45001-6.2.1],
     pourquoi: "Révèle si la SST est intégrée au management ou reste à côté."}

  - {id: Q23, section: 5, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Liste de vos processus : management, réalisation (de la commande à la livraison), support (RH, achats, maintenance, informatique), avec leur pilote.",
     documents: [cartographie_processus, fiche_processus], exigences: [45001-4.4],
     pourquoi: "Base de la cartographie ; l'agent propose une cartographie type du secteur si la réponse est vide."}
  - {id: Q24, section: 5, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: choix_multiple,
     question: "Activités dangereuses présentes : travail en hauteur, engins et chariots, produits chimiques, électricité, espaces confinés, points chauds, manutention manuelle, bruit, vibrations, conduite routière, travail isolé, contact avec le public, rayonnements, risque biologique, températures extrêmes.",
     documents: [analyse_risques, registre_habilitations], exigences: [45001-6.1.2.1, 45001-7.2b],
     pourquoi: "Chaque case cochée active des dangers types, des habilitations et des règles terrain."}
  - {id: Q25, section: 5, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Tâches confiées à des sous-traitants et activités externalisées (maintenance, transport, nettoyage, gardiennage, restauration).",
     documents: [procedure_sous_traitants, liste_processus_externalises], exigences: [45001-8.1.4.2a, 45001-8.1.4.3],
     pourquoi: "Les sous-traitants sont dans le périmètre ; leurs accidents comptent."}
  - {id: Q26, section: 5, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Situations de coactivité : d'autres entreprises travaillent-elles sur votre site, vos équipes interviennent-elles chez des clients ? Qui coordonne aujourd'hui ?",
     documents: [plan_prevention], exigences: [45001-8.1.1b],
     pourquoi: "Déclenche la génération du plan de prévention type."}
  - {id: Q27, section: 5, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Équipements et installations majeurs (machines, engins, chaudières, compresseurs, ascenseurs, installation électrique) et contrôles périodiques déjà réalisés, avec dates.",
     documents: [planning_controles_reglementaires, registre_verification_equipements], exigences: [45001-6.1.3b, 45001-9.1.1b],
     pourquoi: "Construit le planning des contrôles réglementaires et repère les retards."}
  - {id: Q28, section: 5, secteur: tous, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Principaux changements prévus dans les douze mois : nouveau site, machine, produit, réorganisation, croissance d'effectif.",
     documents: [procedure_gestion_changement], exigences: [45001-8.1.3],
     pourquoi: "Un changement non analysé est une source majeure d'accidents."}
  - {id: Q29, section: 5, secteur: btp, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Qui autorise le démarrage d'une tâche en hauteur, d'un levage ou d'une fouille, et sur quel document ?",
     documents: [procedure_maitrise_operationnelle, permis_de_travail], exigences: [45001-8.1.1a],
     pourquoi: "Alimente les permis de travail types du chantier."}
  - {id: Q30, section: 5, secteur: btp, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Échafaudages et plateformes : qui les monte, qui les réceptionne, à quelle fréquence sont-ils vérifiés ?",
     documents: [instruction_travail, registre_verification_equipements], exigences: [45001-8.1.1a, 45001-9.1.1b],
     pourquoi: "Première cause d'accidents graves sur chantier."}
  - {id: Q31, section: 5, secteur: btp, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Engins de levage et de terrassement : liste, conducteurs, formations et autorisations existantes.",
     documents: [registre_habilitations], exigences: [45001-7.2b],
     pourquoi: "Alimente le registre des habilitations."}
  - {id: Q32, section: 5, secteur: btp, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Organisation des chantiers : base vie, clôture et accès, accueil des nouveaux arrivants, sous-traitance en cascade.",
     documents: [plan_prevention, livret_accueil], exigences: [45001-8.1.1b, 45001-7.2a],
     pourquoi: "Adapte le livret d'accueil et le plan de prévention au chantier."}
  - {id: Q33, section: 5, secteur: industrie, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Machines présentant des parties mobiles ou des énergies dangereuses : lesquelles ? Existe-t-il une procédure de consignation ?",
     documents: [procedure_maitrise_operationnelle], exigences: [45001-8.1.1a, 45001-8.1.2a],
     pourquoi: "Déclenche la procédure de consignation et les règles IND-01 / IND-02."}
  - {id: Q34, section: 5, secteur: industrie, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Inventaire des produits chimiques : nombre, dangers principaux, disponibilité des fiches de données de sécurité, lieux de stockage.",
     documents: [liste_documents_externes, analyse_risques], exigences: [45001-7.5.3b, 45001-6.1.2.1],
     pourquoi: "Alimente la liste des documents externes et le risque chimique."}
  - {id: Q35, section: 5, secteur: industrie, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Zones à atmosphère explosive, équipements sous pression, sources de bruit ou de poussières : lesquelles, et mesures d'exposition déjà réalisées.",
     documents: [analyse_risques, procedure_surveillance_mesure], exigences: [45001-9.1.1a],
     pourquoi: "Planifie les mesures d'exposition à réaliser."}
  - {id: Q36, section: 5, secteur: industrie, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Organisation de la maintenance : interne ou externe, interventions en marche, travaux par points chauds.",
     documents: [permis_de_travail, procedure_sous_traitants], exigences: [45001-8.1.1a, 45001-8.1.4.2b],
     pourquoi: "La maintenance concentre les accidents graves en industrie."}
  - {id: Q37, section: 5, secteur: sante, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Accidents d'exposition au sang : existe-t-il un protocole, une conduite à tenir affichée, un suivi ?",
     documents: [procedure_incident, instruction_travail], exigences: [45001-8.1.1a, 45001-10.2a],
     pourquoi: "Risque le plus fréquent pour le personnel soignant."}
  - {id: Q38, section: 5, secteur: sante, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Filière des déchets médicaux et pharmaceutiques : tri, stockage, prestataire agréé, traçabilité.",
     documents: [procedure_maitrise_operationnelle], exigences: [45001-8.1.1a, 45001-6.1.3b],
     pourquoi: "Obligation réglementaire spécifique au secteur."}
  - {id: Q39, section: 5, secteur: sante, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Suivi médical et vaccinal du personnel exposé ; radioprotection (personne compétente, dosimétrie) si sources de rayonnements.",
     documents: [dossier_medecine_travail, registre_habilitations], exigences: [45001-7.2b, 45001-9.1.1a],
     pourquoi: "Alimente les habilitations et le suivi des expositions."}
  - {id: Q40, section: 5, secteur: sante, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Violence et agressions envers le personnel : fréquence, dispositif d'alerte, formation du personnel d'accueil.",
     documents: [analyse_risques, plan_urgence], exigences: [45001-6.1.2.1, 45001-8.2a],
     pourquoi: "Scénario d'urgence souvent oublié dans les établissements de santé."}
  - {id: Q41, section: 5, secteur: logistique, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Parc d'engins (types, nombre), conducteurs et autorisations, existence d'un plan de circulation.",
     documents: [registre_habilitations, procedure_maitrise_operationnelle], exigences: [45001-7.2b, 45001-8.1.1a],
     pourquoi: "Active les règles LOG-03 / LOG-04 et le plan de circulation type."}
  - {id: Q42, section: 5, secteur: logistique, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Quais : nombre, dispositifs de sécurisation (cales, blocage de remorque, niveleurs) et incidents passés.",
     documents: [analyse_risques], exigences: [45001-6.1.2.1],
     pourquoi: "Active la règle LOG-05 et le protocole de sécurité chargement / déchargement."}
  - {id: Q43, section: 5, secteur: logistique, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Rayonnages : dernière vérification, plaques de charge, procédure en cas de choc.",
     documents: [registre_verification_equipements], exigences: [45001-9.1.1b, 45001-6.1.3b],
     pourquoi: "Active la règle LOG-01 et la vérification périodique."}
  - {id: Q44, section: 5, secteur: logistique, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Matières dangereuses stockées ou transportées (classes, quantités) ; transport routier (chauffeurs, temps de conduite, véhicules).",
     documents: [analyse_risques, registre_exigences_legales], exigences: [45001-6.1.2.1, 45001-6.1.3a],
     pourquoi: "Ajoute les textes transport et matières dangereuses au registre."}
  - {id: Q45, section: 5, secteur: horeca, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Installation au gaz : bouteilles ou réseau, emplacement, vanne de coupure, dernière vérification des flexibles.",
     documents: [analyse_risques, planning_controles_reglementaires], exigences: [45001-6.1.2.1, 45001-6.1.3b],
     pourquoi: "Active la règle HOR-03, risque majeur en cuisine."}
  - {id: Q46, section: 5, secteur: horeca, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Hygiène alimentaire : système existant (HACCP, autocontrôles, agrément ou autorisation ONSSA) ; effectif saisonnier et extras.",
     documents: [registre_exigences_legales, plan_formation], exigences: [45001-6.1.3a, 45001-7.2a],
     pourquoi: "Les extras non formés sont un risque récurrent ; l'ONSSA impose l'autocontrôle."}
  - {id: Q47, section: 5, secteur: horeca, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Capacité d'accueil autorisée, issues de secours, dernier passage de la protection civile.",
     documents: [plan_urgence], exigences: [45001-8.2a],
     pourquoi: "Établissement recevant du public : règles d'évacuation renforcées."}
  - {id: Q48, section: 5, secteur: horeca, norme: tous, seuil_minimal: non, type_reponse: texte,
     question: "Entretien des hottes et de l'extraction ; moyens d'extinction en cuisine (couverture anti-feu, extincteurs adaptés).",
     documents: [planning_controles_reglementaires, plan_urgence], exigences: [45001-6.1.3b, 45001-8.2a],
     pourquoi: "Active les règles HOR-02 et HOR-04."}
  - {id: Q49, section: 5, secteur: bureaux, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Postes sur écran : nombre et aménagement ; télétravail ; situations de travail isolé ou d'accueil du public.",
     documents: [analyse_risques], exigences: [45001-6.1.2.1],
     pourquoi: "Dangers types du tertiaire : troubles musculo-squelettiques, risques psychosociaux, agression."}
  - {id: Q50, section: 5, secteur: bureaux, norme: tous, seuil_minimal: oui, type_reponse: texte,
     question: "Bâtiment : contrôles électriques et incendie, ascenseurs, accessibilité, date et résultat du dernier exercice d'évacuation.",
     documents: [planning_controles_reglementaires, registre_exercices], exigences: [45001-6.1.3b, 45001-8.2b],
     pourquoi: "Dans les bureaux, l'essentiel des obligations porte sur le bâtiment."}

  - {id: Q51, section: 6, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: texte_ou_fichier,
     question: "Méthode d'évaluation des risques déjà utilisée (grille, date, auteur, participation des travailleurs) — ou absence de méthode.",
     documents: [procedure_evaluation_risques, analyse_risques], exigences: [45001-6.1.2.2],
     pourquoi: "L'agent réutilise la méthode existante ou propose la grille du barème."}
  - {id: Q52, section: 6, secteur: tous, norme: tous, seuil_minimal: oui, type_reponse: nombres,
