seuil_minimal_regle: >
  La génération v1 démarre quand toutes les questions « seuil_minimal: oui »
  applicables (secteur et norme choisis) ont une réponse non vide. Les autres
  questions peuvent être renseignées après ; les documents concernés sont alors
  régénérés. Proposition : afficher un compteur du type « 24/24 réponses obligatoires » (le total dépend des normes et du secteur choisis)
  et lister celles qui manquent.
