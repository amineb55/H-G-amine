  - {id: Q86, section: 6, secteur: tous, norme: 14001, seuil_minimal: non, type_reponse: choix_multiple,
     question: "Scénarios d'urgence environnementale redoutés (déversement, fuite de gaz réfrigérant, incendie avec eaux d'extinction, inondation) et moyens en place (kits absorbants, obturateurs, rétentions).",
     documents: [plan_urgence], exigences: [14001-8.2],
