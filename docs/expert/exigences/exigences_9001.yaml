# =====================================================================
# MODÈLE D'EXIGENCES ISO 9001 — EXIGENCES SPÉCIFIQUES ET NUANCES
# Statut : BROUILLON v0.1 — rédigé par l'assistant IA, À RELIRE ET VALIDER
#          par Amine Boukha (certifié 9001). Mêmes conventions que 45001.
# Tronc commun : les exigences HLS (contexte, parties intéressées, leadership,
#   rôles, risques du système, objectifs, ressources, compétences, sensibilisation,
#   communication, documentation, audit interne, revue de direction, NC / actions
#   correctives, amélioration) sont portées par les enregistrements 45001 marqués
#   hls_commun: oui. Ce fichier ne contient que les exigences propres à la
#   qualité et les nuances réelles (champ optionnel `nuance_de` : id de
#   l'enregistrement commun que cette exigence précise). Le loader doit
#   accepter le champ `nuance_de`.
# =====================================================================

- id: 9001-4.4.1
  chapitre: 4
  titre_fr: Processus — critères, indicateurs, ressources, pilotes
  titre_en: Processes — criteria, indicators, resources, owners
  exigence_fr: >
    Chaque processus du système a des éléments d'entrée et de sortie définis, un
    enchaînement connu, des critères et méthodes de fonctionnement et de pilotage
    (indicateurs), des ressources attribuées, un pilote responsable, et ses risques
    et opportunités identifiés. Les processus sont évalués et modifiés quand ils
    n'atteignent pas leurs résultats. Le système est décrit au niveau nécessaire
    pour être compris et maintenu, sans lourdeur inutile.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Cartographie avec interactions entre processus"
    - "Fiches processus avec indicateurs, pilote, ressources, risques"
    - "Comptes rendus de revues de processus"
  questions_audit:
    - "Montrez-moi la fiche du processus commercial et son dernier indicateur hors cible."
    - "Qui a modifié un processus cette année, et pourquoi ?"
  documents_types: [cartographie_processus, fiche_processus]
  hls_commun: oui
  equivalences: [45001-4.4, 14001-4.4]
  nuance_de: 45001-4.4
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Fiches processus sans indicateur ; pilotes non désignés ; risques du processus
    confondus avec les risques produit.
  poids: 2

- id: 9001-5.1.2
  chapitre: 5
  titre_fr: Orientation client
  titre_en: Customer focus
  exigence_fr: >
    La direction fait en sorte que les exigences des clients et les exigences
    légales applicables aux produits et services soient comprises et satisfaites
    de façon constante, que les risques et opportunités pouvant affecter la
    conformité des produits et la satisfaction soient traités, et que l'attention
    portée à la satisfaction du client se maintienne dans le temps. Cela se voit
    dans les arbitrages qualité / délai / coût, dans les objectifs et dans les
    indicateurs suivis par la direction.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Objectifs et indicateurs de satisfaction et de conformité produit suivis par la direction"
    - "Décisions de direction sur des réclamations ou des risques produit"
    - "Suivi des exigences légales applicables aux produits"
  questions_audit:
    - "Quelle décision récente a privilégié la conformité du produit sur le délai ou le coût ?"
    - "Comment la direction suit-elle la satisfaction des clients ?"
  documents_types: [objectifs_qualite, tableau_indicateurs, compte_rendu_revue_direction]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Satisfaction mesurée mais jamais examinée par la direction ; exigences légales
    produit (marquage, sécurité des produits, étiquetage) inconnues.
  poids: 2

- id: 9001-5.2
  chapitre: 5
  titre_fr: Politique qualité
  titre_en: Quality policy
  exigence_fr: >
    La politique qualité est adaptée à la finalité et au contexte de l'organisme,
    sert de cadre aux objectifs qualité, et engage explicitement à satisfaire les
    exigences applicables (clients, légales, internes) et à améliorer en continu
    le système. Elle est signée, diffusée, comprise et disponible pour les parties
    intéressées ; le personnel sait dire ce qu'elle change dans son travail.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Politique signée et datée, version en vigueur"
    - "Preuves de diffusion et compréhension vérifiée en entretien"
    - "Lien visible entre la politique et les objectifs de l'année"
  questions_audit:
    - "Quel engagement de cette politique se traduit dans votre poste ?"
    - "Comment la politique a-t-elle orienté les objectifs de cette année ?"
  documents_types: [politique_qualite]
  hls_commun: oui
  equivalences: [45001-5.2, 14001-5.2]
  nuance_de: 45001-5.2
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Politique générique ; objectifs sans lien avec la politique ; politique
    qualité et politique SST contradictoires dans un système intégré.
  poids: 3

- id: 9001-6.3
  chapitre: 6
  titre_fr: Planification des modifications du système
  titre_en: Planning of changes to the system
  exigence_fr: >
    Quand l'organisme décide de modifier son système (nouveau processus,
    réorganisation, nouvel outil informatique, nouveau site, fusion), la
    modification est planifiée : sa finalité et ses conséquences possibles sont
    examinées, l'intégrité du système est préservée pendant la transition, les
    ressources sont prévues, et les responsabilités et autorités sont attribuées
    ou réattribuées avant la mise en œuvre.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Fiche de modification ou compte rendu de décision avec analyse des conséquences"
    - "Plan de transition (étapes, ressources, responsables)"
    - "Mise à jour des documents et des responsabilités"
  questions_audit:
    - "Quel changement du système a été planifié cette année, et avec quelle analyse préalable ?"
    - "Que s'est-il passé pour les commandes en cours pendant la transition ?"
  documents_types: [procedure_gestion_changement, fiche_changement]
  hls_commun: non
  equivalences: [45001-8.1.3, 14001-6.1.4]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Changements d'organisation ou d'outil décidés sans regard qualité ; documents
    mis à jour après coup ; responsabilités flottantes pendant la transition.
  poids: 2

- id: 9001-7.1.3
  chapitre: 7
  titre_fr: Infrastructure
  titre_en: Infrastructure
  exigence_fr: >
    Les bâtiments, équipements de production et de contrôle, moyens de transport
    et systèmes d'information nécessaires à la conformité des produits et services
    sont identifiés, fournis et entretenus. La maintenance est planifiée et
    enregistrée, les pannes qui affectent la qualité sont analysées, et
    l'infrastructure est adaptée avant tout changement de charge ou de produit.
    Les données sont sauvegardées et les sauvegardes testées.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Liste des équipements critiques pour la conformité"
    - "Plan de maintenance préventive et enregistrements d'intervention"
    - "Suivi des pannes et de leurs effets sur la qualité ; tests de sauvegarde"
  questions_audit:
    - "Quels équipements sont critiques pour la conformité, et quel est leur plan de maintenance ?"
    - "Quelle panne a entraîné une non-conformité produit cette année ?"
  documents_types: [plan_maintenance, registre_verification_equipements]
  hls_commun: non
  equivalences: [45001-7.1]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Maintenance uniquement curative ; équipements informatiques oubliés ;
    sauvegardes jamais testées.
  poids: 2

- id: 9001-7.1.4
  chapitre: 7
  titre_fr: Environnement pour la mise en œuvre des processus
  titre_en: Environment for the operation of processes
  exigence_fr: >
    Les conditions dans lesquelles les processus se déroulent — physiques
    (température, humidité, propreté, éclairage, bruit, poussières), sociales et
    psychologiques (charge de travail, climat, prévention des conflits) — sont
    définies là où elles influencent la conformité des produits et services,
    maintenues et surveillées ; les relevés sont conservés pour les procédés
    sensibles.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Paramètres d'ambiance définis pour les processus sensibles"
    - "Relevés (température, humidité, propreté) et actions en cas de dérive"
    - "Dispositions sur la charge de travail et l'organisation des équipes"
  questions_audit:
    - "Quels paramètres d'ambiance influencent votre produit, et comment les suivez-vous ?"
    - "Que se passe-t-il quand la température de la zone de stockage dépasse la limite ?"
  documents_types: [fiche_processus, plan_controle]
  hls_commun: non
  equivalences: [45001-8.1.1a]
  applicabilite: "tous ; renforcé pour l'agroalimentaire, les laboratoires, l'électronique, les salles propres, la pharmacie"
  regles_terrain: []
  erreurs_frequentes: >
    Conditions non définies pour les procédés sensibles ; facteurs humains ignorés ;
    relevés faits mais dérives non traitées.
  poids: 1

- id: 9001-7.1.5
  chapitre: 7
  titre_fr: Ressources de surveillance et de mesure des produits
  titre_en: Monitoring and measuring resources for products
  exigence_fr: >
    Les instruments et méthodes utilisés pour vérifier la conformité des produits
    et services sont adaptés à la mesure à réaliser, entretenus et, quand la
    fiabilité de la mesure l'exige, étalonnés ou vérifiés à intervalles définis
    par rapport à des étalons raccordés, identifiés et protégés contre les
    déréglages. Quand un instrument est trouvé faux, la validité des mesures
    précédentes est examinée et les produits concernés sont traités.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Liste des instruments avec périodicité, statut et identification"
    - "Certificats d'étalonnage avec raccordement, ou fiches de vérification interne"
    - "Analyse d'impact après découverte d'un instrument déréglé"
  questions_audit:
    - "Cet instrument est-il étalonné, par qui, et où est le certificat ?"
    - "Que s'est-il passé la dernière fois qu'un instrument a été trouvé hors tolérance ?"
  documents_types: [registre_verification_equipements, certificat_etalonnage]
  hls_commun: oui
  equivalences: [45001-9.1.1b, 14001-9.1.1]
  nuance_de: 45001-9.1.1b
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Instruments de contrôle non identifiés ; étalonnage sans raccordement ; aucune
    analyse d'impact ; pieds à coulisse personnels utilisés pour le contrôle final.
  poids: 2

- id: 9001-7.1.6
  chapitre: 7
  titre_fr: Connaissances organisationnelles
  titre_en: Organizational knowledge
  exigence_fr: >
    L'organisme a identifié les connaissances nécessaires au fonctionnement de ses
    processus et à la conformité de ses produits (savoir-faire, retours
    d'expérience, leçons des échecs, connaissances des clients, des fournisseurs et
    du marché), les conserve et les rend accessibles, et anticipe leur perte
    (départs, retraites) ou leur évolution (nouvelles technologies, nouvelles
    exigences).
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Référentiel des connaissances clés ou fiches de savoir-faire"
    - "Dispositifs de transmission : tutorat, doublons, documentation des tours de main"
    - "Capitalisation des retours d'expérience de projets ou de réclamations"
  questions_audit:
    - "Quelle connaissance critique repose sur une seule personne, et que faites-vous ?"
    - "Où sont capitalisés les retours d'expérience de vos projets ?"
  documents_types: [registre_connaissances, matrice_competences]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Exigence traitée par une phrase dans le manuel ; départs non anticipés ;
    retours d'expérience non exploités.
  poids: 1

- id: 9001-8.1
  chapitre: 8
  titre_fr: Planification et maîtrise de la réalisation
  titre_en: Operational planning and control
  exigence_fr: >
    Pour réaliser ses produits et services, l'organisme a défini leurs exigences,
    les critères d'acceptation, les ressources et les contrôles nécessaires à
    chaque étape ; il conserve les enregistrements qui prouvent que le processus
    s'est déroulé comme prévu, maîtrise les modifications planifiées, examine les
    conséquences des modifications imprévues, et garde la maîtrise des processus
    confiés à l'extérieur.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Plans de contrôle, gammes ou plans qualité par produit ou famille"
    - "Dossiers de fabrication ou de prestation avec enregistrements de contrôle"
    - "Traitement documenté des modifications imprévues"
  questions_audit:
    - "Montrez-moi la planification d'une commande récente : contrôles prévus, enregistrements produits."
    - "Que s'est-il passé lors de la dernière modification imprévue (panne, rupture de matière) ?"
  documents_types: [plan_controle, procedure_maitrise_operationnelle, dossier_fabrication]
  hls_commun: oui
  equivalences: [45001-8.1.1a, 14001-8.1a]
  nuance_de: 45001-8.1.1a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Contrôles réalisés mais non enregistrés ; critères d'acceptation implicites ;
    modifications imprévues non analysées.
  poids: 3

- id: 9001-8.2.1
  chapitre: 8
  titre_fr: Communication avec les clients
  titre_en: Customer communication
  exigence_fr: >
    Les échanges avec les clients sont organisés : informations sur les produits
    et services, traitement des demandes et des devis, contrats et commandes y
    compris leurs modifications, recueil des retours et des réclamations, gestion
    des biens confiés par le client et, si nécessaire, dispositions particulières
    en cas d'urgence (rupture, rappel de produit).
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Canaux et responsables définis (commercial, ADV, service client)"
    - "Enregistrement des demandes, devis et réclamations"
    - "Conditions générales, catalogue ou fiches produit à jour"
  questions_audit:
    - "Comment une réclamation client arrive-t-elle jusqu'à vous, et comment est-elle tracée ?"
    - "Comment le client est-il informé d'un retard ou d'une non-conformité ?"
  documents_types: [procedure_communication_client, fiche_reclamation_client]
  hls_commun: non
  equivalences: [45001-7.4.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Réclamations traitées par téléphone sans trace ; informations produit
    obsolètes sur le site ou le catalogue ; retards non annoncés.
  poids: 2

- id: 9001-8.2.2
  chapitre: 8
  titre_fr: Détermination des exigences relatives aux produits et services
  titre_en: Determining requirements for products and services
  exigence_fr: >
    Avant de proposer un produit ou un service, l'organisme définit l'ensemble de
    ses exigences : celles exprimées par le client, celles implicites pour l'usage
    prévu, les exigences légales et réglementaires applicables au produit
    (sécurité, étiquetage, normes obligatoires), et celles que l'organisme
    s'impose. Il ne propose que ce qu'il est capable de tenir.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Cahiers des charges, spécifications, fiches produit ou descriptifs de prestation"
    - "Liste des exigences réglementaires applicables aux produits"
    - "Catalogue ou offre à jour, cohérente avec les capacités"
  questions_audit:
    - "Quelles exigences réglementaires s'appliquent à ce produit, et où sont-elles listées ?"
    - "Quelle exigence implicite avez-vous ajoutée à une offre récente ?"
  documents_types: [cahier_charges_produit, registre_exigences_legales]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Exigences réglementaires produit inconnues ; exigences implicites non
    formalisées, source de litiges ; offres rédigées sans consulter la production.
  poids: 2

- id: 9001-8.2.3
  chapitre: 8
  titre_fr: Revue des exigences avant engagement
  titre_en: Review of requirements before commitment
  exigence_fr: >
    Avant d'accepter une commande, un contrat ou un appel d'offres, l'organisme
    vérifie qu'il a compris toutes les exigences, y compris celles de livraison et
    d'après-vente, que les écarts entre l'offre et la commande sont résolus, et
    qu'il a la capacité de tenir ses engagements (délais, quantités, compétences,
    équipements). Les résultats de la revue et toute nouvelle exigence sont
    enregistrés ; les commandes orales sont confirmées avant acceptation.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Revue de contrat ou de commande signée ou validée (papier ou ERP)"
    - "Traces de résolution des écarts offre / commande"
    - "Confirmation écrite des commandes orales"
  questions_audit:
    - "Montrez-moi la revue de votre dernière commande importante."
    - "Que s'est-il passé quand une commande dépassait vos capacités ?"
  documents_types: [revue_contrat, contrat_client]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Revue réduite à un tampon ; capacité jamais vérifiée ; commandes orales non
    confirmées ; exigences de livraison oubliées.
  poids: 3

- id: 9001-8.2.4
  chapitre: 8
  titre_fr: Modifications des exigences du client
  titre_en: Changes to customer requirements
  exigence_fr: >
    Lorsque les exigences d'un produit ou d'un service changent après acceptation
    (quantité, spécification, délai, lieu de livraison), les documents concernés
    sont mis à jour et les personnes qui en ont besoin — production, achats,
    logistique, sous-traitants — sont informées avant d'agir, et la trace de la
    modification est conservée.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Avenants ou commandes modifiées avec date et diffusion"
    - "Version à jour des documents de production"
    - "Information tracée des sous-traitants concernés"
  questions_audit:
    - "Comment l'atelier apprend-il qu'un client a modifié sa commande ?"
    - "Montrez-moi une modification récente et sa diffusion."
  documents_types: [fiche_modification, contrat_client]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Modifications transmises oralement ; documents de production périmés ;
    sous-traitants non prévenus.
  poids: 1

- id: 9001-8.3a
  chapitre: 8
  titre_fr: Conception et développement — planification
  titre_en: Design and development — planning
  exigence_fr: >
    Quand l'organisme conçoit des produits ou services, chaque projet de
    conception est planifié selon sa nature, sa durée et sa complexité : étapes et
    revues, activités de vérification et de validation, responsabilités,
    ressources internes et externes, interfaces, implication des clients et
    utilisateurs, exigences pour la production ultérieure, niveau de maîtrise
    attendu par les clients et parties intéressées, enregistrements à conserver.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Procédure ou méthode de conception"
    - "Plan de projet avec étapes, revues, responsables, ressources"
    - "Enregistrements des revues de conception"
  questions_audit:
    - "Montrez-moi la planification de votre dernier projet de conception."
    - "Qui a participé aux revues, et le client a-t-il été impliqué ?"
  documents_types: [procedure_conception, dossier_conception]
  hls_commun: non
  equivalences: [14001-8.1b]
  applicabilite: "tous ; exclusion admise si l'organisme ne conçoit ni ne développe rien (fabrication sur plans clients, négoce) — à justifier dans le domaine d'application ; la personnalisation de produits ou la création d'une nouvelle prestation est une conception"
  regles_terrain: []
  erreurs_frequentes: >
    Exclusion abusive de la conception ; revues non tracées ; conception faite
    « dans la tête » du dirigeant sans plan.
  poids: 2

- id: 9001-8.3b
  chapitre: 8
  titre_fr: Conception — éléments d'entrée et de sortie
  titre_en: Design — inputs and outputs
  exigence_fr: >
    Les données de départ de chaque conception sont complètes, non ambiguës et
    cohérentes : exigences fonctionnelles et de performance, retours de
    conceptions similaires, exigences légales et normes, conséquences possibles
    d'une défaillance du produit. Les résultats de la conception répondent à ces
    données, sont exploitables pour la production et la prestation, incluent les
    critères d'acceptation et de contrôle, et précisent ce qui est essentiel pour
    l'usage sûr et correct du produit.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Cahier des charges de conception validé"
    - "Dossier de définition : plans, spécifications, nomenclatures, notices"
    - "Traçabilité entre exigences d'entrée et résultats de sortie"
  questions_audit:
    - "Où sont les exigences légales dans les données d'entrée de ce projet ?"
    - "Comment la production reçoit-elle les résultats de la conception ?"
  documents_types: [dossier_conception, cahier_charges_produit]
  hls_commun: non
  equivalences: []
  applicabilite: "tous ; voir 9001-8.3a pour l'exclusion"
  regles_terrain: []
  erreurs_frequentes: >
    Données d'entrée incomplètes découvertes en production ; sorties sans critères
    d'acceptation ; notices d'utilisation absentes.
  poids: 2

- id: 9001-8.3c
  chapitre: 8
  titre_fr: Conception — revues, vérification, validation, modifications
  titre_en: Design — reviews, verification, validation, changes
  exigence_fr: >
    Tout au long de la conception, des revues évaluent l'atteinte des résultats,
    des vérifications confirment que les sorties répondent aux entrées, et une
    validation prouve que le produit remplit son usage prévu dans les conditions
    réelles ou simulées. Les problèmes détectés sont traités. Les modifications de
    conception sont identifiées, revues, autorisées, et leurs effets sur les
    produits déjà livrés ou en cours sont examinés ; le tout est enregistré.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Comptes rendus de revues, de vérifications et de validations (essais, prototypes, pilotes)"
    - "Fiches de modification de conception avec analyse d'impact et autorisation"
    - "Actions issues des problèmes détectés"
  questions_audit:
    - "Comment avez-vous validé que ce produit fonctionne chez le client ?"
    - "Quelle modification de conception a eu un impact sur des produits déjà livrés ?"
  documents_types: [dossier_conception, fiche_modification]
  hls_commun: non
  equivalences: []
  applicabilite: "tous ; voir 9001-8.3a pour l'exclusion"
  regles_terrain: []
  erreurs_frequentes: >
    Vérification et validation confondues ; modifications non tracées ; produit
    livré sans validation ; essais faits mais non enregistrés.
  poids: 2

- id: 9001-8.4.1
  chapitre: 8
  titre_fr: Prestataires externes — sélection, évaluation, surveillance
  titre_en: External providers — selection, evaluation, monitoring
  exigence_fr: >
    Les produits, services et processus fournis par des prestataires externes sont
    conformes aux exigences : les prestataires sont sélectionnés selon des critères
    définis, évalués avant contrat, surveillés pendant l'exécution (qualité livrée,
    délais, réclamations) et réévalués périodiquement ; les résultats de ces
    évaluations et les décisions prises (maintien, plan d'amélioration, retrait)
    sont enregistrés.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Liste des prestataires approuvés avec critères de sélection"
    - "Grilles d'évaluation et suivi des performances (taux de conformité, retards)"
    - "Décisions tracées (maintien, surveillance renforcée, retrait)"
  questions_audit:
    - "Sur quels critères avez-vous approuvé ce fournisseur ?"
    - "Quel fournisseur a été retiré ou mis sous surveillance, et pourquoi ?"
  documents_types: [procedure_achats, evaluation_prestataires_externes, liste_prestataires_approuves]
  hls_commun: non
  equivalences: [45001-8.1.4.2a, 14001-8.1a]
  nuance_de: 45001-8.1.4.2a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Évaluation annuelle formelle sans données ; prestataires imposés par un client
    non évalués ; services (transport, informatique, étalonnage) oubliés.
  poids: 3

- id: 9001-8.4.2
  chapitre: 8
  titre_fr: Type et étendue de la maîtrise des prestataires
  titre_en: Type and extent of control of external providers
  exigence_fr: >
    Le niveau de contrôle exercé sur chaque prestataire est proportionné à l'effet
    de sa prestation sur la conformité du produit final : les processus
    externalisés restent sous la responsabilité de l'organisme, les contrôles à
    réception et les audits fournisseurs sont définis en fonction du risque, et
    l'efficacité des propres contrôles du prestataire est prise en compte pour
    alléger ou renforcer la surveillance.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Classification des prestataires par criticité"
    - "Plans de contrôle à réception adaptés à la criticité"
    - "Rapports d'audit fournisseur ou d'évaluation sur site"
  questions_audit:
    - "Pourquoi ce fournisseur est-il audité et pas celui-là ?"
    - "Que contrôlez-vous à réception de ce composant critique ?"
  documents_types: [plan_controle, evaluation_prestataires_externes]
  hls_commun: non
  equivalences: [45001-8.1.4.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Même niveau de contrôle pour tous ; contrôle à réception supprimé sans preuve
    de fiabilité ; processus externalisé hors de tout contrôle.
  poids: 2

- id: 9001-8.4.3
  chapitre: 8
  titre_fr: Informations transmises aux prestataires
  titre_en: Information for external providers
  exigence_fr: >
    Avant de commander, l'organisme s'assure que le prestataire reçoit des
    exigences complètes et exactes : produit ou service attendu, méthodes,
    procédés et équipements imposés, conditions de libération, compétences
    requises, interactions avec l'organisme, mode de surveillance prévu, activités
    de vérification que l'organisme ou son client réaliseront chez le prestataire.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Commandes et cahiers des charges avec ces exigences"
    - "Contrats de sous-traitance"
    - "Conditions générales d'achat"
  questions_audit:
    - "Montrez-moi la dernière commande d'un composant critique et ses exigences de contrôle."
    - "Le sous-traitant sait-il que votre client peut venir l'auditer ?"
  documents_types: [cahier_charges_achats, procedure_achats]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Commandes réduites à une référence et un prix ; exigences de contrôle non
    transmises ; plans envoyés dans une version périmée.
  poids: 2

- id: 9001-8.5.1
  chapitre: 8
  titre_fr: Maîtrise de la production et de la prestation de service
  titre_en: Control of production and service provision
  exigence_fr: >
    La production et la prestation se déroulent dans des conditions maîtrisées :
    documents décrivant les caractéristiques des produits et les résultats à
    obtenir disponibles aux postes, moyens de surveillance et de mesure en place
    aux étapes prévues, infrastructure et environnement adaptés, personnel
    compétent, activités de libération, de livraison et d'après-livraison
    définies, prévention des erreurs humaines (détrompeurs, check-lists), et
    validation périodique des procédés dont le résultat ne peut pas être vérifié
    ensuite (soudure, stérilisation, collage, traitement thermique).
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Gammes, instructions et plans de contrôle disponibles aux postes"
    - "Enregistrements de contrôle en cours de production"
    - "Dossiers de validation des procédés spéciaux et dispositifs anti-erreur"
  questions_audit:
    - "Quels sont vos procédés spéciaux, et comment sont-ils validés ?"
    - "Quel dispositif empêche une erreur de montage à ce poste ?"
  documents_types: [instruction_travail, plan_controle, dossier_validation_procede]
  hls_commun: non
  equivalences: [45001-8.1.1a]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Procédés spéciaux non identifiés ; instructions absentes aux postes ;
    prévention des erreurs humaines ignorée ; instruments de contrôle absents en
    ligne.
  poids: 3

- id: 9001-8.5.2
  chapitre: 8
  titre_fr: Identification et traçabilité
  titre_en: Identification and traceability
  exigence_fr: >
    Les produits, composants et lots sont identifiés à chaque étape quand cela est
    nécessaire à la conformité, leur statut de contrôle (en attente, conforme, non
    conforme) est visible, et lorsque la traçabilité est exigée par le client, la
    réglementation ou le risque, une identification unique permet de remonter aux
    matières, aux opérations, aux équipements et aux personnes, dans les deux sens,
    avec des enregistrements conservés.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Étiquetage, marquage, fiches suiveuses, codes de lot"
    - "Enregistrements de traçabilité (matières, opérations, contrôles)"
    - "Test de traçabilité réalisé (remonter d'un produit livré à ses matières)"
  questions_audit:
    - "À partir de ce produit livré, retrouvez-moi le lot de matière et l'opérateur."
    - "Comment reconnaît-on un produit en attente de contrôle ?"
  documents_types: [procedure_tracabilite, fiche_suiveuse]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Statut de contrôle non visible ; traçabilité impossible à démontrer en
    pratique ; identification perdue lors du conditionnement.
  poids: 2

- id: 9001-8.5.3
  chapitre: 8
  titre_fr: Propriété des clients et des prestataires externes
  titre_en: Property belonging to customers or external providers
  exigence_fr: >
    Les biens confiés par les clients ou les prestataires — matières, composants,
    outillages, emballages, données, locaux, propriété intellectuelle, données
    personnelles — sont identifiés, vérifiés à réception, protégés et sauvegardés
    pendant qu'ils sont sous le contrôle de l'organisme ; toute perte,
    détérioration ou inaptitude à l'usage est signalée au propriétaire et
    enregistrée.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Registre des propriétés confiées et contrôle à réception"
    - "Règles de protection (stockage, accès, sauvegarde, confidentialité)"
    - "Enregistrements de signalement en cas de perte ou de dommage"
  questions_audit:
    - "Quelles propriétés de clients détenez-vous en ce moment, et où sont-elles identifiées ?"
    - "Comment protégez-vous les données ou les plans confidentiels de vos clients ?"
  documents_types: [registre_proprietes_client, procedure_preservation]
  hls_commun: non
  equivalences: []
  applicabilite: "tous ; dans les services, la propriété du client est souvent immatérielle (données, fichiers, accès)"
  regles_terrain: []
  erreurs_frequentes: >
    Données et informations non reconnues comme propriété du client ; outillages
    clients non identifiés ; incidents non signalés.
  poids: 1

- id: 9001-8.5.4
  chapitre: 8
  titre_fr: Préservation des produits
  titre_en: Preservation
  exigence_fr: >
    Les produits et leurs composants sont préservés tout au long de la production
    et jusqu'à la livraison : identification, manutention, protection contre la
    contamination et les chocs, conditionnement, stockage, conditions de
    conservation (température, humidité, durée de vie), rotation des stocks,
    transport et transmission des données, de façon à rester conformes jusqu'au
    client.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Règles de stockage, de conditionnement et de manutention"
    - "Suivi des conditions de conservation et des dates limites, gestion premier entré – premier sorti"
    - "Contrôle des emballages et du transport"
  questions_audit:
    - "Comment garantissez-vous que ce produit arrive intact chez le client ?"
    - "Que devient un produit dont la durée de conservation est dépassée ?"
  documents_types: [procedure_preservation, instruction_travail]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Dates limites dépassées en stock ; produits stockés au sol ou à l'humidité ;
    transport non maîtrisé ; données livrées sans contrôle d'intégrité.
  poids: 1

- id: 9001-8.5.5
  chapitre: 8
  titre_fr: Activités après livraison
  titre_en: Post-delivery activities
  exigence_fr: >
    Les obligations après la livraison — garantie, maintenance, assistance,
    pièces de rechange, reprise ou recyclage, obligations légales, engagements
    contractuels — sont définies en tenant compte des risques du produit, de sa
    nature et de sa durée d'usage, et des retours des clients ; elles sont
    réalisées et tracées.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Contrats, conditions de garantie et de service après-vente"
    - "Enregistrements des interventions après livraison"
    - "Analyse des retours et des demandes de garantie"
  questions_audit:
    - "Quelles sont vos obligations après livraison, et où sont-elles définies ?"
    - "Comment un retour sous garantie est-il traité et analysé ?"
  documents_types: [procedure_apres_vente, fiche_reclamation_client]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Garanties promises non organisées ; retours non analysés ; obligations légales
    de reprise ignorées.
  poids: 1

- id: 9001-8.5.6
  chapitre: 8
  titre_fr: Maîtrise des modifications en production
  titre_en: Control of changes in production
  exigence_fr: >
    Toute modification en cours de production ou de prestation — matière,
    procédé, outillage, fournisseur, planning, personnel — est revue et autorisée
    par une personne habilitée avant application, ses effets sur la conformité
    sont examinés, et l'enregistrement conserve la description, les résultats de
    la revue, l'autorisation et les actions décidées.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Fiches de modification ou de dérogation de procédé"
    - "Autorisations signées par une personne habilitée"
    - "Analyse d'impact sur les produits en cours"
  questions_audit:
    - "Qui peut autoriser un changement de matière en cours de fabrication, et sur quel document ?"
    - "Montrez-moi la dernière modification autorisée et son analyse."
  documents_types: [fiche_modification, procedure_gestion_changement]
  hls_commun: non
  equivalences: [45001-8.1.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Modifications appliquées par l'atelier sans revue ; effets sur les produits en
    cours non examinés ; matière de substitution non tracée.
  poids: 2

- id: 9001-8.6
  chapitre: 8
  titre_fr: Libération des produits et services
  titre_en: Release of products and services
  exigence_fr: >
    Un produit n'est livré, et un service rendu, qu'après vérification que les
    exigences prévues à chaque étape sont satisfaites, sauf autorisation explicite
    d'une personne habilitée et, si nécessaire, du client. Les enregistrements de
    libération indiquent les preuves de conformité aux critères d'acceptation et
    la personne qui a autorisé la libération.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Plan de contrôle final et enregistrements avec résultats et signature"
    - "Liste des personnes habilitées à libérer"
    - "Dérogations documentées avec accord client si nécessaire"
  questions_audit:
    - "Qui a libéré cette livraison, et sur quelle base ?"
    - "Avez-vous déjà livré sous dérogation, et le client a-t-il été informé ?"
  documents_types: [fiche_liberation, plan_controle, fiche_derogation]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Libération implicite par l'expédition ; contrôles finaux sans enregistrement ;
    dérogations verbales.
  poids: 3

- id: 9001-8.7
  chapitre: 8
  titre_fr: Maîtrise des produits et services non conformes
  titre_en: Control of nonconforming outputs
  exigence_fr: >
    Les produits et services qui ne répondent pas aux exigences sont identifiés et
    isolés pour ne pas être utilisés ou livrés par erreur, y compris ceux détectés
    après livraison ; ils sont traités par correction, isolement, retour,
    suspension, information du client ou acceptation par dérogation autorisée ; la
    conformité est revérifiée après correction. Les enregistrements décrivent la
    non-conformité, les actions, les dérogations et l'autorité qui a décidé.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Procédure et zone d'isolement identifiée (quarantaine)"
    - "Registre des non-conformités produit avec traitement et revérification"
    - "Dérogations et informations client enregistrées"
  questions_audit:
    - "Montrez-moi votre zone de quarantaine et le registre associé."
    - "Que devient un produit non conforme détecté chez le client ?"
  documents_types: [procedure_produit_non_conforme, registre_produits_non_conformes, fiche_derogation]
  hls_commun: non
  equivalences: [45001-10.2b]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Produits non conformes mélangés aux conformes ; retouches sans revérification ;
    non-conformités produit non reliées aux actions correctives.
  poids: 3

- id: 9001-9.1.2
  chapitre: 9
  titre_fr: Satisfaction du client
  titre_en: Customer satisfaction
  exigence_fr: >
    L'organisme mesure la perception des clients sur la satisfaction de leurs
    besoins et attentes avec des méthodes définies (enquêtes, entretiens,
    réclamations, taux de fidélité, avis publics, retours des commerciaux),
    analyse les résultats et en tire des actions ; la mesure ne se limite pas à
    l'absence de réclamation.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Méthode et fréquence de mesure définies"
    - "Résultats analysés (tendances, par client, par produit)"
    - "Actions issues de l'analyse"
  questions_audit:
    - "Comment mesurez-vous la satisfaction, et qu'avez-vous changé grâce à cette mesure ?"
    - "Quel client insatisfait avez-vous reconquis, et comment ?"
  documents_types: [enquete_satisfaction, fiche_reclamation_client, tableau_indicateurs]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Enquête envoyée mais réponses non exploitées ; satisfaction confondue avec
    absence de réclamation ; aucune action.
  poids: 2

- id: 9001-9.1.3
  chapitre: 9
  titre_fr: Analyse et évaluation des données qualité
  titre_en: Analysis and evaluation of quality data
  exigence_fr: >
    Les données de surveillance sont analysées pour évaluer la conformité des
    produits et services, le degré de satisfaction des clients, la performance
    des processus et du système, l'efficacité de la planification et des actions
    face aux risques, la performance des prestataires externes et les besoins
    d'amélioration ; les résultats alimentent la revue de direction.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Tableau de bord analysé : conformité produit, satisfaction, processus, fournisseurs"
    - "Comptes rendus d'analyse et décisions"
  questions_audit:
    - "Quelle tendance de conformité produit observez-vous, et quelle décision en découle ?"
    - "Comment évaluez-vous la performance de vos prestataires ?"
  documents_types: [tableau_indicateurs, compte_rendu_revue_direction]
  hls_commun: oui
  equivalences: [45001-9.1.1c, 14001-9.1.1]
  nuance_de: 45001-9.1.1c
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Données collectées sans analyse ; performance des fournisseurs non évaluée ;
    coûts de non-qualité inconnus.
  poids: 2
