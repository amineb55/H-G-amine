- id: 45001-8.1.1a
  chapitre: 8
  titre_fr: Maîtrise opérationnelle — critères et méthodes
  titre_en: Operational control — criteria and methods
  exigence_fr: >
    Les activités présentant des risques sont réalisées dans des conditions
    maîtrisées : critères de sécurité définis, procédures ou instructions adaptées,
    équipements conformes et vérifiés, personnel compétent, permis ou autorisations
    pour les tâches dangereuses, adaptation du travail aux personnes. La maîtrise est
    visible sur le terrain et pas seulement écrite, et les enregistrements prouvent
    son application.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Procédures et instructions opérationnelles pour les activités à risque"
    - "Permis de travail (feu, hauteur, espace confiné, consignation) remplis et signés avant les travaux"
    - "Contrôles de prise de poste, check-lists d'engins"
    - "Observation terrain cohérente avec les documents"
  questions_audit:
    - "Comment démarre-t-on une tâche en hauteur ici ? Qui l'autorise, sur quel document ?"
    - "Montrez-moi le dernier permis de feu et la vérification faite avant les travaux."
    - "Que se passe-t-il quand une procédure ne peut pas être appliquée ?"
  documents_types: [procedure_maitrise_operationnelle, instruction_travail, permis_de_travail, checklist_prise_de_poste]
  hls_commun: oui
  equivalences: [9001-8.1, 14001-8.1]
  applicabilite: tous
  regles_terrain: [IND-01, IND-02, IND-10, LOG-05, HOR-03]
  erreurs_frequentes: >
    Procédures rédigées mais inconnues des opérateurs ; permis signés après coup ;
    consignation absente en maintenance ; écart terrain / document non détecté.
  poids: 3

- id: 45001-8.1.1b
  chapitre: 8
  titre_fr: Coordination sur les sites partagés
  titre_en: Coordination on shared sites
  exigence_fr: >
    Quand plusieurs employeurs interviennent sur un même lieu (chantiers, sites
    clients, sous-traitants sur site, locaux partagés), l'organisme coordonne avec
    eux les parties pertinentes de son système : information mutuelle sur les
    dangers, règles communes, plan de prévention ou protocole, interlocuteurs
    identifiés, réunions et inspections communes.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Plan de prévention ou protocole de coordination signé par les parties"
    - "Comptes rendus de réunions de coordination"
    - "Inspections communes tracées"
    - "Consignes du site d'accueil remises aux intervenants"
  questions_audit:
    - "Quels dangers le client vous a-t-il signalés sur son site, et comment les avez-vous transmis à vos équipes ?"
    - "Qui arbitre quand deux entreprises ont des activités incompatibles au même endroit ?"
  documents_types: [plan_prevention, protocole_securite]
  hls_commun: non
  equivalences: []
  applicabilite: "tous ; renforcé pour BTP, logistique, industrie et toute intervention chez un client"
  regles_terrain: []
  erreurs_frequentes: >
    Coactivité gérée oralement ; plan de prévention générique non adapté au chantier ;
    sous-traitants du sous-traitant ignorés.
  poids: 2

- id: 45001-8.1.2a
  chapitre: 8
  titre_fr: Hiérarchie des mesures de maîtrise
  titre_en: Hierarchy of controls
  exigence_fr: >
    Pour réduire un risque, l'organisme cherche d'abord à supprimer le danger, puis à
    le remplacer par moins dangereux, puis à protéger collectivement par des moyens
    techniques, puis à agir par l'organisation et la formation, et seulement en
    dernier par les protections individuelles. Cet ordre est appliqué et visible dans
    les choix de mesures, et le recours aux protections individuelles est justifié.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Analyse des risques avec mesures classées selon cet ordre"
    - "Justification écrite quand seule une protection individuelle est retenue"
    - "Exemples de suppression ou de substitution réalisés (produit, procédé, équipement)"
  questions_audit:
    - "Donnez-moi un exemple où vous avez supprimé un danger plutôt que de vous en protéger."
    - "Pourquoi ce risque est-il traité uniquement par des EPI ?"
    - "Quelle protection collective avez-vous mise en place cette année ?"
  documents_types: [analyse_risques, procedure_evaluation_risques, plan_actions]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: [IND-01, IND-06, IND-10, LOG-03, SAN-06]
  erreurs_frequentes: >
    EPI comme réponse par défaut ; mesures organisationnelles (« faire attention »)
    sans mesure technique ; hiérarchie connue mais non tracée dans l'analyse.
  poids: 3

- id: 45001-8.1.2b
  chapitre: 8
  titre_fr: Gestion des équipements de protection individuelle
  titre_en: Management of personal protective equipment
  exigence_fr: >
    Les protections individuelles nécessaires par poste sont définies à partir de
    l'évaluation des risques, fournies gratuitement, adaptées aux personnes et aux
    risques, conformes, remplacées à temps ; leur port est expliqué, formé et vérifié,
    et les dotations sont enregistrées.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Tableau des EPI par poste"
    - "Fiches de dotation signées"
    - "Preuve de conformité (marquage, notice) et de renouvellement"
    - "Contrôle du port sur le terrain et suites données"
  questions_audit:
    - "Sur quelle base avez-vous choisi ce type de masque ?"
    - "Que faites-vous quand un EPI est refusé ou inadapté ?"
    - "Qui contrôle le port, et que se passe-t-il en cas de manquement ?"
  documents_types: [registre_epi, fiche_dotation_epi, analyse_risques]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: [IND-06, SAN-11, HOR-07, LOG-03]
  erreurs_frequentes: >
    EPI non adaptés (tailles, protections auditives inefficaces) ; dotation sans
    enregistrement ; port non contrôlé ; travailleurs temporaires non équipés.
  poids: 2

- id: 45001-8.1.3
  chapitre: 8
  titre_fr: Gestion du changement
  titre_en: Management of change
  exigence_fr: >
    Les changements qui peuvent affecter la santé-sécurité — nouveaux produits,
    procédés, équipements, organisation, horaires, effectifs, réglementation,
    connaissances sur un danger — sont identifiés avant leur mise en œuvre, évalués,
    accompagnés de mesures et communiqués. Les changements imprévus sont examinés
    après coup et leurs conséquences traitées.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Procédure ou fiche de gestion du changement"
    - "Analyses réalisées avant des changements récents (nouvelle machine, réorganisation)"
    - "Mise à jour de l'analyse des risques et des formations liées"
  questions_audit:
    - "Quel est le dernier changement significatif, et quelle analyse SST a précédé sa mise en œuvre ?"
    - "Comment un remplacement de produit chimique est-il examiné avant l'achat ?"
    - "Que s'est-il passé lors du dernier changement imprévu (panne, absence) ?"
  documents_types: [procedure_gestion_changement, fiche_changement, analyse_risques]
  hls_commun: non
  equivalences: [9001-6.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Changements décidés par la production sans regard SST ; analyse faite après
    l'installation ; changements temporaires (remplaçants, horaires) ignorés.
  poids: 2

- id: 45001-8.1.4.1
  chapitre: 8
  titre_fr: Achats intégrant la santé-sécurité
  titre_en: Procurement with OH&S criteria
  exigence_fr: >
    Les achats de produits, d'équipements et de services intègrent des critères de
    santé-sécurité avant la commande : conformité, dangers du produit, documentation,
    exigences de réception et de mise en service. Ce qui entre dans l'organisme est
    vérifié conforme à ce qui était attendu avant d'être utilisé.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Cahiers des charges ou clauses SST dans les commandes"
    - "Contrôle à réception : conformité, FDS, notice, marquage"
    - "Vérification avant première mise en service d'un équipement"
  questions_audit:
    - "Quels critères SST figurent dans votre dernière commande d'équipement ?"
    - "Qui vérifie qu'un produit chimique nouveau arrive avec sa fiche de données de sécurité ?"
    - "Quelle machine a été refusée ou modifiée à la réception ?"
  documents_types: [procedure_achats, cahier_charges_sst, fiche_reception]
  hls_commun: non
  equivalences: [9001-8.4, 14001-8.1]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Achats pilotés uniquement par le prix ; équipements d'occasion sans vérification ;
    FDS demandées après l'utilisation.
  poids: 2

- id: 45001-8.1.4.2a
  chapitre: 8
  titre_fr: Sous-traitants — sélection et exigences contractuelles
  titre_en: Contractors — selection and contractual requirements
  exigence_fr: >
    Les sous-traitants sont choisis aussi sur leur capacité à travailler en sécurité :
    critères définis, évaluation avant contrat, exigences SST écrites dans le contrat
    (compétences, habilitations, équipements, règles du site, déclaration des
    incidents), et réévaluation périodique sur les résultats.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Critères de sélection et grille d'évaluation SST des sous-traitants"
    - "Clauses SST des contrats"
    - "Dossiers des sous-traitants (attestations, habilitations, assurance)"
    - "Évaluations périodiques"
  questions_audit:
    - "Comment avez-vous évalué la sécurité de votre principal sous-traitant avant de le retenir ?"
    - "Quelles exigences SST figurent dans son contrat ?"
    - "Avez-vous déjà écarté un sous-traitant pour des raisons de sécurité ?"
  documents_types: [procedure_sous_traitants, evaluation_sous_traitants, cahier_charges_sst]
  hls_commun: non
  equivalences: [9001-8.4.1]
  applicabilite: "tous ; exclusion possible si aucun sous-traitant n'intervient (à justifier dans le domaine d'application)"
  regles_terrain: []
  erreurs_frequentes: >
    Sous-traitants sélectionnés sur le seul prix ; aucune clause SST ; sous-traitance en
    cascade non maîtrisée.
  poids: 3

- id: 45001-8.1.4.2b
  chapitre: 8
  titre_fr: Sous-traitants — coordination et surveillance sur site
  titre_en: Contractors — on-site coordination and supervision
  exigence_fr: >
    Les dangers que les sous-traitants apportent, ceux qu'ils rencontrent chez
    l'organisme et ceux créés par la coactivité sont identifiés et maîtrisés
    ensemble : accueil sécurité, plan de prévention ou permis, contrôle des
    habilitations et des équipements à l'arrivée, surveillance pendant les travaux,
    traitement de leurs incidents comme ceux du personnel interne.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Accueils sécurité des sous-traitants tracés"
    - "Plans de prévention et permis spécifiques"
    - "Inspections des zones de travail des sous-traitants"
    - "Incidents de sous-traitants dans le registre"
  questions_audit:
    - "Montrez-moi l'accueil sécurité du sous-traitant présent aujourd'hui."
    - "Qui surveille son intervention, et avec quel document ?"
    - "Ses incidents sont-ils dans vos statistiques ?"
  documents_types: [plan_prevention, livret_accueil, permis_de_travail, registre_accidents]
  hls_commun: non
  equivalences: []
  applicabilite: "tous ; exclusion possible si aucun sous-traitant n'intervient (à justifier)"
  regles_terrain: [IND-10, LOG-05]
  erreurs_frequentes: >
    Sous-traitants non accueillis ni surveillés ; leurs accidents hors statistiques ;
    habilitations non contrôlées à l'entrée.
  poids: 3

- id: 45001-8.1.4.3
  chapitre: 8
  titre_fr: Processus externalisés
  titre_en: Outsourced processes
  exigence_fr: >
    Les activités confiées à l'extérieur mais qui restent dans le périmètre du
    système (maintenance, transport, gardiennage, nettoyage, restauration) sont
    identifiées, et l'organisme définit et exerce une maîtrise proportionnée sur leur
    manière de gérer la santé-sécurité, cohérente avec ses exigences légales et son
    système.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Liste des processus externalisés et niveau de maîtrise défini pour chacun"
    - "Exigences transmises et preuves de contrôle (audits fournisseurs, indicateurs, réunions)"
    - "Contrats intégrant ces exigences"
  questions_audit:
    - "Quelles activités avez-vous externalisées, et comment savez-vous qu'elles sont faites en sécurité ?"
    - "Quel contrôle exercez-vous sur votre prestataire de transport ou de maintenance ?"
  documents_types: [liste_processus_externalises, contrat_externalisation, evaluation_sous_traitants]
  hls_commun: non
  equivalences: [9001-8.4.1]
  applicabilite: "tous ; exclusion possible si aucun processus n'est externalisé (à justifier)"
  regles_terrain: []
  erreurs_frequentes: >
    Externalisation utilisée pour sortir une activité dangereuse du périmètre ; aucune
    maîtrise définie ; prestataire jamais évalué.
  poids: 2

- id: 45001-8.2a
  chapitre: 8
  titre_fr: Situations d'urgence — identification et plans
  titre_en: Emergencies — identification and plans
  exigence_fr: >
    Les situations d'urgence possibles sont identifiées à partir des dangers et du
    contexte (incendie, explosion, fuite ou déversement, accident grave, malaise,
    effondrement, intempéries, agression, coupure d'énergie) et, pour chacune, un
    plan décrit comment alerter, évacuer ou confiner, secourir, arrêter les
    installations et communiquer avec les secours et les autorités. Les plans sont
    adaptés à chaque site.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Liste des scénarios d'urgence reliée à l'analyse des risques"
    - "Plans d'urgence par site : consignes, plans d'évacuation, points de rassemblement, numéros utiles"
    - "Moyens d'intervention identifiés et vérifiés (extincteurs, alarme, trousse de secours)"
  questions_audit:
    - "Quels scénarios avez-vous retenus, lesquels avez-vous écartés, et pourquoi ?"
    - "Que fait le gardien de nuit en cas de départ de feu ?"
    - "Où est le point de rassemblement de ce bâtiment ?"
  documents_types: [plan_urgence, consignes_urgence, analyse_risques]
  hls_commun: non
  equivalences: [14001-8.2]
  applicabilite: tous
  regles_terrain: [IND-08, IND-09, SAN-08, LOG-08, HOR-04, HOR-05]
  erreurs_frequentes: >
    Plan unique « incendie » ignorant les autres scénarios ; plan générique sans
    adaptation au site ; issues et moyens non vérifiés ; numéros d'urgence non
    affichés.
  poids: 3

- id: 45001-8.2b
  chapitre: 8
  titre_fr: Exercices, tests et révision des plans d'urgence
  titre_en: Drills, tests and revision of emergency plans
  exigence_fr: >
    Les plans d'urgence sont testés par des exercices périodiques couvrant les
    scénarios principaux et les différents horaires, les moyens d'intervention sont
    vérifiés à fréquence définie, et chaque exercice ou situation réelle donne lieu à
    une évaluation dont les enseignements modifient les plans, la formation ou les
    moyens.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Planning et comptes rendus d'exercices : date, scénario, participants, temps d'évacuation, écarts constatés"
    - "Registre de vérification des moyens (extincteurs, alarme, éclairage de sécurité, trousses)"
    - "Révisions des plans après exercice ou événement"
  questions_audit:
    - "Quand a eu lieu le dernier exercice, quels écarts ont été constatés, et qu'avez-vous changé ?"
    - "L'équipe de nuit a-t-elle déjà été exercée ?"
    - "Vos extincteurs sont-ils tous vérifiés, et par qui ?"
  documents_types: [registre_exercices, rapport_exercice, registre_verification_equipements]
  hls_commun: non
  equivalences: [14001-8.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Exercice annuel formel sans évaluation ; postes de nuit et sites secondaires jamais
    exercés ; extincteurs vérifiés mais issues obstruées.
  poids: 3

- id: 45001-8.2c
  chapitre: 8
  titre_fr: Formation, information et communication d'urgence
  titre_en: Emergency training, information and communication
  exigence_fr: >
    Chaque personne présente sur site, quel que soit son statut, sait quoi faire en
    cas d'urgence : consignes remises à l'accueil, rôles attribués et formés (guides
    et serre-files, équipiers de première intervention, secouristes), informations
    partagées avec les sous-traitants, les visiteurs, les secours et les autorités
    selon les obligations.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Formations des équipiers et des secouristes avec dates de validité"
    - "Consignes d'urgence remises aux visiteurs et aux sous-traitants"
    - "Liste des rôles d'urgence affichée et à jour"
    - "Entretiens terrain"
  questions_audit:
    - "Qui sont les secouristes de cette équipe, et comment les reconnaît-on ?"
    - "Que reçoit un visiteur à son arrivée ?"
    - "Comment les pompiers accèdent-ils au plan des installations ?"
  documents_types: [plan_urgence, plan_formation, livret_accueil]
  hls_commun: non
  equivalences: [14001-8.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Rôles d'urgence attribués à des personnes parties ; aucun secouriste par poste ou
    par équipe ; visiteurs et sous-traitants non informés.
  poids: 2

- id: 45001-9.1.1a
  chapitre: 9
  titre_fr: Surveillance et mesure de la performance
  titre_en: Monitoring and measurement of performance
  exigence_fr: >
    L'organisme a défini ce qu'il surveille et mesure pour connaître sa performance en
    santé-sécurité : respect des exigences légales, avancement des objectifs,
    efficacité des mesures de maîtrise, expositions (bruit, produits, poussières),
    incidents et presqu'accidents, résultats des inspections. Pour chaque élément, la
    méthode, la fréquence, le responsable et le moment d'analyse sont définis, et les
    résultats sont enregistrés.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Tableau des indicateurs proactifs et réactifs avec définitions et fréquences"
    - "Planning d'inspections et de mesures d'exposition"
    - "Enregistrements de surveillance (rondes, inspections, mesures) conservés"
  questions_audit:
    - "Quels indicateurs suivez-vous en plus des accidents, et pourquoi ceux-là ?"
    - "Quand avez-vous mesuré pour la dernière fois le bruit ou les expositions chimiques ?"
    - "Qui analyse les résultats des rondes de sécurité ?"
  documents_types: [procedure_surveillance_mesure, tableau_indicateurs, rapport_inspection]
  hls_commun: oui
  equivalences: [9001-9.1.1, 14001-9.1.1]
  applicabilite: tous
  regles_terrain: [IND-12, LOG-09, SAN-07]
  erreurs_frequentes: >
    Seuls les taux de fréquence et de gravité sont suivis ; expositions jamais
    mesurées ; inspections réalisées mais résultats non exploités.
  poids: 2

- id: 45001-9.1.1b
  chapitre: 9
  titre_fr: Équipements de mesure et de surveillance
  titre_en: Monitoring and measuring equipment
  exigence_fr: >
    Les appareils utilisés pour mesurer ou surveiller des paramètres de
    santé-sécurité (sonomètres, détecteurs de gaz, luxmètres, dosimètres, appareils
    de contrôle des dispositifs de sécurité) sont adaptés, entretenus, étalonnés ou
    vérifiés à intervalles définis, et les résultats des vérifications sont
    conservés.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Liste des équipements de mesure avec périodicité"
    - "Certificats d'étalonnage ou preuves de vérification"
    - "Traitement des mesures faites avec un appareil trouvé défaillant"
  questions_audit:
    - "Quand ce détecteur de gaz a-t-il été étalonné ?"
    - "Que faites-vous si un appareil est trouvé hors tolérance ?"
  documents_types: [registre_verification_equipements, certificat_etalonnage]
  hls_commun: oui
  equivalences: [9001-7.1.5, 14001-9.1.1]
  applicabilite: "tous ; peu ou pas de matériel dans les bureaux (à justifier si sans objet)"
  regles_terrain: []
  erreurs_frequentes: >
    Détecteurs de gaz jamais étalonnés ; mesures faites par un prestataire sans vérifier
    ses certificats ; appareils inconnus du système.
  poids: 1

- id: 45001-9.1.1c
  chapitre: 9
  titre_fr: Analyse et évaluation des résultats
  titre_en: Analysis and evaluation of results
  exigence_fr: >
    Les données de surveillance sont analysées et non seulement collectées :
    tendances, comparaisons entre sites ou périodes, causes des écarts, efficacité
    des actions. Cette analyse produit des conclusions qui alimentent la revue de
    direction, les objectifs et le plan d'action.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Tableau de bord commenté (tendances, alertes)"
    - "Analyses périodiques présentées en comité ou en revue"
    - "Décisions prises à partir des résultats"
  questions_audit:
    - "Quelle tendance vos indicateurs montrent-ils sur douze mois, et qu'en avez-vous déduit ?"
    - "Quelle décision découle de votre dernière analyse des presqu'accidents ?"
  documents_types: [tableau_indicateurs, compte_rendu_revue_direction]
  hls_commun: oui
  equivalences: [9001-9.1.3, 14001-9.1.1]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Chiffres reportés sans commentaire ; aucune analyse des causes de tendance ;
    résultats non partagés avec les travailleurs.
  poids: 2

- id: 45001-9.1.2
  chapitre: 9
  titre_fr: Évaluation de la conformité légale
  titre_en: Evaluation of compliance
  exigence_fr: >
    À une fréquence définie et avec une méthode définie, l'organisme vérifie qu'il
    respecte chacune des exigences légales et autres de son registre, enregistre le
    résultat exigence par exigence, traite les écarts par des actions, et sait à tout
    moment où il en est de sa conformité.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Procédure d'évaluation de la conformité (méthode, fréquence, responsable)"
    - "Rapport ou grille d'évaluation datée, exigence par exigence, avec statut et preuve"
    - "Actions issues des écarts et leur suivi"
    - "Connaissance du statut de conformité par la direction"
  questions_audit:
    - "Quand avez-vous évalué votre conformité pour la dernière fois, et quel a été le résultat ?"
    - "Quel écart réglementaire avez-vous identifié, et comment l'avez-vous traité ?"
    - "Quelles exigences n'ont pas pu être évaluées, et pourquoi ?"
  documents_types: [procedure_evaluation_conformite, rapport_evaluation_conformite, plan_actions]
  hls_commun: non
  equivalences: [14001-9.1.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Confusion entre veille (identifier les textes) et évaluation (vérifier qu'on les
    respecte) ; évaluation globale « conforme » sans détail par exigence ; écarts connus
    mais non tracés pour ne pas « s'auto-accuser ».
  poids: 3

- id: 45001-9.2.1
  chapitre: 9
  titre_fr: Audit interne — réalisation
  titre_en: Internal audit — conduct
  exigence_fr: >
    Des audits internes sont réalisés à intervalles planifiés pour vérifier que le
    système est conforme aux exigences de la norme et à celles que l'organisme s'est
    fixées, et qu'il est efficacement mis en œuvre. Les auditeurs sont compétents,
    objectifs et n'auditent pas leur propre travail ; les résultats sont rapportés à
    la direction, aux travailleurs et à leurs représentants, et les écarts sont
    traités.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Rapports d'audit avec constats reliés aux exigences, preuves et classification"
    - "Compétence et indépendance des auditeurs (formation, affectation)"
    - "Communication des résultats"
    - "Actions correctives issues des audits"
  questions_audit:
    - "Qui a audité la fonction SST elle-même, et est-il indépendant de cette fonction ?"
    - "Combien de constats a produit votre dernier audit interne, et où en est leur traitement ?"
    - "Comment les travailleurs ont-ils eu connaissance des résultats ?"
  documents_types: [procedure_audit_interne, rapport_audit, plan_audit]
  hls_commun: oui
  equivalences: [9001-9.2.1, 14001-9.2.1]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Audit interne fait par le responsable QSE sur son propre système ; rapports sans
    constat (« tout conforme ») ; audit documentaire sans terrain ; résultats non
    communiqués aux travailleurs.
  poids: 2

- id: 45001-9.2.2
  chapitre: 9
  titre_fr: Programme d'audit
  titre_en: Audit programme
  exigence_fr: >
    Un programme d'audit couvre l'ensemble du périmètre et des exigences sur un cycle
    défini, avec une fréquence et une profondeur qui tiennent compte de l'importance
    des risques des processus, des résultats des audits précédents et des
    changements. Il précise méthodes, responsabilités, planification et communication
    des résultats, et prévoit la consultation des travailleurs lors de sa
    préparation.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Programme d'audit annuel ou pluriannuel justifié par les risques"
    - "Couverture vérifiable de tous les processus et sites sur le cycle"
    - "Ajustements après incident, changement ou mauvais résultat"
  questions_audit:
    - "Pourquoi ce processus est-il audité une fois par an, et celui-là tous les trois ans ?"
    - "Tous vos sites ont-ils été audités sur le cycle ?"
    - "Qu'avez-vous changé au programme après le dernier accident ?"
  documents_types: [programme_audit, procedure_audit_interne]
  hls_commun: oui
  equivalences: [9001-9.2.2, 14001-9.2.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Programme identique chaque année sans lien avec les risques ; sites secondaires
    jamais audités ; audits regroupés juste avant la certification.
  poids: 2

- id: 45001-9.3a
  chapitre: 9
  titre_fr: Revue de direction — éléments examinés
  titre_en: Management review — inputs
  exigence_fr: >
    La direction examine le système à intervalles planifiés en s'appuyant sur des
    éléments factuels : suites des revues précédentes ; évolution du contexte, des
    parties intéressées, des exigences légales et des risques ; atteinte de la
    politique et des objectifs ; incidents, non-conformités, actions correctives ;
    résultats de surveillance, de conformité, d'audit et de consultation ; adéquation
    des ressources ; communications reçues ; opportunités d'amélioration.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Ordre du jour ou trame couvrant ces éléments"
    - "Dossier préparatoire avec données (tableaux, rapports)"
    - "Participation effective de la direction (présence, décisions)"
  questions_audit:
    - "Montrez-moi les données de conformité légale et de consultation examinées lors de la dernière revue."
    - "Quels éléments manquaient, et pourquoi ?"
  documents_types: [compte_rendu_revue_direction, tableau_indicateurs]
  hls_commun: oui
  equivalences: [9001-9.3.2, 14001-9.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Revue réduite à une présentation du responsable QSE ; éléments incomplets
    (consultation, conformité légale absentes) ; revue tenue une fois pour l'audit.
  poids: 2

- id: 45001-9.3b
  chapitre: 9
  titre_fr: Revue de direction — décisions et suites
  titre_en: Management review — decisions and outputs
  exigence_fr: >
    La revue aboutit à des conclusions écrites sur la pertinence, l'adéquation et
    l'efficacité du système, et à des décisions : opportunités d'amélioration,
    changements à apporter au système, ressources à allouer, actions, intégration de
    la SST dans la stratégie, évolution de la politique ou des objectifs. Ces
    conclusions sont communiquées aux travailleurs et à leurs représentants, et les
    décisions sont suivies.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Compte rendu avec conclusions et décisions (responsable, échéance)"
    - "Suivi des décisions dans le plan d'action"
    - "Preuve de communication aux travailleurs"
  questions_audit:
    - "Quelle décision de la dernière revue a été mise en œuvre, et avec quel résultat ?"
    - "Comment les travailleurs ont-ils été informés des conclusions ?"
  documents_types: [compte_rendu_revue_direction, plan_actions]
  hls_commun: oui
  equivalences: [9001-9.3.3, 14001-9.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Compte rendu descriptif sans décision ; décisions non suivies ; aucune
    communication vers les travailleurs.
  poids: 2

- id: 45001-10.1
  chapitre: 10
  titre_fr: Dispositif d'amélioration
  titre_en: Improvement arrangements
  exigence_fr: >
    L'organisme identifie les occasions d'améliorer sa performance SST à partir de
    toutes les sources disponibles (incidents, audits, surveillance, consultation,
    revue, veille) et met en œuvre les actions nécessaires pour atteindre les
    résultats attendus de son système.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Sources d'amélioration identifiées et traitées dans un dispositif unique"
    - "Exemples d'améliorations réalisées et leur origine"
  questions_audit:
    - "D'où viennent vos actions d'amélioration de l'année, et lesquelles ont eu le plus d'effet ?"
  documents_types: [plan_actions, tableau_amelioration]
  hls_commun: oui
  equivalences: [9001-10.1, 14001-10.1]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Amélioration limitée aux actions correctives ; sources non exploitées
    (presqu'accidents, propositions).
  poids: 1

- id: 45001-10.2a
  chapitre: 10
  titre_fr: Déclaration, enquête et analyse des incidents
  titre_en: Incident reporting, investigation and analysis
  exigence_fr: >
    Tout incident — accident, presqu'accident, atteinte à la santé, situation
    dangereuse — est déclaré rapidement, enregistré, et fait l'objet d'une enquête
    proportionnée à sa gravité, avec la participation des travailleurs concernés et
    de leurs représentants, pour établir les faits et les causes profondes, y compris
    organisationnelles. Les obligations légales de déclaration sont respectées dans
    les délais.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Procédure de déclaration et d'enquête avec délais et responsabilités"
    - "Registre des incidents complet (y compris presqu'accidents et sous-traitants)"
    - "Rapports d'enquête avec méthode d'analyse des causes"
    - "Déclarations légales datées"
  questions_audit:
    - "Montrez-moi l'enquête du dernier accident : qui y a participé, et quelles causes organisationnelles ont été trouvées ?"
    - "Combien de presqu'accidents avez-vous enregistrés ce trimestre ?"
    - "Dans quel délai déclarez-vous un accident du travail, et à qui ?"
  documents_types: [procedure_incident, rapport_enquete_incident, registre_accidents]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Enquête limitée à « faute de l'opérateur » ; presqu'accidents non enregistrés ;
    déclaration hors délai légal ; travailleurs absents de l'enquête.
  poids: 3

- id: 45001-10.2b
  chapitre: 10
  titre_fr: Traitement des non-conformités et actions correctives
  titre_en: Nonconformity handling and corrective action
  exigence_fr: >
    Chaque non-conformité (écart d'audit, d'inspection, de conformité légale, de
    procédure) est traitée : réaction immédiate pour maîtriser la situation, analyse
    des causes avec une méthode adaptée, recherche de situations similaires ailleurs,
    action corrective proportionnée, revue de l'évaluation des risques si nécessaire,
    et mise à jour du système. Le tout est enregistré.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Fiches ou registre de non-conformités avec cause, action, responsable, échéance, statut"
    - "Utilisation d'outils d'analyse (5 pourquoi, arbre des causes, Ishikawa)"
    - "Mise à jour de l'analyse des risques ou des procédures après action"
  questions_audit:
    - "Prenez une non-conformité récente : quelle en était la cause profonde, et qu'avez-vous changé ?"
    - "Avez-vous cherché si le même problème existait sur un autre site ou un autre poste ?"
  documents_types: [fiche_nc_action_corrective, registre_nc, plan_actions]
  hls_commun: oui
  equivalences: [9001-10.2, 14001-10.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Correction confondue avec action corrective ; causes non analysées ; actions
    systématiquement de type « rappel » ou « sensibilisation » ; non-conformités closes
    sans preuve.
  poids: 3

- id: 45001-10.2c
  chapitre: 10
  titre_fr: Vérification de l'efficacité et communication des suites
  titre_en: Effectiveness check and communication of outcomes
  exigence_fr: >
    Après mise en œuvre, l'efficacité de chaque action corrective est vérifiée à une
    échéance définie, par une preuve (observation, mesure, absence de récurrence), et
    la non-conformité n'est close qu'ensuite. Les résultats des enquêtes et des
    actions sont communiqués aux travailleurs concernés et à leurs représentants.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Champ « vérification d'efficacité » renseigné avec date, méthode et résultat"
    - "Récurrences analysées"
    - "Comptes rendus de communication (causeries, comité)"
  questions_audit:
    - "Comment avez-vous vérifié que cette action a fonctionné ?"
    - "Quelle action a été jugée inefficace, et qu'avez-vous fait ensuite ?"
    - "Les équipes ont-elles été informées des conclusions ?"
  documents_types: [fiche_nc_action_corrective, registre_causeries]
  hls_commun: oui
  equivalences: [9001-10.2, 14001-10.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Actions closes le jour de leur réalisation sans vérification ; récurrence non
    détectée ; enquête connue de la seule direction.
  poids: 2

- id: 45001-10.3
  chapitre: 10
  titre_fr: Amélioration continue démontrée
  titre_en: Demonstrated continual improvement
  exigence_fr: >
    L'organisme améliore de façon continue la pertinence, l'adéquation et l'efficacité
    de son système et sa performance SST : il développe la culture de prévention,
    fait participer les travailleurs à l'amélioration, communique les résultats,
    conserve les preuves des progrès réalisés et sait démontrer une tendance sur
    plusieurs années.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Historique des indicateurs et des objectifs sur plusieurs cycles"
    - "Initiatives d'amélioration portées par les travailleurs"
    - "Communication des progrès"
  questions_audit:
    - "Qu'est-ce qui est meilleur aujourd'hui qu'il y a deux ans, et comment le prouvez-vous ?"
    - "Quelle amélioration vient directement d'une proposition d'opérateur ?"
  documents_types: [tableau_amelioration, tableau_indicateurs]
  hls_commun: oui
  equivalences: [9001-10.3, 14001-10.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Amélioration déclarée mais non démontrée ; indicateurs stagnants sans réaction ;
    aucune trace de participation.
  poids: 1
