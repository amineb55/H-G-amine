# =====================================================================
# MODÈLE D'EXIGENCES ISO 14001 — EXIGENCES SPÉCIFIQUES ET NUANCES
# Statut : BROUILLON v0.1 — rédigé par l'assistant IA, À RELIRE ET VALIDER
#          par Amine Boukha (certifié 14001). Mêmes conventions que 45001 ;
#          champ optionnel `nuance_de` (voir exigences_9001.yaml).
# Règles terrain associées : regles_terrain/environnement.yaml (ENV-xx),
#          applicables à tous les secteurs.
# =====================================================================

- id: 14001-4.1
  chapitre: 4
  titre_fr: Enjeux incluant les conditions environnementales
  titre_en: Issues including environmental conditions
  exigence_fr: >
    L'analyse de contexte inclut les conditions environnementales qui influencent
    l'organisme ou qu'il influence : climat et stress hydrique, qualité de l'air et
    de l'eau, biodiversité, disponibilité des ressources, ainsi que les attentes
    croissantes des clients, des financeurs et des autorités sur l'environnement et
    le carbone. Elle est revue périodiquement et alimente l'identification des
    aspects significatifs et des risques.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Analyse de contexte avec volet environnemental explicite"
    - "Lien avec le registre des aspects et les risques du système"
    - "Trace de revue"
  questions_audit:
    - "Quelle condition environnementale (eau, climat, voisinage) pèse sur votre activité, et comment en tenez-vous compte ?"
    - "Quel client ou financeur vous a interrogé sur votre performance environnementale ?"
  documents_types: [analyse_contexte]
  hls_commun: oui
  equivalences: [45001-4.1, 9001-4.1]
  nuance_de: 45001-4.1
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Contexte copié du système qualité sans volet environnemental ; changement
    climatique et pénurie d'eau non considérés ; voisinage oublié.
  poids: 1

- id: 14001-4.3
  chapitre: 4
  titre_fr: Domaine d'application et cycle de vie
  titre_en: Scope and life cycle
  exigence_fr: >
    Le domaine d'application précise les sites, activités, produits et services
    couverts, en tenant compte de ce que l'organisme peut maîtriser ou influencer
    sur le cycle de vie de ses produits ; toutes les activités, produits et
    services ayant des aspects environnementaux significatifs sont inclus, et le
    périmètre n'est pas utilisé pour écarter une activité polluante (stockage de
    carburant, station de lavage, transport, chaufferie).
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Déclaration de domaine d'application"
    - "Cohérence avec le registre des aspects significatifs et les autorisations détenues"
    - "Justification écrite de toute exclusion"
  questions_audit:
    - "Le stockage de carburant, la station de lavage ou le transport sont-ils dans le périmètre ?"
    - "Les produits que vous vendez sont-ils couverts, ou seulement vos sites ?"
  documents_types: [declaration_domaine_application]
  hls_commun: oui
  equivalences: [45001-4.3, 9001-4.3]
  nuance_de: 45001-4.3
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Exclusion des activités les plus impactantes ; produits et services oubliés,
    seuls les sites étant cités.
  poids: 2

- id: 14001-5.1
  chapitre: 5
  titre_fr: Leadership environnemental
  titre_en: Environmental leadership
  exigence_fr: >
    La direction assume la responsabilité de l'efficacité du système
    environnemental, intègre les exigences environnementales dans les processus
    métiers (investissements, achats, conception, production, maintenance),
    fournit les ressources, oriente et soutient le personnel, et rend compte de
    la performance environnementale. Cela se voit dans les arbitrages (traitement
    des rejets, choix des produits, gestion des déchets) et dans la place de
    l'environnement à l'ordre du jour de la direction.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Décisions d'investissement environnemental tracées"
    - "PV de comité de direction avec points environnementaux"
    - "Ressources allouées (budget, temps, prestataires)"
  questions_audit:
    - "Quel investissement environnemental avez-vous décidé cette année, et pourquoi ?"
    - "Comment l'environnement entre-t-il dans vos décisions d'achat ?"
  documents_types: [pv_comite_direction, compte_rendu_revue_direction]
  hls_commun: oui
  equivalences: [45001-5.1a, 9001-5.1.1]
  nuance_de: 45001-5.1a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Environnement délégué au responsable QSE ; aucun budget ; performance
    environnementale jamais présentée à la direction.
  poids: 2

- id: 14001-5.2
  chapitre: 5
  titre_fr: Politique environnementale
  titre_en: Environmental policy
  exigence_fr: >
    La politique environnementale engage explicitement à protéger
    l'environnement, y compris par la prévention de la pollution et par d'autres
    engagements adaptés au contexte (usage durable des ressources, atténuation du
    changement climatique et adaptation, protection de la biodiversité), à
    respecter les obligations de conformité, et à améliorer en continu le système
    pour améliorer la performance environnementale ; elle est signée, diffusée,
    comprise et disponible pour les parties intéressées.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Politique signée et datée"
    - "Preuves de diffusion interne et externe, compréhension vérifiée"
    - "Cohérence avec les aspects significatifs et les objectifs"
  questions_audit:
    - "Quel engagement concret prenez-vous au-delà de la prévention de la pollution, et pourquoi celui-là ?"
    - "Comment un sous-traitant sur site en prend-il connaissance ?"
  documents_types: [politique_environnementale]
  hls_commun: oui
  equivalences: [45001-5.2, 9001-5.2]
  nuance_de: 45001-5.2
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Engagements génériques ; absence de l'engagement de prévention de la
    pollution ; politique inconnue des sous-traitants sur site.
  poids: 3

- id: 14001-6.1.2a
  chapitre: 6
  titre_fr: Aspects environnementaux — identification
  titre_en: Environmental aspects — identification
  exigence_fr: >
    L'organisme a identifié, avec une méthode définie, les aspects
    environnementaux de ses activités, produits et services qu'il peut maîtriser
    ou influencer, et leurs impacts : émissions dans l'air, rejets dans l'eau et
    le sol, consommations d'énergie, d'eau et de matières, déchets, bruit, odeurs,
    occupation des sols, dans des conditions normales, anormales et d'urgence, en
    tenant compte des étapes du cycle de vie (achats, conception, transport,
    usage, fin de vie) et des changements prévus.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Procédure ou méthode d'identification"
    - "Registre des aspects et impacts par activité et par étape de cycle de vie"
    - "Situations d'urgence et changements pris en compte ; mise à jour datée"
  questions_audit:
    - "Comment avez-vous identifié les aspects d'une activité nouvelle ?"
    - "Où sont les aspects liés au transport et à la fin de vie de vos produits ?"
  documents_types: [procedure_aspects_environnementaux, registre_aspects_impacts]
  hls_commun: non
  equivalences: [45001-6.1.2.1]
  applicabilite: tous
  regles_terrain: [ENV-01, ENV-03, ENV-05, ENV-06, ENV-10]
  erreurs_frequentes: >
    Registre limité au site (transport, achats, fin de vie ignorés) ; situations
    d'urgence absentes ; aspects non mis à jour après changement.
  poids: 3

- id: 14001-6.1.2b
  chapitre: 6
  titre_fr: Aspects environnementaux significatifs
  titre_en: Significant environmental aspects
  exigence_fr: >
    Les aspects sont évalués avec des critères définis (ampleur, fréquence,
    sensibilité du milieu, obligations, attentes des parties intéressées,
    maîtrise existante) pour déterminer ceux qui ont ou peuvent avoir un impact
    significatif ; la liste des aspects significatifs est établie, communiquée
    aux niveaux et fonctions concernés, et sert de base aux objectifs, à la
    maîtrise opérationnelle et à la surveillance.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Grille de cotation avec critères et seuils"
    - "Liste des aspects significatifs, datée"
    - "Communication interne ; lien avec objectifs et procédures"
  questions_audit:
    - "Quels sont vos cinq aspects significatifs, et pourquoi ceux-là ?"
    - "Comment le chef d'atelier sait-il quels aspects le concernent ?"
  documents_types: [registre_aspects_impacts, procedure_aspects_environnementaux]
  hls_commun: non
  equivalences: [45001-6.1.2.2]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Tous les aspects cotés significatifs, ou aucun ; critères non écrits ;
    aspects significatifs sans objectif ni procédure.
  poids: 3

- id: 14001-6.1.3a
  chapitre: 6
  titre_fr: Obligations de conformité environnementales
  titre_en: Environmental compliance obligations
  exigence_fr: >
    L'organisme connaît ses obligations de conformité liées à ses aspects
    environnementaux : lois et règlements (rejets, air, eau, déchets, bruit,
    produits chimiques, autorisations, études d'impact), autorisations et
    déclarations détenues avec leurs prescriptions, et engagements volontaires
    (exigences clients, chartes, normes). Ces obligations sont listées,
    accessibles, tenues à jour, et l'organisme sait comment chacune s'applique à
    lui.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Registre des obligations avec articles et modalités d'application"
    - "Copies des autorisations, avec leurs prescriptions transcrites en obligations"
    - "Veille tracée (source, fréquence, dernière mise à jour)"
  questions_audit:
    - "Quelles prescriptions figurent dans votre autorisation de rejet, et comment les suivez-vous ?"
    - "Quel est le dernier texte environnemental intégré à votre registre ?"
  documents_types: [registre_exigences_legales, autorisations_environnementales, procedure_veille_reglementaire]
  hls_commun: non
  equivalences: [45001-6.1.3a]
  nuance_de: 45001-6.1.3a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Autorisations périmées ou introuvables ; prescriptions des autorisations non
    transcrites ; exigences environnementales des clients ignorées.
  poids: 3

- id: 14001-6.1.4
  chapitre: 6
  titre_fr: Planification des actions environnementales
  titre_en: Planning environmental actions
  exigence_fr: >
    Des actions sont planifiées pour traiter les aspects significatifs, les
    obligations de conformité et les risques et opportunités identifiés,
    intégrées aux processus du système ou aux processus métiers, et leur
    efficacité est évaluée ; les choix tiennent compte des options
    technologiques et des contraintes financières, opérationnelles et
    commerciales.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Plan d'action environnemental consolidé"
    - "Lien visible avec les aspects significatifs et les obligations"
    - "Suivi et évaluation d'efficacité"
  questions_audit:
    - "Quelle action traite votre aspect significatif le plus important, et quel est son résultat mesuré ?"
  documents_types: [plan_actions, programme_environnemental]
  hls_commun: oui
  equivalences: [45001-6.1.4, 9001-6.1.2]
  nuance_de: 45001-6.1.4
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Actions sans lien avec les aspects significatifs ; efficacité non mesurée.
  poids: 2

- id: 14001-6.2
  chapitre: 6
  titre_fr: Objectifs environnementaux et planification
  titre_en: Environmental objectives and planning
  exigence_fr: >
    Des objectifs environnementaux sont fixés pour les fonctions et niveaux
    concernés, cohérents avec la politique, mesurables si possible, tenant compte
    des aspects significatifs, des obligations et des risques et opportunités ;
    pour chacun, un programme précise les actions, ressources, responsables,
    échéances et l'indicateur d'évaluation, et l'organisme intègre ces actions
    dans ses processus.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Objectifs avec indicateurs, cibles et échéances"
    - "Programme environnemental avec actions, ressources, responsables"
    - "Suivi périodique"
  questions_audit:
    - "Quel objectif traite votre consommation d'eau ou vos déchets, et où en est-il ?"
    - "Comment mesurez-vous l'atteinte de cet objectif ?"
  documents_types: [objectifs_environnementaux, programme_environnemental, tableau_indicateurs]
  hls_commun: oui
  equivalences: [45001-6.2.1, 45001-6.2.2, 9001-6.2.1]
  nuance_de: 45001-6.2.1
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Objectifs de moyens uniquement ; pas d'indicateur ; programme sans ressources.
  poids: 2

- id: 14001-7.2
  chapitre: 7
  titre_fr: Compétences et sensibilisation environnementales
  titre_en: Environmental competence and awareness
  exigence_fr: >
    Les personnes dont le travail peut causer un impact environnemental
    significatif ou affecter la conformité (opérateurs de stockage et de
    traitement, maintenance, gestion des déchets, conducteurs, prestataires sur
    site) sont compétentes : besoins définis, formations réalisées et évaluées,
    preuves conservées. Chacun connaît la politique, les aspects significatifs de
    son poste, sa contribution et les conséquences d'un écart, y compris en
    situation d'urgence.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Matrice de compétences avec volet environnement"
    - "Formations déchets, déversement, conduite économe, exploitation des équipements de traitement"
    - "Entretiens avec des opérateurs et des prestataires"
  questions_audit:
    - "Que sait faire l'opérateur de la zone déchets en cas de fuite ?"
    - "Quels sont les aspects significatifs de votre poste ? (à un opérateur)"
  documents_types: [matrice_competences, plan_formation, support_sensibilisation]
  hls_commun: oui
  equivalences: [45001-7.2a, 45001-7.3, 9001-7.2]
  nuance_de: 45001-7.2a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Formation environnement inexistante ; prestataires non sensibilisés ;
    opérateurs de traitement des eaux sans formation.
  poids: 2

- id: 14001-7.4.3
  chapitre: 7
  titre_fr: Communication environnementale externe
  titre_en: External environmental communication
  exigence_fr: >
    L'organisme communique à l'extérieur sur l'environnement selon un processus
    défini : communications imposées par la réglementation (déclarations de
    rejets, de déchets, d'incidents), réponses aux demandes des parties
    intéressées (riverains, autorités, clients), et informations qu'il choisit de
    publier ; les informations communiquées sont cohérentes avec les données du
    système, fiables et vérifiables.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Registre des communications externes et des plaintes"
    - "Déclarations réglementaires datées"
    - "Supports publiés (rapport, site) cohérents avec les données internes"
  questions_audit:
    - "Quelle déclaration environnementale devez-vous faire chaque année, et à qui ?"
    - "Comment traitez-vous une plainte de voisinage ?"
  documents_types: [registre_communications_externes, procedure_communication]
  hls_commun: non
  equivalences: [45001-7.4.3]
  nuance_de: 45001-7.4.3
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Plaintes non enregistrées ; affirmations publiques non étayées ;
    déclarations réglementaires oubliées.
  poids: 2

- id: 14001-8.1a
  chapitre: 8
  titre_fr: Maîtrise opérationnelle des aspects significatifs
  titre_en: Operational control of significant aspects
  exigence_fr: >
    Les activités liées aux aspects significatifs et aux obligations sont
    réalisées selon des critères définis et maîtrisés : consignes de gestion des
    déchets, des stockages de produits et de carburants, des rejets et des
    effluents, des émissions, des consommations ; les équipements de traitement
    (séparateurs, filtres, bassins, stations) sont exploités et entretenus ; les
    critères s'appliquent aussi aux prestataires sur site ; les enregistrements
    prouvent l'application.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Procédures et consignes environnementales aux postes"
    - "Enregistrements d'exploitation et de maintenance des équipements de traitement"
    - "Contrôle des prestataires (déchets, nettoyage, transport)"
  questions_audit:
    - "Comment sont exploités votre séparateur d'hydrocarbures ou votre bassin de rétention ?"
    - "Quelle consigne reçoit un sous-traitant qui manipule des produits sur votre site ?"
  documents_types: [procedure_maitrise_operationnelle, registre_dechets, instruction_travail]
  hls_commun: oui
  equivalences: [45001-8.1.1a, 9001-8.1]
  nuance_de: 45001-8.1.1a
  applicabilite: tous
  regles_terrain: [ENV-01, ENV-02, ENV-03, ENV-04, ENV-05, ENV-07, ENV-08]
  erreurs_frequentes: >
    Équipements de traitement jamais vidangés ; consignes non affichées ;
    prestataires hors périmètre.
  poids: 3

- id: 14001-8.1b
  chapitre: 8
  titre_fr: Perspective de cycle de vie — conception, achats, fin de vie
  titre_en: Life cycle perspective — design, procurement, end of life
  exigence_fr: >
    L'organisme intègre l'environnement aux étapes qu'il maîtrise ou influence
    hors de son site : critères environnementaux dans la conception des produits
    et services, dans les achats (produits, matières, énergie, prestations),
    exigences communiquées aux fournisseurs et sous-traitants, et information des
    clients ou utilisateurs sur les impacts liés au transport, à l'utilisation et
    à la fin de vie ; le niveau d'exigence est proportionné à l'influence réelle.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Critères environnementaux dans les cahiers des charges achats et conception"
    - "Clauses environnementales fournisseurs"
    - "Fiches ou notices d'information client (recyclage, élimination) ; substitutions de produits documentées"
  questions_audit:
    - "Quel critère environnemental figure dans vos achats de produits chimiques ou d'emballages ?"
    - "Que dites-vous à vos clients sur la fin de vie de votre produit ?"
  documents_types: [cahier_charges_env, procedure_achats, fiche_cycle_de_vie]
  hls_commun: non
  equivalences: [9001-8.3a, 9001-8.4.3]
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Cycle de vie traité par une phrase ; fournisseurs sans exigence ; fin de vie
    ignorée.
  poids: 2

- id: 14001-8.1c
  chapitre: 8
  titre_fr: Gestion des déchets
  titre_en: Waste management
  exigence_fr: >
    Les déchets sont identifiés par nature et par dangerosité, triés à la source,
    stockés dans des zones dédiées identifiées et protégées (rétention pour les
    dangereux, abri contre la pluie, accès contrôlé), remis à des prestataires
    autorisés avec traçabilité (bordereaux, registres, quantités), et les
    filières sont choisies dans l'ordre réduction, réemploi, recyclage,
    valorisation, élimination. Le brûlage et le dépôt sauvage sont proscrits.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Registre des déchets par catégorie avec quantités et filières"
    - "Bordereaux ou attestations des prestataires et leurs autorisations"
    - "Zones de stockage conformes constatées sur le terrain"
  questions_audit:
    - "Où vont vos déchets dangereux, et comment le prouvez-vous ?"
    - "Quelle quantité de déchets avez-vous produite cette année, par catégorie ?"
  documents_types: [registre_dechets, bordereau_suivi_dechets, contrat_prestataire_dechets]
  hls_commun: non
  equivalences: []
  applicabilite: tous
  regles_terrain: [ENV-03, ENV-04, ENV-11]
  erreurs_frequentes: >
    Déchets dangereux dans les déchets banals ; prestataires non autorisés ;
    aucune quantification ; huiles usagées « données » à des tiers.
  poids: 3

- id: 14001-8.2
  chapitre: 8
  titre_fr: Urgences environnementales
  titre_en: Environmental emergencies
  exigence_fr: >
    Les situations d'urgence à conséquences environnementales (déversement de
    produit ou de carburant, incendie avec eaux d'extinction polluées, fuite de
    fluide frigorigène, rupture de bassin, inondation) sont identifiées à partir
    des aspects ; des plans décrivent la réaction pour prévenir ou atténuer
    l'impact, les moyens (kits absorbants, obturateurs de réseau, rétentions)
    sont en place et vérifiés, les plans sont testés par des exercices, revus
    après exercice ou événement, et les personnes concernées, y compris
    prestataires et voisins, sont informées et formées.
  exigence_en: ""
  type: documentaire
  preuves_attendues:
    - "Scénarios d'urgence environnementale reliés aux aspects"
    - "Plans, consignes, inventaire et vérification des moyens"
    - "Exercices tracés (déversement simulé) et révisions"
  questions_audit:
    - "Que faites-vous si un fût de solvant se renverse près d'un avaloir ?"
    - "Quand avez-vous testé ce scénario ?"
  documents_types: [plan_urgence, consignes_urgence, registre_exercices]
  hls_commun: non
  equivalences: [45001-8.2a, 45001-8.2b]
  nuance_de: 45001-8.2a
  applicabilite: tous
  regles_terrain: [ENV-01, ENV-05, ENV-08]
  erreurs_frequentes: >
    Plan d'urgence limité à l'incendie sans volet environnemental ; kits
    absorbants absents ou périmés ; eaux d'extinction non considérées.
  poids: 3

- id: 14001-9.1.1
  chapitre: 9
  titre_fr: Surveillance et mesure environnementales
  titre_en: Environmental monitoring and measurement
  exigence_fr: >
    L'organisme surveille et mesure ce qui compte pour sa performance
    environnementale : consommations (eau, énergie, matières), rejets et
    émissions (analyses d'effluents, mesures de rejets atmosphériques, bruit),
    quantités de déchets, avancement des objectifs, maîtrise opérationnelle et
    conformité. Les méthodes, fréquences, responsables et critères d'évaluation
    sont définis, les équipements de mesure sont étalonnés ou vérifiés, les
    résultats sont analysés, comparés aux limites et enregistrés.
  exigence_en: ""
  type: mise_en_oeuvre
  preuves_attendues:
    - "Tableau d'indicateurs environnementaux avec méthode et fréquence"
    - "Rapports d'analyses de rejets (laboratoire) comparés aux valeurs limites"
    - "Relevés de compteurs ; certificats d'étalonnage"
  questions_audit:
    - "Quand avez-vous analysé vos effluents pour la dernière fois, et quels étaient les résultats par rapport aux limites ?"
    - "Comment suivez-vous votre consommation d'eau ?"
  documents_types: [procedure_surveillance_mesure, tableau_indicateurs, rapport_analyse_rejets, bilan_consommations_rejets]
  hls_commun: oui
  equivalences: [45001-9.1.1a, 45001-9.1.1b, 9001-9.1.3]
  nuance_de: 45001-9.1.1a
  applicabilite: tous
  regles_terrain: [ENV-06, ENV-10]
  erreurs_frequentes: >
    Consommations connues par les factures seulement ; rejets jamais analysés ;
    résultats non comparés aux limites.
  poids: 3

- id: 14001-9.1.2
  chapitre: 9
  titre_fr: Évaluation de la conformité environnementale
  titre_en: Environmental compliance evaluation
  exigence_fr: >
    À une fréquence définie, l'organisme évalue le respect de chacune de ses
    obligations de conformité environnementales (prescriptions d'autorisations,
    valeurs limites, déclarations, déchets, produits), enregistre le résultat
    obligation par obligation, traite les écarts, et maintient une connaissance à
    jour de son statut de conformité, présentée à la direction.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Rapport d'évaluation avec statut par obligation"
    - "Preuves associées (analyses, bordereaux, déclarations)"
    - "Actions sur les écarts"
  questions_audit:
    - "Quel est votre statut de conformité aujourd'hui, et sur quelles obligations avez-vous des écarts ?"
  documents_types: [procedure_evaluation_conformite, rapport_evaluation_conformite]
  hls_commun: non
  equivalences: [45001-9.1.2]
  nuance_de: 45001-9.1.2
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Évaluation confondue avec la veille ; écarts connus non tracés ; statut
    inconnu de la direction.
  poids: 3

- id: 14001-9.3
  chapitre: 9
  titre_fr: Revue de direction — entrées environnementales
  titre_en: Management review — environmental inputs
  exigence_fr: >
    La revue de direction examine, en plus des entrées communes, l'évolution des
    aspects significatifs, des obligations de conformité et des attentes des
    parties intéressées, les résultats de la surveillance des consommations et
    rejets, le statut de conformité, les communications externes et plaintes, et
    l'atteinte des objectifs environnementaux ; elle décide des changements du
    système et des ressources, et ses conclusions sont enregistrées.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Compte rendu couvrant ces entrées"
    - "Décisions avec responsable et échéance"
  questions_audit:
    - "Quelle décision de la dernière revue concerne un aspect significatif ?"
  documents_types: [compte_rendu_revue_direction]
  hls_commun: oui
  equivalences: [45001-9.3a, 45001-9.3b, 9001-9.3.2]
  nuance_de: 45001-9.3a
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Revue commune QSE où l'environnement est absent ; plaintes et conformité non
    examinées.
  poids: 2

- id: 14001-10.2
  chapitre: 10
  titre_fr: Non-conformités et incidents environnementaux
  titre_en: Environmental nonconformities and incidents
  exigence_fr: >
    Toute non-conformité environnementale (dépassement de limite, déversement,
    écart d'audit ou de conformité, plainte fondée) est traitée : réaction
    immédiate pour maîtriser et atténuer l'impact, analyse des causes, recherche
    de situations similaires, action corrective proportionnée, mise à jour du
    système si nécessaire ; l'efficacité est vérifiée et le tout est enregistré.
  exigence_en: ""
  type: enregistrement
  preuves_attendues:
    - "Registre des non-conformités et incidents environnementaux"
    - "Analyses de causes et actions"
    - "Vérification d'efficacité"
  questions_audit:
    - "Quel incident environnemental avez-vous eu, et qu'avez-vous changé ?"
  documents_types: [fiche_nc_action_corrective, registre_nc]
  hls_commun: oui
  equivalences: [45001-10.2b, 45001-10.2c, 9001-10.2]
  nuance_de: 45001-10.2b
  applicabilite: tous
  regles_terrain: []
  erreurs_frequentes: >
    Déversements non enregistrés comme incidents ; actions limitées au nettoyage.
  poids: 2
