# =====================================================================
# ÉCHELLES ET BARÈMES — Consultant QSE IA
# Statut : BROUILLON v0.1 — valeurs proposées par l'assistant IA à partir
#          des pratiques courantes des consultants ; Amine tranche les seuils,
#          les délais et les libellés (ce sont ses choix d'expert).
# Lu par : moteur d'analyse terrain (criticite_constats), moteur documentaire
#          (couverture_documentaire), audit à blanc (classification_nc),
#          génération de la grille des risques (cotation_risques).
# =====================================================================
version: "0.1-brouillon"

# ---------------------------------------------------------------------
# 1. CRITICITÉ DES CONSTATS TERRAIN (photo, vidéo, caméra)
# ---------------------------------------------------------------------
criticite_constats:
  niveaux:
    - niveau: 4
      libelle_fr: Critique
      libelle_en: Critical
      definition_fr: >
        Danger grave et imminent pour une ou plusieurs personnes, ou infraction
        réglementaire exposant directement des personnes (issue verrouillée,
        machine sans protecteur en marche, travail en hauteur sans protection).
      delai_traitement_jours: 0
      consigne_fr: "Arrêt immédiat de l'activité concernée jusqu'à mise en sécurité"
      delai_verification_jours: 7
      notification: ["responsable_zone", "responsable_site", "direction"]
      notification_delai: immediate
    - niveau: 3
      libelle_fr: Majeure
      libelle_en: Major
      definition_fr: >
        Mesure de maîtrise absente ou inopérante, exigence non satisfaite, sans
        exposition immédiate au moment du constat, mais accident probable si la
        situation persiste.
      delai_traitement_jours: 15
      consigne_fr: "Action corrective planifiée avec responsable et date ; mesure conservatoire dans les 48 h"
      delai_verification_jours: 30
      notification: ["responsable_zone", "responsable_site"]
      notification_delai: 24h
    - niveau: 2
      libelle_fr: Mineure
      libelle_en: Minor
      definition_fr: >
        Écart partiel : la mesure existe mais est dégradée, incomplète ou mal
        appliquée ; conséquences limitées.
      delai_traitement_jours: 30
      consigne_fr: "Action corrective planifiée"
      delai_verification_jours: 60
      notification: ["responsable_zone"]
      notification_delai: 72h
    - niveau: 1
      libelle_fr: Observation
      libelle_en: Observation
      definition_fr: >
        Point à surveiller, bonne pratique non appliquée, risque de dérive ;
        aucune exigence formellement enfreinte.
      delai_traitement_jours: 90
      consigne_fr: "À intégrer au plan d'amélioration ; revue à la prochaine inspection"
      delai_verification_jours: 90
      notification: ["responsable_zone"]
      notification_delai: hebdomadaire

  # Le niveau de départ est `criticite_defaut` de la règle terrain ; le moteur
  # applique ensuite les escalades ci-dessous, dans l'ordre, avec plafond 4.
  escalade:
    - code: ESC-01
      condition_fr: "Personne(s) exposée(s) visible(s) au moment du constat (dans la zone dangereuse)"
      effet: "+1"
    - code: ESC-02
      condition_fr: "Récidive : même règle, même zone, dans les 90 derniers jours"
      effet: "+1"
    - code: ESC-03
      condition_fr: "Le constat correspond à une exigence légale identifiée dans le registre"
      effet: "minimum 3"
    - code: ESC-04
      condition_fr: "Activité réalisée par un sous-traitant non couvert par un plan de prévention"
      effet: "+1"
    - code: ESC-05
      condition_fr: "Au moins 3 constats de niveau 2 de la même catégorie sur la même zone dans la même inspection"
      effet: "constat systémique de niveau 3 ajouté, en plus des constats individuels"
    - code: ESC-06
      condition_fr: "Constat pendant une phase d'urgence ou dans un local d'urgence (issue, local électrique, stockage gaz)"
      effet: "+1"
  plafond: 4

  regles_particulieres:
    - "Un constat de niveau 4 n'est jamais déclassé par le moteur ; seul un humain peut le faire, avec justification enregistrée."
    - "Un indice illisible ou hors champ produit un statut « à vérifier » et non une non-conformité."
    - "Une exclusion vérifiée annule le constat ; le moteur enregistre l'exclusion appliquée pour audit du modèle."
    - "Deux constats identiques sur la même image sont fusionnés ; le nombre d'occurrences est conservé."

# ---------------------------------------------------------------------
# 2. GRILLE DE COTATION DES RISQUES (analyse des risques par poste)
# ---------------------------------------------------------------------
cotation_risques:
  methode: "criticité = gravité × probabilité, corrigée par le niveau de maîtrise"
  gravite:
    - {niveau: 1, libelle_fr: "Faible", definition_fr: "Blessure bénigne sans arrêt de travail, premiers soins"}
    - {niveau: 2, libelle_fr: "Modérée", definition_fr: "Accident avec arrêt de travail inférieur à 30 jours"}
    - {niveau: 3, libelle_fr: "Grave", definition_fr: "Arrêt supérieur à 30 jours, incapacité partielle, maladie professionnelle"}
    - {niveau: 4, libelle_fr: "Très grave", definition_fr: "Décès, incapacité permanente, plusieurs victimes"}
  probabilite_note_fr: "Combine la fréquence d'exposition et la probabilité d'occurrence à chaque exposition"
  probabilite:
    - {niveau: 1, libelle_fr: "Rare", definition_fr: "Exposition exceptionnelle (moins d'une fois par mois) ou événement très improbable"}
    - {niveau: 2, libelle_fr: "Occasionnelle", definition_fr: "Exposition hebdomadaire ou événement déjà survenu dans le secteur"}
    - {niveau: 3, libelle_fr: "Fréquente", definition_fr: "Exposition quotidienne ou événement déjà survenu dans l'organisme"}
    - {niveau: 4, libelle_fr: "Très fréquente", definition_fr: "Exposition permanente ou plusieurs heures par jour ; événement récurrent"}
  maitrise_note_fr: "Coefficient appliqué à la criticité brute pour obtenir la criticité résiduelle ; il traduit la hiérarchie des mesures"
  maitrise:
    - {coefficient: 1.0, libelle_fr: "Aucune mesure"}
    - {coefficient: 0.7, libelle_fr: "Mesures organisationnelles, consignes, formation, EPI seuls"}
    - {coefficient: 0.4, libelle_fr: "Protection collective technique en place et entretenue"}
    - {coefficient: 0.2, libelle_fr: "Danger supprimé ou substitué pour l'essentiel de l'exposition"}
  criticite_brute: "gravite x probabilite (1 à 16)"
  criticite_residuelle: "criticite_brute x coefficient de maîtrise, arrondi à l'entier supérieur"
  seuils:
    - {plage: "1-3", classe: acceptable, action_fr: "Maintenir les mesures, surveiller"}
    - {plage: "4-7", classe: a_ameliorer, action_fr: "Action planifiée dans les 6 mois"}
    - {plage: "8-11", classe: prioritaire, action_fr: "Action dans les 3 mois, mesure conservatoire immédiate"}
    - {plage: "12-16", classe: inacceptable, action_fr: "Action immédiate ; suspension de l'activité si aucune mesure conservatoire possible"}
  regle_fr: "Tout risque de gravité 4 est au minimum « prioritaire », quelle que soit la probabilité."

# ---------------------------------------------------------------------
# 3. CLASSIFICATION DES CONSTATS D'AUDIT (audit à blanc, documentaire + terrain)
# ---------------------------------------------------------------------
classification_nc_audit:
  - code: NCM
    libelle_fr: Non-conformité majeure
    libelle_en: Major nonconformity
    criteres_fr:
      - "Exigence totalement absente (aucun élément de réponse)"
      - "Défaillance systémique : la disposition existe sur le papier mais n'est pas appliquée de façon répétée"
      - "Manquement à une exigence légale identifiée"
      - "Plusieurs non-conformités mineures sur la même exigence ou le même processus"
      - "Situation pouvant conduire à un accident grave"
    consequence_fr: "Bloque la recommandation de certification ; plan d'action et preuve d'efficacité exigés avant clôture"
  - code: NCm
    libelle_fr: Non-conformité mineure
    libelle_en: Minor nonconformity
    criteres_fr:
      - "Écart ponctuel, isolé, par rapport à une exigence ou à une disposition interne"
      - "N'affecte pas la capacité du système à produire ses résultats"
    consequence_fr: "Plan d'action attendu, clôture vérifiée à l'audit suivant"
  - code: OBS
    libelle_fr: Observation / piste d'amélioration
    libelle_en: Observation
    criteres_fr:
      - "Pas d'écart formel, mais risque de dérive ou de non-conformité future"
      - "Opportunité d'amélioration identifiée"
    consequence_fr: "Réponse laissée à l'appréciation de l'organisme"
  - code: PF
    libelle_fr: Point fort
    libelle_en: Strength
    criteres_fr:
      - "Pratique allant au-delà de l'exigence, ou particulièrement efficace"
    consequence_fr: "À maintenir et à valoriser"

classification_nc_regle_de_remontee_fr: >
  Le moteur propose la classification à partir du degré de couverture et des
  preuves ; l'auditeur humain confirme. Trois NCm sur la même exigence sont
  automatiquement proposées en NCM.

# ---------------------------------------------------------------------
# 4. COUVERTURE DOCUMENTAIRE (analyse d'un système existant)
# ---------------------------------------------------------------------
couverture_documentaire:
  degres:
    - {valeur: 0, libelle_fr: "Absent", definition_fr: "Aucun document ni enregistrement ne répond à l'exigence"}
    - {valeur: 25, libelle_fr: "Existe mais ne répond pas", definition_fr: "Document générique, périmé, non approuvé, ou sans lien avec l'exigence"}
    - {valeur: 60, libelle_fr: "Répond partiellement", definition_fr: "Contenu pertinent mais éléments manquants, ou document conforme non appliqué / sans enregistrement"}
    - {valeur: 100, libelle_fr: "Répond et appliqué", definition_fr: "Document conforme, en vigueur, avec preuves d'application"}
  calcul:
    score_exigence: "degré attribué (0, 25, 60, 100)"
    score_chapitre: "somme(degré × poids) / somme(poids) sur les exigences applicables du chapitre"
    score_global: "même formule sur toutes les exigences applicables"
    exigences_non_applicables: "exclues du calcul si l'exclusion est justifiée dans le domaine d'application"
  seuils_maturite:
    - {plage: "0-39", libelle_fr: "Initial", message_fr: "Système à construire ; commencer par les exigences de poids 3"}
    - {plage: "40-69", libelle_fr: "En construction", message_fr: "Ossature en place ; compléter les preuves d'application"}
    - {plage: "70-89", libelle_fr: "Prêt pour un audit à blanc", message_fr: "Vérifier les exigences de poids 3 encore sous 60"}
    - {plage: "90-100", libelle_fr: "Prêt pour la certification", message_fr: "Sous réserve qu'aucune exigence de poids 3 ne soit sous 60"}
  regles_bloquantes:
    - "Une exigence de poids 3 à 0 bloque le statut « prêt pour un audit à blanc » quel que soit le score global."
    - "Une exigence de type enregistrement ne peut pas dépasser 60 sans au moins un enregistrement daté fourni."

# ---------------------------------------------------------------------
# 5. PONDÉRATION DES EXIGENCES (champ `poids` du modèle)
# ---------------------------------------------------------------------
ponderation:
  - {poids: 3, libelle_fr: "Structurante", definition_fr: "Son absence rend le système inopérant ou expose à un manquement légal (politique, dangers, risques, exigences légales, maîtrise opérationnelle, urgences, incidents, conformité)"}
  - {poids: 2, libelle_fr: "Importante", definition_fr: "Nécessaire à l'efficacité, un écart produit une NC mineure ou majeure selon l'ampleur"}
  - {poids: 1, libelle_fr: "Complémentaire", definition_fr: "Un écart produit le plus souvent une observation"}

# ---------------------------------------------------------------------
# 6. DÉLAIS DE DÉCLARATION (rappel pour le moteur d'alerte — à vérifier par Amine
#    dans les textes marocains en vigueur avant activation)
# ---------------------------------------------------------------------
delais_declaration_maroc:
  accident_travail_employeur_vers_assureur_h: 48   # loi 18-12 — à vérifier
  accident_travail_salarie_vers_employeur_h: 48    # à vérifier
  accident_grave_ou_mortel_autorites: "immédiat"   # inspection du travail — à vérifier
  maladie_professionnelle: "selon procédure CNSS — à vérifier"
