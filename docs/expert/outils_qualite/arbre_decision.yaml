# =====================================================================
# ARBRE DE DÉCISION — OUTILS QUALITÉ
# Statut : BROUILLON v0.1 — à valider par Amine Boukha.
# Principe : l'agent qualifie la situation par quelques questions fermées,
# choisit l'outil, prérémplit le livrable avec ce qu'il sait (constats,
# données, historique) et laisse explicitement à l'humain ce qui exige la
# connaissance du terrain. Il ne conclut jamais sur les causes à la place
# de l'équipe : il propose des hypothèses à confirmer.
# =====================================================================
version: "0.1-brouillon"

questions_qualification:
  - id: Q1
    question_fr: "Le problème s'est-il déjà produit (même écart, même lieu ou même processus) ?"
    reponses: [oui, non]
  - id: Q2
    question_fr: "Combien d'écarts distincts sont concernés ?"
    reponses: [un_seul, plusieurs]
  - id: Q3
    question_fr: "L'écart vient-il d'un produit, d'un équipement ou d'un procédé nouveau ou modifié ?"
    reponses: [oui, non]
  - id: Q4
    question_fr: "Existe-t-il des données chiffrées sur le problème (fréquence, coûts, durées) ?"
    reponses: [oui, non]
  - id: Q5
    question_fr: "Le problème touche-t-il l'organisation générale (pilotage, suivi, ressources) plutôt qu'une tâche précise ?"
    reponses: [oui, non]
  - id: Q6
    question_fr: "S'agit-il d'un écart réglementaire ?"
    reponses: [oui, non]

branches:
  - code: B1
    situation_fr: "Écart ponctuel, première occurrence, cause apparente simple"
    conditions: {Q1: non, Q2: un_seul, Q5: non}
    outil: correction_et_5_pourquoi_court
    livrable: fiche_nc_action_corrective
    agent_preremplit:
      - "Description factuelle du constat (lieu, date, règle ou exigence, preuve)"
      - "Correction immédiate proposée (issue de action_immediate de la règle terrain)"
      - "Trame 5 pourquoi avec le premier « pourquoi » renseigné à partir du constat"
      - "Responsable et échéance proposés selon le barème de criticité"
    humain_complete:
      - "Les pourquoi 2 à 5 (connaissance des pratiques réelles)"
      - "La validation de la cause retenue"
      - "La date de vérification d'efficacité"

  - code: B2
    situation_fr: "Non-conformité récurrente ou cause profonde non évidente"
    conditions: {Q1: oui}
    outil: ishikawa_puis_5_pourquoi
    livrable: analyse_causes_ishikawa
    agent_preremplit:
      - "Historique des occurrences (dates, lieux, constats liés) extrait de la plateforme"
      - "Diagramme 5M (main-d'œuvre, matériel, méthode, milieu, matière) avec des hypothèses par branche, marquées « à confirmer »"
      - "Questions à poser à l'équipe pour chaque branche"
    humain_complete:
      - "Confirmation ou rejet de chaque hypothèse avec l'équipe concernée"
      - "Choix des causes racines et 5 pourquoi sur celles-ci"
      - "Actions correctives, en respectant la hiérarchie des mesures"

  - code: B3
    situation_fr: "Écarts multiples et hétérogènes, besoin de prioriser"
    conditions: {Q2: plusieurs, Q4: oui}
    outil: pareto
    livrable: analyse_pareto
    agent_preremplit:
      - "Tableau des écarts classés par fréquence ou par criticité pondérée, courbe cumulée"
      - "Identification des 20 % de causes produisant 80 % des écarts"
      - "Proposition d'ordre de traitement"
    humain_complete:
      - "Validation du critère de tri (fréquence, gravité, coût)"
      - "Arbitrage final compte tenu des contraintes de ressources"

  - code: B4
    situation_fr: "Écarts multiples sans données chiffrées"
    conditions: {Q2: plusieurs, Q4: non}
    outil: matrice_impact_effort
    livrable: matrice_priorisation
    agent_preremplit:
      - "Liste des écarts avec impact estimé (criticité) et effort estimé (type de mesure)"
      - "Placement proposé dans les quatre quadrants"
    humain_complete:
      - "Correction des estimations d'effort (coût réel, délais fournisseurs)"
      - "Sélection des actions rapides et des projets"

  - code: B5
    situation_fr: "Défaut lié à la conception d'un produit, d'un procédé ou d'un équipement, ou changement prévu"
    conditions: {Q3: oui}
    outil: amdec
    livrable: tableau_amdec
    agent_preremplit:
      - "Découpage fonctionnel proposé (étapes, composants)"
      - "Modes de défaillance génériques par étape, avec effets et causes plausibles"
      - "Colonnes gravité / occurrence / détection vides ou pré-cotées avec mention « proposition »"
    humain_complete:
      - "Cotation G, O, D à partir de l'expérience réelle"
      - "Actions de prévention et de détection retenues"
      - "Décision de mise en œuvre du changement"

  - code: B6
    situation_fr: "Défaillance du pilotage : indicateurs absents, revues non tenues, actions non suivies"
    conditions: {Q5: oui, Q1: non}
    outil: pdca_et_tableau_de_bord
    livrable: plan_pdca_avec_indicateurs
    agent_preremplit:
      - "Cycle PDCA structuré à partir de l'exigence concernée"
      - "Proposition d'indicateurs (définition, formule, fréquence, cible) issus du modèle d'exigences"
      - "Trame de revue périodique"
    humain_complete:
      - "Choix des indicateurs réellement suivables avec les données disponibles"
      - "Attribution des pilotes et des ressources"

  - code: B7
    situation_fr: "Défaillance systémique récurrente du pilotage"
    conditions: {Q5: oui, Q1: oui}
    outil: audit_processus_et_pdca
    livrable: rapport_audit_processus
    agent_preremplit:
      - "Grille d'audit du processus concerné (exigences, preuves attendues, questions)"
      - "Constats déjà enregistrés sur ce processus"
    humain_complete:
      - "Réalisation de l'audit (entretiens, observation)"
      - "Constats définitifs et décisions de réorganisation"

  - code: B8
    situation_fr: "Écart réglementaire"
    conditions: {Q6: oui}
    outil: plan_de_mise_en_conformite
    livrable: plan_mise_en_conformite
    agent_preremplit:
      - "Exigence légale concernée (référence, article) depuis le registre"
      - "Écart constaté et preuve"
      - "Actions types pour ce type d'écart, délai proposé (minimum criticité 3)"
      - "Alerte si une déclaration aux autorités est requise"
    humain_complete:
      - "Vérification du texte en vigueur et de l'interprétation"
      - "Décision sur les actions et sur les échanges avec l'autorité"

  - code: B9
    situation_fr: "Désordre, encombrement, pertes de temps et d'espace récurrents"
    conditions: {Q5: non, Q1: oui}
    outil: chantier_5s
    livrable: plan_5s_zone
    agent_preremplit:
      - "Zone concernée, constats photo avant, check-list 5S adaptée au secteur"
      - "Standard de rangement proposé"
    humain_complete:
      - "Réalisation avec l'équipe, photos après, règles de maintien"

regles_transversales:
  - "Toute action proposée respecte la hiérarchie des mesures : l'agent signale quand une action est de type « sensibilisation » seule et demande si une mesure technique est possible."
  - "Chaque livrable porte la mention « brouillon généré, à valider par [nom du responsable] » jusqu'à validation."
  - "Une même NC peut appeler deux outils (ex. B2 puis B3) ; l'agent le propose sans imposer."
  - "Les hypothèses de causes ne sont jamais présentées comme des conclusions."
