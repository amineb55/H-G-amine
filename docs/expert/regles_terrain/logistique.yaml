# =====================================================================
# RÉFÉRENTIEL TERRAIN — LOGISTIQUE (entrepôts, plateformes, quais, transport)
# Statut : BROUILLON v0.1 — à relire par Amine Boukha. Mêmes conventions
# que industrie.yaml.
# =====================================================================
secteur: logistique
version: "0.1-brouillon"
regles:

  - id: LOG-01
    titre: Rayonnages endommagés ou non conformes
    categorie: stockage
    description: >
      Les rayonnages présentent des déformations, des éléments manquants ou une
      charge non maîtrisée, avec risque d'effondrement.
    criticite_defaut: 3
    exigences: [45001-9.1.1b, 45001-6.1.3b, 45001-8.1.1a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV ; norme marocaine ou européenne applicable aux rayonnages — à vérifier"
    indices_visuels:
      - "Montant ou lisse déformé, plié, percuté"
      - "Absence de plaque de charge visible sur l'échelle de rayonnage"
      - "Sabots ou protections de pied absents ou arrachés"
      - "Rayonnage non ancré au sol ou ancrage arraché"
      - "Palette dépassant de la lisse, ou charge posée sans lisse (en appui sur une palette voisine)"
      - "Goupilles de sécurité manquantes sur les lisses"
    exclusions:
      - "Rayonnage en cours de montage, allée balisée"
      - "Déformation légère déjà marquée pour réparation, avec la travée vidée et l'allée fermée"
    action_immediate: "Décharger la travée touchée, interdire l'accès, faire expertiser avant remise en service"

  - id: LOG-02
    titre: Gerbage et palettes instables
    categorie: stockage
    description: >
      Des charges palettisées sont empilées ou constituées de façon instable,
      avec risque de chute de charge.
    criticite_defaut: 3
    exigences: [45001-8.1.1a, 45001-6.1.2.1]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Palettes gerbées trop haut, penchées ou en dévers"
      - "Charge en porte-à-faux, dépassant largement la palette"
      - "Filmage absent, déchiré ou insuffisant sur une charge hétérogène"
      - "Palette cassée ou plancher fendu sous une charge"
      - "Empilement de colis de tailles et poids différents sans stabilité"
    exclusions:
      - "Palettes vides empilées à hauteur raisonnable en zone dédiée"
      - "Charges filmées et sanglées dans une zone de gerbage identifiée"
    action_immediate: "Interdire l'accès sous la charge, reprendre le gerbage à hauteur sûre, refilmer"

  - id: LOG-03
    titre: Séparation piétons / engins absente
    categorie: circulation
    description: >
      Piétons et engins de manutention partagent le même espace sans allées
      dédiées, sans protection et sans signalisation.
    criticite_defaut: 4
    exigences: [45001-6.1.2.1, 45001-8.1.2a, 45001-8.1.2b]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Absence de marquage au sol des allées piétonnes, ou marquage effacé"
      - "Piéton sans gilet haute visibilité dans une zone de circulation d'engins"
      - "Absence de passage piéton ou de barrière aux intersections et sorties de zones"
      - "Personne à pied à moins de quelques mètres d'un chariot en manœuvre"
      - "Porte piétonne débouchant directement dans une allée d'engins sans barrière"
    exclusions:
      - "Zone piétonne exclusive sans aucun engin (préparation manuelle, bureaux)"
      - "Séparation par barrières physiques ou chemins protégés, même sans peinture au sol"
    action_immediate: "Écarter le piéton, arrêter l'engin, matérialiser un passage provisoire"

  - id: LOG-04
    titre: Conduite d'engins dangereuse
    categorie: engins
    description: >
      Un engin de manutention est conduit d'une manière qui met en danger le
      conducteur ou les personnes présentes.
    criticite_defaut: 4
    exigences: [45001-7.2b, 45001-8.1.1a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Conducteur sans ceinture sur un chariot à conducteur porté"
      - "Fourches levées ou charge en hauteur pendant le déplacement"
      - "Charge masquant la visibilité sans conduite en marche arrière"
      - "Passager ou personne sur les fourches"
      - "Téléphone en main pendant la conduite"
      - "Engin abandonné moteur en marche, fourches levées"
    exclusions:
      - "Transpalette électrique ou gerbeur à conducteur accompagnant"
      - "Engin à l'arrêt, fourches au sol, clé retirée, en zone de stationnement"
    action_immediate: "Arrêt de la manœuvre, remise au sol, rappel au conducteur, contrôle de son autorisation"

  - id: LOG-05
    titre: Quais de chargement non sécurisés
    categorie: quais
    description: >
      Les opérations de quai exposent à la chute de quai, au départ inopiné du
      camion ou à l'écrasement.
    criticite_defaut: 4
    exigences: [45001-6.1.2.1, 45001-8.1.1a, 45001-8.1.4.2b]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV ; protocole de sécurité chargement / déchargement — à vérifier"
    indices_visuels:
      - "Remorque à quai sans cale de roue ni dispositif de blocage visible"
      - "Bord de quai ouvert sans barrière ni protection alors qu'aucun camion n'est à quai"
      - "Niveleur endommagé, pont de liaison non fixé ou bancal"
      - "Chariot entrant dans une remorque non stabilisée (béquilles absentes sur une semi-remorque dételée)"
      - "Absence de feux de quai ou de signalisation vert / rouge"
    exclusions:
      - "Quai fermé par une barrière ou une porte sectionnelle"
      - "Camion avec cales et système de blocage visibles, feux au rouge"
    action_immediate: "Stopper le chargement, caler et bloquer le véhicule, fermer le quai inutilisé"

  - id: LOG-06
    titre: Arrimage des chargements défaillant
    categorie: chargement
    description: >
      Les charges dans les véhicules ne sont pas arrimées ou le sont avec des
      moyens inadaptés, avec risque de chute de charge à l'ouverture ou en route.
    criticite_defaut: 3
    exigences: [45001-8.1.1a, 45001-6.1.3b]
    reference_reglementaire: "Code de la route (loi 52-05) et textes sur le transport de marchandises — à vérifier"
    indices_visuels:
      - "Charges non sanglées ni bloquées dans une remorque ou une camionnette"
      - "Sangles usées, coupées, nouées ou tendeurs endommagés"
      - "Charge dépassant le gabarit ou répartie sur un seul côté"
      - "Bâche ouverte ou déchirée sur un véhicule prêt à partir"
    exclusions:
      - "Chargement en cours, avant arrimage, opérateur présent"
      - "Charge bloquée par la structure du véhicule (cellule, cloisons, barres)"
    action_immediate: "Interdire le départ, reprendre l'arrimage avec des moyens conformes"

  - id: LOG-07
    titre: Zone de charge des batteries dangereuse
    categorie: energies
    description: >
      La recharge des batteries d'engins se fait sans ventilation, sans
      protection contre les projections ni contre l'incendie.
    criticite_defaut: 3
    exigences: [45001-8.1.1a, 45001-8.2a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Chargeurs installés dans un local fermé sans ventilation ni signalisation"
      - "Absence de rince-œil et d'EPI (gants, lunettes) à proximité des batteries au plomb"
      - "Câbles de charge endommagés ou traînant dans un passage"
      - "Matériaux inflammables (cartons, palettes) stockés contre les chargeurs"
      - "Flamme, cigarette ou source d'étincelles à proximité"
    exclusions:
      - "Batteries lithium en armoire dédiée (règles différentes : signaler à vérifier plutôt que NC)"
      - "Zone de charge extérieure abritée et signalée"
    action_immediate: "Écarter les inflammables, réparer les câbles, mettre en place ventilation, rince-œil et EPI"

  - id: LOG-08
    titre: Issues et moyens incendie obstrués par le stockage
    categorie: incendie
    description: >
      Le stockage empiète sur les issues, les extincteurs, les tableaux
      électriques ou les dégagements sous sprinklers.
    criticite_defaut: 4
    exigences: [45001-8.2a, 45001-8.2b]
    reference_reglementaire: "Règlement général de construction — sécurité incendie (décret 2-14-499) — à vérifier"
    indices_visuels:
      - "Palettes ou cartons devant une issue de secours ou un extincteur"
      - "Stockage devant un tableau électrique ou une vanne de coupure"
      - "Stockage trop près du plafond ou des têtes de sprinkler"
      - "Issue de secours verrouillée ou cadenassée"
      - "Allée d'accès pompiers encombrée"
    exclusions:
      - "Obstruction très temporaire pendant un déchargement, opérateur présent"
      - "Issue condamnée officiellement et signalée, avec issue de remplacement"
    action_immediate: "Dégager immédiatement, déverrouiller, rétablir le dégagement sous sprinklers"

  - id: LOG-09
    titre: État des sols et propreté
    categorie: ordre_proprete
    description: >
      L'état des sols crée un risque de chute, de renversement d'engin ou de
      basculement de charge.
    criticite_defaut: 2
    exigences: [45001-9.1.1a, 45001-8.1.1a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Trou, nid-de-poule ou dalle cassée dans une allée d'engins"
      - "Déversement d'huile ou de liquide sans absorption ni signalisation"
      - "Débris de palettes, clous, feuillard ou film plastique au sol"
      - "Dénivelé ou rampe sans signalisation"
      - "Eau au sol près des portes de quai par temps de pluie"
    exclusions:
      - "Nettoyage en cours signalé"
      - "Zone de réparation de sol balisée et fermée"
    action_immediate: "Nettoyer, absorber, signaler ; baliser les trous jusqu'à réparation"

  - id: LOG-10
    titre: Manutention manuelle dangereuse
    categorie: ergonomie
    description: >
      Des charges lourdes ou encombrantes sont manipulées à la main, seul, dans
      des postures contraignantes ou sans aide technique disponible.
    criticite_defaut: 2
    exigences: [45001-8.1.2a, 45001-6.1.2.1]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Charge visiblement lourde ou volumineuse portée par une seule personne"
      - "Dos courbé ou torsion du tronc sous charge"
      - "Port de charge au-dessus des épaules ou lancer de colis"
      - "Absence d'aide (transpalette, table élévatrice, diable) sur un poste de charges répétitives"
      - "Picking très bas ou très haut sans aménagement"
    exclusions:
      - "Colis légers (petit conditionnement)"
      - "Aide technique visible et utilisée"
    action_immediate: "Interrompre le port à risque, fournir l'aide technique, travailler à deux"

  - id: LOG-11
    titre: Matières dangereuses mal stockées
    categorie: chimique
    description: >
      Des produits dangereux entreposés (fûts, IBC, bidons, aérosols) ne sont
      pas identifiés, séparés ou mis sur rétention.
    criticite_defaut: 3
    exigences: [45001-7.5.3b, 45001-8.1.1a, 45001-6.1.3a]
    reference_reglementaire: "Décret 2-12-431 ; loi 30-05 (transport de matières dangereuses) — à vérifier"
    indices_visuels:
      - "Fûts ou IBC posés au sol sans bac de rétention"
      - "Produits incompatibles côte à côte (oxydants / inflammables, acides / bases)"
      - "Étiquetage absent ou pictogrammes illisibles"
      - "Fuite, coulure ou odeur signalée par l'opérateur"
      - "Inflammables ou aérosols stockés hors zone dédiée ; zone à atmosphère explosive sans signalisation"
    exclusions:
      - "Conteneur fermé sur rétention intégrée (palette de rétention)"
      - "Zone dédiée fermée, signalée, ventilée"
    action_immediate: "Mettre sur rétention, séparer, identifier ; isoler la zone en cas de fuite"

  - id: LOG-12
    titre: Éclairage, visibilité et signalisation insuffisants
    categorie: circulation
    description: >
      Les conditions de visibilité ne permettent pas aux conducteurs et aux
      piétons de s'anticiper.
    criticite_defaut: 2
    exigences: [45001-8.1.1a, 45001-9.1.1a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Zone sombre dans une allée ou sur un quai en activité"
      - "Absence de miroir aux intersections aveugles"
      - "Signalisation au sol ou verticale effacée, absente ou contradictoire"
      - "Angle mort créé par un stockage temporaire en bout d'allée"
    exclusions:
      - "Zone non exploitée, fermée et signalée"
      - "Éclairage éteint dans une zone inoccupée, avec détection de présence"
    action_immediate: "Rétablir l'éclairage, poser un miroir ou une signalisation provisoire, retirer le stockage en bout d'allée"
