# =====================================================================
# RÉFÉRENTIEL TERRAIN — HÔTELLERIE-RESTAURATION (cuisines, salles, réserves,
# étages). Statut : BROUILLON v0.1 — à relire par Amine Boukha (voir aussi
# son expérience du Snack Melia : c'est le secteur qu'il connaît de l'intérieur).
# Mêmes conventions que industrie.yaml. Les points d'hygiène alimentaire ne
# sont retenus que lorsqu'ils exposent aussi le personnel ou relèvent d'une
# obligation légale structurante.
# =====================================================================
secteur: hotellerie_restauration
version: "0.1-brouillon"
regles:

  - id: HOR-01
    titre: Sols glissants en cuisine et en plonge
    categorie: circulation
    description: >
      Les zones de préparation, cuisson et lavage présentent un risque de
      glissade lié à l'eau, aux graisses et aux revêtements.
    criticite_defaut: 3
    exigences: [45001-6.1.2.1, 45001-8.1.2a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Eau, graisse ou détritus au sol en zone de cuisson ou de plonge"
      - "Absence de caillebotis ou de tapis antidérapants dans les zones humides"
      - "Chaussures ouvertes, de ville ou à semelles lisses en cuisine"
      - "Sol carrelé lisse sans revêtement antidérapant dans une zone de lavage"
      - "Siphon ou évacuation bouché, eau stagnante"
    exclusions:
      - "Nettoyage en cours signalé, en dehors du service"
      - "Sol sec après nettoyage de fin de service"
    action_immediate: "Nettoyer et sécher, poser un caillebotis, exiger des chaussures de sécurité antidérapantes"

  - id: HOR-02
    titre: Hottes et extraction encrassées
    categorie: incendie
    description: >
      La hotte, les filtres et les conduits d'extraction sont chargés de graisse,
      créant un risque d'incendie et d'exposition aux fumées.
    criticite_defaut: 3
    exigences: [45001-6.1.3b, 45001-8.2a]
    reference_reglementaire: "Règlement général de construction — sécurité incendie ; règles d'hygiène (loi 28-07) — à vérifier"
    indices_visuels:
      - "Filtres de hotte saturés de graisse, coulures sur la hotte ou les murs"
      - "Conduit d'extraction visiblement gras à l'entrée"
      - "Fumées ou vapeurs stagnant dans la cuisine, hotte à l'arrêt en service"
      - "Filtres retirés ou absents"
      - "Absence d'étiquette ou de fiche d'entretien de la hotte"
    exclusions:
      - "Nettoyage de la hotte en cours"
      - "Hotte neuve, cuisine non encore en service"
    action_immediate: "Nettoyer ou remplacer les filtres, planifier le dégraissage des conduits par un prestataire"

  - id: HOR-03
    titre: Installation au gaz non maîtrisée
    categorie: gaz
    description: >
      L'alimentation en gaz de la cuisine présente un risque de fuite,
      d'explosion ou d'intoxication.
    criticite_defaut: 4
    exigences: [45001-8.1.1a, 45001-6.1.2.1, 45001-6.1.3b]
    reference_reglementaire: "Textes relatifs aux installations de gaz et à la sécurité incendie — à vérifier"
    indices_visuels:
      - "Bouteilles de gaz stockées à l'intérieur d'une cuisine fermée ou près des feux"
      - "Flexible craquelé, périmé, non normalisé ou raccordé avec un collier de fortune"
      - "Robinet de coupure générale inaccessible, masqué ou inconnu du personnel"
      - "Absence de détecteur de gaz dans un local fermé alimenté par bouteilles"
      - "Bouteilles de rechange stockées à côté des bouteilles en service"
      - "Feu allumé sans surveillance, casserole vide sur flamme"
    exclusions:
      - "Installation au gaz naturel avec vanne de coupure signalée et accessible"
      - "Bouteilles en local extérieur ventilé, grillagé, à l'ombre"
    action_immediate: "Couper le gaz, aérer, sortir les bouteilles de rechange, remplacer le flexible avant reprise"

  - id: HOR-04
    titre: Moyens d'extinction inadaptés ou absents
    categorie: incendie
    description: >
      Les moyens d'extinction de la cuisine ne correspondent pas aux feux
      possibles (huiles, graisses, électricité).
    criticite_defaut: 3
    exigences: [45001-8.2a, 45001-8.2b]
    reference_reglementaire: "Règlement général de construction — sécurité incendie (décret 2-14-499) — à vérifier"
    indices_visuels:
      - "Absence de couverture anti-feu à proximité des friteuses ou des feux"
      - "Extincteur à eau placé près d'une friteuse ou d'un tableau électrique"
      - "Extincteur périmé, masqué, absent ou décroché"
      - "Friteuse sans couvercle ni dispositif d'extinction"
      - "Personnel incapable de désigner l'extincteur le plus proche (à l'entretien)"
    exclusions:
      - "Dispositif d'extinction automatique de hotte présent et vérifié"
      - "Extincteur adapté (CO2 ou spécial feux de graisses) visible et signalé"
    action_immediate: "Installer une couverture anti-feu et un extincteur adapté, retirer l'extincteur inadapté"

  - id: HOR-05
    titre: Issues, dégagements et capacité d'accueil
    categorie: evacuation
    description: >
      Les conditions d'évacuation d'un établissement recevant du public sont
      dégradées.
    criticite_defaut: 4
    exigences: [45001-8.2a, 45001-8.2b]
    reference_reglementaire: "Règlement général de construction — sécurité incendie (décret 2-14-499) — à vérifier"
    indices_visuels:
      - "Issue de secours verrouillée, masquée par du stockage ou un rideau"
      - "Dégagements réduits par des tables, poussettes, plantes ou présentoirs"
      - "Effectif visible manifestement supérieur à la capacité autorisée affichée"
      - "Signalisation d'évacuation absente ou éteinte"
      - "Porte de secours bloquée en position fermée par un objet"
    exclusions:
      - "Aménagement temporaire en dehors des heures d'ouverture au public"
      - "Issue condamnée officiellement et signalée, avec issue de remplacement"
    action_immediate: "Dégager et déverrouiller les issues, réduire l'occupation, rétablir la signalisation"

  - id: HOR-06
    titre: Chaîne du froid et conservation des denrées
    categorie: hygiene_alimentaire
    description: >
      Les denrées sont conservées dans des conditions qui menacent la sécurité
      sanitaire (température, étiquetage, contamination croisée).
    criticite_defaut: 3
    exigences: [45001-6.1.3b, 45001-8.1.1a]
    reference_reglementaire: "Loi 28-07 (sécurité sanitaire des produits alimentaires) ; décret 2-10-473 — à vérifier"
    indices_visuels:
      - "Denrées non couvertes, non étiquetées ou sans date d'ouverture"
      - "Thermomètre absent ou température non affichée dans une chambre froide ou un réfrigérateur"
      - "Décongélation à température ambiante sur un plan de travail"
      - "Denrées posées au sol dans une chambre froide"
      - "Produits crus stockés au-dessus de produits cuits ou prêts à consommer"
      - "Produits périmés visibles"
    exclusions:
      - "Mise en place en cours pendant le service (denrées sorties brièvement)"
      - "Produits en attente de rangement à réception, opérateur présent"
    action_immediate: "Éliminer les produits douteux, étiqueter, réorganiser le stockage, relever la température"

  - id: HOR-07
    titre: Coupures et brûlures
    categorie: machines
    description: >
      Les outils et équipements de cuisine sont utilisés ou rangés d'une manière
      qui expose à des coupures ou à des brûlures.
    criticite_defaut: 3
    exigences: [45001-8.1.2b, 45001-8.1.1a]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Couteaux laissés dans l'évier, sous l'eau ou en vrac sur le plan de travail"
      - "Trancheuse ou mandoline utilisée sans gant anticoupure ni poussoir"
      - "Poignées de casseroles dépassant du plan de cuisson"
      - "Friteuse sans couvercle ni protection, huile au niveau maximal"
      - "Absence de gants thermiques ou de maniques près des fours"
    exclusions:
      - "Outils en cours d'utilisation par une personne équipée"
      - "Couteaux rangés sur une bande magnétique ou dans un bloc"
    action_immediate: "Ranger les couteaux, fournir gants anticoupure et poussoirs, orienter les poignées vers l'intérieur"

  - id: HOR-08
    titre: Produits d'entretien à proximité des aliments
    categorie: chimique
    description: >
      Les produits chimiques d'entretien sont stockés ou manipulés avec les
      denrées ou sans identification.
    criticite_defaut: 3
    exigences: [45001-7.5.3b, 45001-8.1.1a]
    reference_reglementaire: "Loi 28-07 ; décret 2-12-431 — à vérifier"
    indices_visuels:
      - "Produits chimiques rangés sur la même étagère que des denrées"
      - "Produit transvasé dans une bouteille d'eau ou de boisson"
      - "Flacon sans étiquette"
      - "Produit de nettoyage ouvert sur le plan de travail pendant la préparation"
    exclusions:
      - "Chariot ou armoire de ménage fermée et identifiée"
      - "Produits étiquetés utilisés après le service, plan de travail vide"
    action_immediate: "Retirer et étiqueter, séparer physiquement, interdire le transvasement dans des contenants alimentaires"

  - id: HOR-09
    titre: Électricité en milieu humide
    categorie: electricite
    description: >
      Le matériel électrique de la cuisine ou de la plonge présente un risque
      d'électrisation.
    criticite_defaut: 4
    exigences: [45001-6.1.3b, 45001-8.1.1a]
    reference_reglementaire: "Textes relatifs aux installations électriques — à vérifier"
    indices_visuels:
      - "Prise ou rallonge à proximité immédiate de la plonge ou d'un point d'eau"
      - "Câble endommagé ou traînant au sol dans une zone humide"
      - "Appareil sans mise à la terre visible ou fiche modifiée"
      - "Prise cassée ou interrupteur ouvert"
      - "Multiprise posée sur un plan de travail humide"
    exclusions:
      - "Prises étanches homologuées, hors zone d'éclaboussures"
      - "Matériel débranché en attente de réparation, étiqueté"
    action_immediate: "Débrancher le matériel en cause, faire intervenir un électricien, éloigner les rallonges de l'eau"

  - id: HOR-10
    titre: Hygiène du personnel et lave-mains
    categorie: hygiene_alimentaire
    description: >
      Les moyens d'hygiène des mains et la tenue du personnel de cuisine ne
      répondent pas aux exigences sanitaires.
    criticite_defaut: 2
    exigences: [45001-6.1.3b, 45001-7.3]
    reference_reglementaire: "Loi 28-07 ; décret 2-10-473 — à vérifier"
    indices_visuels:
      - "Personnel de cuisine sans tenue propre, sans coiffe, avec bijoux ou montre"
      - "Lave-mains absent, inaccessible, sans savon ni essuie-mains à usage unique"
      - "Lave-mains utilisé pour laver des ustensiles ou des légumes"
      - "Aucune séparation entre zone de plonge (sale) et zone de dressage (propre)"
    exclusions:
      - "Personnel de salle en tenue de service"
      - "Lave-mains en cours de réapprovisionnement, signalé"
    action_immediate: "Réapprovisionner le lave-mains, rappeler les règles de tenue, dégager l'accès"

  - id: HOR-11
    titre: Déchets et nuisibles
    categorie: hygiene_alimentaire
    description: >
      La gestion des déchets favorise les nuisibles et expose le personnel.
    criticite_defaut: 2
    exigences: [45001-8.1.1a, 45001-6.1.3b]
    reference_reglementaire: "Loi 28-07 ; loi 28-00 (gestion des déchets) — à vérifier"
    indices_visuels:
      - "Poubelles sans couvercle ou débordantes en cuisine"
      - "Local à déchets sale, sans fermeture, sans lavage possible"
      - "Traces de nuisibles : déjections, pièges pleins, denrées rongées"
      - "Ouvertures sur l'extérieur non protégées (grilles absentes, porte ouverte en permanence)"
      - "Déchets posés à même le sol"
    exclusions:
      - "Poubelle ouverte pendant son utilisation active"
      - "Évacuation des déchets en cours"
    action_immediate: "Fermer les poubelles, nettoyer le local, appeler le prestataire de lutte contre les nuisibles"

  - id: HOR-12
    titre: Stockage en hauteur et accès en réserve
    categorie: hauteur
    description: >
      Les réserves présentent des risques de chute d'objets et de chute de
      hauteur lors de l'accès aux étagères.
    criticite_defaut: 2
    exigences: [45001-8.1.1a, 45001-6.1.2.1]
    reference_reglementaire: "Code du travail (loi 65-99), Titre IV — à vérifier"
    indices_visuels:
      - "Cartons empilés instables ou trop haut"
      - "Charges lourdes (bouteilles, conserves) rangées en hauteur"
      - "Chaise, caisse ou seau retourné utilisé pour atteindre une étagère"
      - "Étagères surchargées, pliées ou non fixées au mur"
      - "Objets stockés au-dessus d'une porte ou d'un passage"
    exclusions:
      - "Rayonnage fixé, charges lourdes en bas, charges légères en haut"
      - "Escabeau normalisé présent et utilisé"
    action_immediate: "Redescendre les charges lourdes, fixer les étagères, fournir un escabeau conforme"
