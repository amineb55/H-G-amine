# =====================================================================
# RÉFÉRENTIEL TERRAIN — ENVIRONNEMENT (transverse, tous secteurs)
# Statut : BROUILLON v0.1 — à relire par Amine Boukha (certifié 14001).
# Étend le service 3 (photo / vidéo / caméras) à ISO 14001 : ces règles
# s'ajoutent aux règles sectorielles SST quand l'utilisateur a choisi 14001.
# criticite_defaut : 4 = pollution en cours ou imminente / infraction grave,
#   3 = risque de pollution ou infraction, 2 = mauvaise pratique, 1 = observation.
# =====================================================================
secteur: transverse_environnement
version: "0.1-brouillon"
regles:

  - id: ENV-01
    titre: Déversement ou fuite au sol non contenu
    categorie: sol_eau
    description: >
      Un liquide polluant (huile, carburant, solvant, peinture, produit chimique)
      s'écoule ou stagne sur un sol non étanche ou vers un réseau, sans
      confinement ni absorption.
    criticite_defaut: 4
    exigences: [14001-8.1a, 14001-8.2, 14001-6.1.2a]
    reference_reglementaire: "Loi 11-03 (protection de l'environnement) ; loi 36-15 (eau) — à vérifier"
    indices_visuels:
      - "Flaque colorée ou irisée au sol, traces d'écoulement vers un caniveau, un avaloir ou une zone de terre"
      - "Fût, bidon ou machine avec coulure active, sol taché en dessous"
      - "Terre ou gravier imprégnés, végétation brunie autour d'un stockage"
      - "Absence de produit absorbant ou de kit d'intervention à proximité d'un stockage"
    exclusions:
      - "Eau de pluie ou d'arrosage claire, sans irisation"
      - "Déversement en cours de traitement : absorbant épandu, personnel en intervention, zone balisée"
      - "Tache ancienne et sèche sur un sol bétonné, sans stockage à proximité (signaler « à vérifier »)"
    action_immediate: "Stopper la source, confiner, absorber, obturer l'avaloir, collecter les absorbants comme déchets dangereux"

  - id: ENV-02
    titre: Stockage de liquides dangereux sans rétention
    categorie: stockage
    description: >
      Des fûts, cuves, IBC ou bidons de produits dangereux ou d'hydrocarbures sont
      stockés sans bac de rétention, ou avec une rétention pleine, percée ou
      inadaptée.
    criticite_defaut: 3
    exigences: [14001-8.1a, 14001-6.1.2b]
    reference_reglementaire: "Loi 11-03 ; décret 2-12-431 — à vérifier"
    indices_visuels:
      - "Fûts ou IBC posés directement sur le sol ou sur des palettes sans bac"
      - "Bac de rétention rempli d'eau de pluie ou de produit, ou fissuré"
      - "Stockage extérieur non couvert, exposé à la pluie"
      - "Cuve enterrée ou aérienne sans dispositif de rétention visible ni jauge"
    exclusions:
      - "Rétention intégrée (palette de rétention, rayonnage à rétention, cuve double paroi avec plaque signalétique)"
      - "Contenants vides et propres, identifiés « vides »"
      - "Stockage temporaire en cours de réception avec opérateur présent"
    action_immediate: "Mettre sur rétention, vider le bac, abriter, vérifier l'étanchéité"

  - id: ENV-03
    titre: Déchets dangereux mélangés ou non identifiés
    categorie: dechets
    description: >
      Des déchets dangereux (huiles, solvants, chiffons souillés, batteries,
      aérosols, néons, cartouches, emballages de produits chimiques) sont
      mélangés aux déchets banals ou stockés sans identification.
    criticite_defaut: 3
    exigences: [14001-8.1c, 14001-6.1.2a]
    reference_reglementaire: "Loi 28-00 (gestion des déchets) et décrets sur les déchets dangereux — à vérifier"
    indices_visuels:
      - "Bidons d'huile, batteries, néons ou aérosols dans une benne de déchets banals"
      - "Chiffons gras ou emballages de produits chimiques dans une poubelle ordinaire"
      - "Contenants de déchets sans étiquette ni pictogramme"
      - "Huiles usagées dans des bidons hétéroclites, sans zone dédiée"
    exclusions:
      - "Tri en cours à un poste avec contenants identifiés"
      - "Emballages rincés et identifiés comme non dangereux selon la procédure interne"
    action_immediate: "Retirer et reconditionner dans la filière dangereuse, identifier les contenants"

  - id: ENV-04
    titre: Déchets en vrac, envols ou brûlage à l'air libre
    categorie: dechets
    description: >
      Les déchets sont stockés en vrac hors zone dédiée, s'envolent ou sont
      brûlés sur place.
    criticite_defaut: 3
    exigences: [14001-8.1c, 14001-8.1a]
    reference_reglementaire: "Loi 28-00 ; loi 13-03 (air) — à vérifier"
    indices_visuels:
      - "Tas de déchets au sol hors benne, sur terre ou près d'une clôture"
      - "Plastiques, papiers ou films envolés dans les abords et la végétation"
      - "Traces de brûlage : cendres, résidus calcinés, fût de combustion"
      - "Bennes débordantes, non couvertes, en plein vent"
    exclusions:
      - "Zone de tri temporaire balisée pendant un chantier, avec évacuation planifiée"
      - "Matériaux valorisables stockés proprement en attente d'enlèvement"
    action_immediate: "Interdire le brûlage, ramasser, mettre en benne couverte, planifier l'enlèvement"

  - id: ENV-05
    titre: Rejet vers le réseau pluvial, le caniveau ou le milieu naturel
    categorie: sol_eau
    description: >
      Des eaux usées, de lavage ou des produits sont rejetés vers un avaloir
      pluvial, un caniveau, un fossé, un oued ou le sol au lieu d'un réseau ou
      d'un traitement adapté.
    criticite_defaut: 4
    exigences: [14001-8.1a, 14001-6.1.3a, 14001-8.2]
    reference_reglementaire: "Loi 36-15 (eau) et décrets sur les déversements — à vérifier"
    indices_visuels:
      - "Avaloir ou grille pluviale souillée, mousse ou coloration dans un caniveau"
      - "Tuyau d'évacuation débouchant dans un fossé, un oued ou sur le sol"
      - "Lavage de véhicules, de matériel ou de sols avec écoulement vers l'extérieur"
      - "Rejet visible à la sortie d'un site (mousse, coloration, odeur signalée)"
    exclusions:
      - "Eaux pluviales claires"
      - "Rejet vers un réseau d'assainissement autorisé, avec autorisation présentée"
      - "Séparateur ou bassin de traitement en amont, identifié et entretenu"
    action_immediate: "Stopper le rejet, obturer l'avaloir, rediriger vers le réseau adapté, vérifier l'autorisation de rejet"

  - id: ENV-06
    titre: Émissions atmosphériques anormales
    categorie: air
    description: >
      Des fumées, poussières, vapeurs ou odeurs anormales sont émises sans
      captage ni traitement, ou avec un équipement de traitement manifestement
      défaillant.
    criticite_defaut: 3
    exigences: [14001-8.1a, 14001-9.1.1, 14001-6.1.2a]
    reference_reglementaire: "Loi 13-03 (pollution de l'air) et décrets sur les valeurs limites — à vérifier"
    indices_visuels:
      - "Fumée noire ou dense en sortie de cheminée, de chaudière ou de groupe électrogène"
      - "Nuage de poussières au chargement, au concassage, au sablage, sans captage ni arrosage"
      - "Vapeurs de solvant visibles en cabine de peinture ouverte ou à l'extérieur"
      - "Filtres ou manches de dépoussiérage percés, colmatés, ou by-pass ouvert"
    exclusions:
      - "Vapeur d'eau blanche se dissipant rapidement"
      - "Poussières maîtrisées par arrosage ou captage visible"
    action_immediate: "Arrêter ou régler l'équipement, remettre le traitement en service, planifier une mesure"

  - id: ENV-07
    titre: Aire de lavage ou d'entretien sans collecte
    categorie: sol_eau
    description: >
      Les véhicules, engins ou pièces sont lavés ou entretenus sur une aire non
      étanche ou sans séparateur d'hydrocarbures, avec écoulement libre.
    criticite_defaut: 3
    exigences: [14001-8.1a, 14001-6.1.3a]
    reference_reglementaire: "Loi 36-15 ; loi 11-03 — à vérifier"
    indices_visuels:
      - "Lavage sur terre, gravier ou sol non bordé"
      - "Aire bétonnée sans caniveau de collecte ni regard de séparateur"
      - "Vidange ou entretien au sol avec traces d'huile"
      - "Séparateur d'hydrocarbures plein, débordant ou sans trace d'entretien"
    exclusions:
      - "Aire étanche avec caniveau vers séparateur identifié et carnet d'entretien"
      - "Lavage à sec ou sans eau (chiffons, aspiration) hors sol nu"
    action_immediate: "Suspendre le lavage, collecter, faire vidanger le séparateur"

  - id: ENV-08
    titre: Stockage et distribution de carburant non sécurisés
    categorie: stockage
    description: >
      Les cuves et le poste de distribution de carburant présentent un risque de
      fuite ou de pollution lors du ravitaillement.
    criticite_defaut: 3
    exigences: [14001-8.1a, 14001-8.2, 14001-6.1.3a]
    reference_reglementaire: "Réglementation des dépôts d'hydrocarbures — à vérifier"
    indices_visuels:
      - "Cuve aérienne sans rétention ni double paroi, sol taché sous la cuve"
      - "Pistolet posé au sol, flexible fuyard, absence de bac d'égouttage"
      - "Ravitaillement d'engins sur sol nu, jerricans ouverts"
      - "Absence de kit absorbant, d'extincteur et de consigne au poste"
    exclusions:
      - "Cuve double paroi avec plaque signalétique et détecteur de fuite"
      - "Poste de distribution sur aire étanche avec séparateur"
    action_immediate: "Contenir, poser un bac, réparer le flexible, mettre kit absorbant et consigne"

  - id: ENV-09
    titre: Nuisances sonores ou vibratoires vers le voisinage
    categorie: bruit
    description: >
      Un équipement bruyant fonctionne en extérieur ou à proximité d'habitations
      sans capotage ni limitation horaire.
    criticite_defaut: 2
    exigences: [14001-6.1.2a, 14001-7.4.3]
    reference_reglementaire: "Réglementation locale sur le bruit et les horaires de chantier — à vérifier"
    indices_visuels:
      - "Compresseur, groupe électrogène, broyeur ou extracteur en extérieur sans capot, face à des habitations"
      - "Portes d'atelier bruyant ouvertes côté voisinage"
      - "Activité de chantier bruyante visible hors des horaires affichés"
    exclusions:
      - "Équipement capoté ou en local fermé"
      - "Zone industrielle sans habitation à proximité"
    action_immediate: "Fermer les portes, déplacer ou capoter l'équipement, respecter les horaires"

  - id: ENV-10
    titre: Gaspillage d'eau
    categorie: ressources
    description: >
      L'eau est consommée sans nécessité ou perdue par des fuites, dans un
      contexte de stress hydrique.
    criticite_defaut: 2
    exigences: [14001-6.1.2a, 14001-9.1.1]
    reference_reglementaire: "Loi 36-15 (eau) — à vérifier"
    indices_visuels:
      - "Robinet ou tuyau ouvert sans utilisateur, flaque d'eau claire permanente"
      - "Fuite sur une canalisation, un raccord ou une chasse d'eau"
      - "Arrosage en plein soleil ou lavage au jet d'une surface"
      - "Absence de compteur ou compteur inaccessible sur un usage important"
    exclusions:
      - "Rinçage en cours avec opérateur présent"
      - "Arrosage tôt le matin ou tard le soir avec système économe"
    action_immediate: "Fermer, réparer, installer un pistolet à arrêt automatique, relever le compteur"

  - id: ENV-11
    titre: Produits périmés, stocks dormants et contenants vides non gérés
    categorie: stockage
    description: >
      Des produits chimiques périmés, non utilisés depuis longtemps ou des
      contenants vides s'accumulent sans filière d'élimination.
    criticite_defaut: 2
    exigences: [14001-8.1c, 14001-8.1a]
    reference_reglementaire: "Loi 28-00 — à vérifier"
    indices_visuels:
      - "Bidons poussiéreux, étiquettes décolorées, dates dépassées"
      - "Contenants vides de produits dangereux entassés, non rincés, sans identification"
      - "Produits dégradés (bidons gonflés, croûtes, séparation de phases)"
    exclusions:
      - "Stock de rechange identifié avec date de contrôle"
      - "Contenants vides en zone d'attente identifiée pour retour fournisseur"
    action_immediate: "Inventorier, isoler, éliminer par la filière dangereuse ; ajuster les achats"

  - id: ENV-12
    titre: Sols et milieux naturels dégradés
    categorie: sol_eau
    description: >
      Le site ou ses abords montrent un dépôt sauvage, un remblai de déchets,
      une terre souillée ou une atteinte à la végétation ou à un cours d'eau.
    criticite_defaut: 3
    exigences: [14001-6.1.2a, 14001-6.1.3a, 14001-10.2]
    reference_reglementaire: "Loi 11-03 ; loi 28-00 ; loi 22-07 (aires protégées) — à vérifier"
    indices_visuels:
      - "Gravats, déchets ou terres de provenance inconnue déposés sur un terrain"
      - "Terre noircie ou imprégnée d'hydrocarbures près d'un atelier ou d'une cuve"
      - "Végétation morte en aval d'un rejet, cours d'eau ou oued encombré de déchets"
      - "Remblai ou terrassement en zone humide ou protégée sans autorisation visible"
    exclusions:
      - "Terrassement autorisé avec panneau de chantier et gestion des terres"
      - "Dépôt de matériaux inertes identifiés en attente de réemploi"
    action_immediate: "Stopper l'activité en cause, sécuriser, faire caractériser les terres, évacuer par une filière autorisée"
