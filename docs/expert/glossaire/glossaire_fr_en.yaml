# =====================================================================
# GLOSSAIRE FR / EN — Consultant QSE IA
# Statut : BROUILLON v0.1 — 120 termes rédigés en propres mots (pas les
#          définitions ISO), à relire par Amine Boukha : il peut préférer
#          d'autres traductions ou ajouter le vocabulaire de ses clients.
# Usage : affichage d'infobulles, cohérence des documents générés,
#         traduction FR <-> EN des livrables.
# Domaines : hls | sst | qualite | environnement | energie | audit | outils |
#            sante | maroc
# =====================================================================
version: "0.1-brouillon"
termes:
  - {fr: "Système de management", en: "Management system", dom: hls, def: "Organisation d'ensemble (processus, responsabilités, documents, indicateurs) par laquelle une entreprise pilote et améliore un domaine : qualité, santé-sécurité, environnement ou énergie."}
  - {fr: "Structure harmonisée (structure de haut niveau)", en: "Harmonized Structure (High-Level Structure)", dom: hls, def: "Plan commun en dix chapitres partagé par les normes ISO de management, qui facilite l'intégration de plusieurs systèmes."}
  - {fr: "Organisme", en: "Organization", dom: hls, def: "L'entité qui met en place le système : entreprise, établissement, administration, association."}
  - {fr: "Direction", en: "Top management", dom: hls, def: "La ou les personnes qui décident au plus haut niveau de l'organisme et engagent ses ressources."}
  - {fr: "Partie intéressée", en: "Interested party (stakeholder)", dom: hls, def: "Toute personne ou organisation concernée par les activités de l'organisme, ou capable de les influencer : travailleurs, clients, autorités, voisins, sous-traitants."}
  - {fr: "Contexte de l'organisme", en: "Context of the organization", dom: hls, def: "Les facteurs internes et externes qui pèsent sur la capacité de l'organisme à atteindre ses résultats."}
  - {fr: "Domaine d'application", en: "Scope", dom: hls, def: "Périmètre couvert par le système : sites, activités, produits, services, fonctions."}
  - {fr: "Processus", en: "Process", dom: hls, def: "Suite d'activités liées entre elles qui, à partir d'éléments reçus, produit un résultat attendu."}
  - {fr: "Cartographie des processus", en: "Process map", dom: qualite, def: "Schéma d'ensemble des processus de l'organisme et de leurs liens."}
  - {fr: "Pilote de processus", en: "Process owner", dom: qualite, def: "Personne responsable du fonctionnement, de la performance et de l'amélioration d'un processus."}
  - {fr: "Politique", en: "Policy", dom: hls, def: "Texte court, signé par la direction, qui fixe les intentions et les engagements de l'organisme sur un domaine."}
  - {fr: "Objectif", en: "Objective", dom: hls, def: "Résultat à atteindre dans un délai donné, mesurable ou au moins évaluable, cohérent avec la politique."}
  - {fr: "Indicateur", en: "Indicator (KPI)", dom: hls, def: "Donnée suivie périodiquement qui renseigne sur l'atteinte d'un objectif ou la santé d'un processus."}
  - {fr: "Tableau de bord", en: "Dashboard", dom: qualite, def: "Présentation synthétique des indicateurs utilisés pour piloter."}
  - {fr: "Information documentée", en: "Documented information", dom: hls, def: "Terme des normes actuelles qui regroupe les documents (règles à tenir à jour) et les enregistrements (preuves à conserver). La plateforme parle simplement de documents et d'enregistrements."}
  - {fr: "Document", en: "Document", dom: hls, def: "Support qui décrit une règle, une méthode ou une organisation : politique, procédure, instruction, plan."}
  - {fr: "Enregistrement", en: "Record", dom: hls, def: "Trace écrite prouvant qu'une activité a eu lieu ou qu'un résultat a été obtenu : registre, fiche, rapport, compte rendu."}
  - {fr: "Procédure", en: "Procedure", dom: hls, def: "Description de la façon d'organiser une activité : qui fait quoi, quand, avec quels documents."}
  - {fr: "Instruction de travail / mode opératoire", en: "Work instruction", dom: qualite, def: "Description pas à pas de la façon d'exécuter une tâche à un poste ; répond au « comment »."}
  - {fr: "Manuel", en: "Manual", dom: hls, def: "Document de présentation générale du système ; facultatif dans les normes actuelles mais souvent utile."}
  - {fr: "Maîtrise documentaire", en: "Document control", dom: hls, def: "Règles de rédaction, approbation, diffusion, mise à jour, archivage et retrait des documents."}
  - {fr: "Version / révision", en: "Version / revision", dom: hls, def: "Repère qui identifie l'état d'un document après chaque modification."}
  - {fr: "Cartouche", en: "Document header block", dom: qualite, def: "Bloc d'identification d'un document : titre, code, version, date, rédacteur, vérificateur, approbateur."}
  - {fr: "Compétence", en: "Competence", dom: hls, def: "Capacité démontrée à réaliser correctement une tâche, acquise par formation, expérience ou tutorat."}
  - {fr: "Sensibilisation", en: "Awareness", dom: hls, def: "Fait que chacun connaisse la politique, les risques de son poste, les consignes et sa contribution aux résultats."}
  - {fr: "Communication interne / externe", en: "Internal / external communication", dom: hls, def: "Échanges d'information organisés au sein de l'organisme et avec les parties extérieures."}
  - {fr: "Ressources", en: "Resources", dom: hls, def: "Moyens humains, matériels, financiers et informationnels nécessaires au système."}
  - {fr: "Risque", en: "Risk", dom: hls, def: "Effet possible de l'incertitude sur les objectifs ; en santé-sécurité, combinaison de la probabilité d'un dommage et de sa gravité."}
  - {fr: "Opportunité", en: "Opportunity", dom: hls, def: "Circonstance favorable qui permet d'améliorer la performance ou de réduire un risque."}
  - {fr: "Danger", en: "Hazard", dom: sst, def: "Ce qui, dans le travail, peut blesser ou rendre malade : machine, produit, énergie, hauteur, posture, organisation."}
  - {fr: "Situation dangereuse", en: "Hazardous situation", dom: sst, def: "Moment où une personne se trouve exposée à un danger."}
  - {fr: "Dommage", en: "Harm", dom: sst, def: "Blessure ou atteinte à la santé qui résulte d'un événement."}
  - {fr: "Identification des dangers", en: "Hazard identification", dom: sst, def: "Repérage méthodique de tout ce qui peut nuire, activité par activité et zone par zone."}
  - {fr: "Évaluation des risques", en: "Risk assessment", dom: sst, def: "Estimation, pour chaque danger, de la gravité et de la probabilité du dommage, en tenant compte des mesures déjà en place."}
  - {fr: "Gravité", en: "Severity", dom: sst, def: "Ampleur des conséquences possibles d'un dommage, du soin bénin au décès."}
  - {fr: "Probabilité", en: "Likelihood (probability)", dom: sst, def: "Chance qu'un événement se produise, en combinant la fréquence d'exposition et la vraisemblance de l'accident."}
  - {fr: "Criticité", en: "Risk rating (criticality)", dom: sst, def: "Note obtenue en combinant gravité et probabilité, qui sert à classer les risques."}
  - {fr: "Risque brut / risque résiduel", en: "Inherent / residual risk", dom: sst, def: "Risque estimé sans tenir compte des mesures / risque qui subsiste une fois les mesures appliquées."}
  - {fr: "Hiérarchie des mesures de maîtrise", en: "Hierarchy of controls", dom: sst, def: "Ordre de préférence des actions de prévention : supprimer, remplacer, protéger collectivement, organiser et former, protéger individuellement."}
  - {fr: "Mesure de maîtrise", en: "Control measure", dom: sst, def: "Disposition technique, organisationnelle ou humaine qui réduit un risque."}
  - {fr: "Protection collective", en: "Collective protection", dom: sst, def: "Équipement ou aménagement qui protège toutes les personnes exposées : garde-corps, aspiration, capotage, séparation des flux."}
  - {fr: "Équipement de protection individuelle (EPI)", en: "Personal protective equipment (PPE)", dom: sst, def: "Équipement porté par une personne pour la protéger d'un risque : casque, gants, lunettes, harnais, chaussures."}
  - {fr: "Maîtrise opérationnelle", en: "Operational control", dom: hls, def: "Ensemble des dispositions garantissant que les activités à risque se déroulent dans des conditions définies et contrôlées."}
  - {fr: "Permis de travail", en: "Permit to work", dom: sst, def: "Autorisation écrite, limitée dans le temps et dans l'espace, pour une tâche dangereuse : feu, hauteur, espace confiné, consignation."}
  - {fr: "Consignation / déconsignation", en: "Lockout / tagout (LOTO)", dom: sst, def: "Isolement et verrouillage des énergies d'un équipement avant intervention, puis remise en service contrôlée."}
  - {fr: "Habilitation", en: "Authorisation (certification)", dom: sst, def: "Reconnaissance écrite par l'employeur qu'une personne est formée et apte à réaliser certaines tâches à risque."}
  - {fr: "Autorisation de conduite", en: "Driving authorisation", dom: sst, def: "Document de l'employeur qui permet à un salarié formé et apte de conduire un engin donné."}
  - {fr: "Plan de prévention", en: "Prevention plan (contractor safety plan)", dom: sst, def: "Document établi entre l'entreprise d'accueil et l'entreprise intervenante pour maîtriser les risques liés à leur présence commune."}
  - {fr: "Coactivité", en: "Concurrent work (simultaneous operations)", dom: sst, def: "Présence simultanée de plusieurs entreprises ou équipes au même endroit, créant des risques croisés."}
  - {fr: "Sous-traitant", en: "Contractor", dom: hls, def: "Entreprise extérieure qui réalise un travail pour l'organisme, sur son site ou ailleurs."}
  - {fr: "Externalisation", en: "Outsourcing", dom: hls, def: "Fait de confier à un tiers une activité qui reste dans le périmètre du système."}
  - {fr: "Gestion du changement", en: "Management of change (MOC)", dom: hls, def: "Analyse, avant mise en œuvre, des effets d'un changement d'équipement, de procédé ou d'organisation sur la sécurité, la qualité ou l'environnement."}
  - {fr: "Situation d'urgence", en: "Emergency", dom: sst, def: "Événement soudain qui exige une réaction immédiate : incendie, explosion, fuite, accident grave, malaise."}
  - {fr: "Plan d'urgence", en: "Emergency plan", dom: sst, def: "Organisation prévue pour alerter, évacuer ou confiner, secourir et communiquer en cas d'urgence."}
  - {fr: "Exercice d'évacuation", en: "Evacuation drill", dom: sst, def: "Simulation périodique servant à tester le plan d'urgence et à entraîner le personnel."}
  - {fr: "Point de rassemblement", en: "Assembly point (muster point)", dom: sst, def: "Lieu sûr où les personnes se regroupent après une évacuation pour être comptées."}
  - {fr: "Serre-file / guide d'évacuation", en: "Fire warden", dom: sst, def: "Personnes chargées de guider l'évacuation et de vérifier qu'aucune personne ne reste dans les locaux."}
  - {fr: "Secouriste", en: "First aider", dom: sst, def: "Salarié formé aux premiers secours, identifié et joignable sur le site."}
  - {fr: "Incident", en: "Incident", dom: sst, def: "Événement survenu au travail qui a causé, ou aurait pu causer, une blessure ou une atteinte à la santé."}
  - {fr: "Accident du travail", en: "Occupational accident (injury)", dom: sst, def: "Incident ayant réellement provoqué une blessure ou une atteinte à la santé."}
  - {fr: "Presqu'accident", en: "Near miss", dom: sst, def: "Incident sans blessure, qui aurait pu en causer une ; signal précieux pour la prévention."}
  - {fr: "Maladie professionnelle", en: "Occupational disease", dom: sst, def: "Atteinte à la santé provoquée par l'exposition prolongée à un risque du travail."}
  - {fr: "Accident d'exposition au sang (AES)", en: "Blood exposure accident (needlestick injury)", dom: sante, def: "Contact avec du sang ou un liquide biologique par piqûre, coupure ou projection."}
  - {fr: "Enquête d'incident", en: "Incident investigation", dom: sst, def: "Recherche des faits et des causes d'un incident pour éviter qu'il se reproduise."}
  - {fr: "Cause immédiate / cause racine", en: "Immediate cause / root cause", dom: sst, def: "Cause directement visible / cause profonde, souvent organisationnelle, dont le traitement empêche la répétition."}
  - {fr: "Arbre des causes", en: "Cause tree", dom: outils, def: "Méthode d'analyse d'accident qui reconstitue, de l'aval vers l'amont, l'enchaînement des faits."}
  - {fr: "Taux de fréquence", en: "Lost-time injury frequency rate (LTIFR)", dom: sst, def: "Nombre d'accidents avec arrêt rapporté à un million d'heures travaillées."}
  - {fr: "Taux de gravité", en: "Severity rate", dom: sst, def: "Nombre de jours perdus pour accident rapporté à mille heures travaillées."}
  - {fr: "Indicateur proactif / réactif", en: "Leading / lagging indicator", dom: sst, def: "Indicateur qui mesure l'effort de prévention (visites, formations, remontées) / indicateur qui mesure les résultats subis (accidents, jours perdus)."}
  - {fr: "Consultation", en: "Consultation", dom: sst, def: "Demande de l'avis des travailleurs avant une décision qui les concerne."}
  - {fr: "Participation", en: "Participation", dom: sst, def: "Implication des travailleurs dans les décisions et les actions de prévention."}
  - {fr: "Représentant des travailleurs", en: "Workers' representative", dom: sst, def: "Personne élue ou désignée pour porter la voix des travailleurs sur les questions de santé-sécurité."}
  - {fr: "Comité de sécurité et d'hygiène (CSH)", en: "Health and safety committee", dom: maroc, def: "Instance de consultation prévue par le Code du travail marocain à partir d'un seuil d'effectif, réunie périodiquement avec procès-verbal."}
  - {fr: "Médecine du travail", en: "Occupational health service", dom: sst, def: "Service médical chargé de surveiller la santé des salariés et de se prononcer sur leur aptitude."}
  - {fr: "Aptitude médicale", en: "Fitness for work", dom: sst, def: "Avis du médecin du travail sur la capacité d'une personne à occuper un poste donné."}
  - {fr: "Droit de retrait", en: "Right to withdraw (stop-work authority)", dom: sst, def: "Possibilité pour un travailleur de se retirer d'une situation qu'il estime dangereuse sans être sanctionné."}
  - {fr: "Fiche de données de sécurité (FDS)", en: "Safety data sheet (SDS)", dom: sst, def: "Document du fournisseur qui décrit les dangers d'un produit chimique et les précautions d'emploi, de stockage et de secours."}
  - {fr: "Exigence légale et autre", en: "Legal and other requirements (compliance obligations)", dom: hls, def: "Obligation issue d'un texte officiel, ou engagement volontaire pris par l'organisme : contrat, norme, charte."}
  - {fr: "Veille réglementaire", en: "Regulatory monitoring", dom: hls, def: "Surveillance organisée des textes nouveaux ou modifiés qui concernent l'organisme."}
  - {fr: "Registre des exigences légales", en: "Legal register", dom: hls, def: "Liste tenue à jour des textes et articles applicables, avec la façon dont l'organisme y répond."}
  - {fr: "Évaluation de la conformité", en: "Evaluation of compliance", dom: hls, def: "Vérification périodique, exigence par exigence, que l'organisme respecte bien ses obligations."}
  - {fr: "Surveillance et mesure", en: "Monitoring and measurement", dom: hls, def: "Suivi de l'état des activités et mesure de paramètres pour juger la performance."}
  - {fr: "Étalonnage / vérification", en: "Calibration / verification", dom: qualite, def: "Comparaison d'un instrument à une référence connue / contrôle de son bon fonctionnement."}
  - {fr: "Audit", en: "Audit", dom: audit, def: "Examen structuré et impartial qui compare des preuves à des critères définis pour conclure sur la conformité et l'efficacité."}
  - {fr: "Audit interne", en: "Internal audit (first-party audit)", dom: audit, def: "Audit réalisé par l'organisme, ou pour son compte, sur son propre système."}
  - {fr: "Audit à blanc", en: "Pre-assessment audit (mock audit)", dom: audit, def: "Simulation d'audit de certification pour repérer et corriger les écarts avant l'audit réel."}
  - {fr: "Audit de certification", en: "Certification audit", dom: audit, def: "Audit mené par un organisme accrédité pour délivrer le certificat, en deux étapes (revue documentaire, puis audit sur site)."}
  - {fr: "Audit de surveillance / de renouvellement", en: "Surveillance / recertification audit", dom: audit, def: "Audits périodiques du certificateur pendant le cycle de trois ans / audit complet au terme du cycle."}
  - {fr: "Critères d'audit", en: "Audit criteria", dom: audit, def: "Références auxquelles on compare les preuves : norme, procédures internes, textes réglementaires."}
  - {fr: "Preuve d'audit", en: "Audit evidence", dom: audit, def: "Enregistrement, déclaration ou observation vérifiable recueillie pendant l'audit."}
  - {fr: "Constat d'audit", en: "Audit finding", dom: audit, def: "Résultat de la comparaison des preuves aux critères : conformité, non-conformité, observation ou point fort."}
  - {fr: "Non-conformité", en: "Nonconformity", dom: hls, def: "Écart entre ce qui est constaté et ce qui est exigé."}
  - {fr: "Non-conformité majeure / mineure", en: "Major / minor nonconformity", dom: audit, def: "Écart qui compromet le système ou enfreint la loi / écart ponctuel et isolé."}
  - {fr: "Observation / piste d'amélioration", en: "Observation / opportunity for improvement", dom: audit, def: "Constat sans écart formel qui signale un risque de dérive ou une amélioration possible."}
  - {fr: "Point fort", en: "Strength (good practice)", dom: audit, def: "Pratique remarquable relevée pendant un audit, à maintenir."}
  - {fr: "Correction", en: "Correction", dom: hls, def: "Action qui supprime l'écart constaté, sans traiter sa cause."}
  - {fr: "Action corrective", en: "Corrective action", dom: hls, def: "Action qui supprime la cause de l'écart pour éviter qu'il se reproduise."}
  - {fr: "Action préventive", en: "Preventive action", dom: hls, def: "Action qui supprime la cause d'un écart possible avant qu'il survienne ; remplacée dans les normes actuelles par l'approche par les risques."}
  - {fr: "Vérification d'efficacité", en: "Effectiveness check", dom: hls, def: "Contrôle, après un délai, qu'une action a produit l'effet attendu."}
  - {fr: "Amélioration continue", en: "Continual improvement", dom: hls, def: "Effort répété, d'un cycle à l'autre, pour faire mieux."}
  - {fr: "Revue de direction", en: "Management review", dom: hls, def: "Examen périodique du système par la direction pour juger s'il reste pertinent, adapté et efficace, et décider des évolutions."}
  - {fr: "PDCA (roue de Deming)", en: "Plan–Do–Check–Act", dom: outils, def: "Cycle Planifier, Réaliser, Vérifier, Agir qui structure toutes les normes de management."}
  - {fr: "5 pourquoi", en: "5 Whys", dom: outils, def: "Méthode de recherche de cause consistant à demander « pourquoi » plusieurs fois de suite jusqu'à la cause racine."}
  - {fr: "Diagramme d'Ishikawa (5M)", en: "Ishikawa (fishbone) diagram", dom: outils, def: "Schéma en arêtes de poisson qui classe les causes possibles par famille : main-d'œuvre, matériel, méthode, milieu, matière."}
  - {fr: "Pareto", en: "Pareto analysis", dom: outils, def: "Classement des causes par importance décroissante pour traiter d'abord celles qui produisent l'essentiel des effets."}
  - {fr: "AMDEC", en: "FMEA (Failure Mode and Effects Analysis)", dom: outils, def: "Analyse des modes de défaillance possibles d'un produit ou d'un procédé, de leurs effets et de leur criticité."}
  - {fr: "5S", en: "5S", dom: outils, def: "Méthode d'organisation des postes de travail : trier, ranger, nettoyer, standardiser, maintenir."}
  - {fr: "Matrice RACI", en: "RACI matrix", dom: outils, def: "Tableau des rôles sur une activité : responsable, acteur, consulté, informé."}
  - {fr: "Aspect / impact environnemental", en: "Environmental aspect / impact", dom: environnement, def: "Élément d'une activité qui agit sur l'environnement / modification de l'environnement qui en résulte."}
  - {fr: "Aspect environnemental significatif", en: "Significant environmental aspect", dom: environnement, def: "Aspect dont l'impact est jugé important selon les critères que l'organisme s'est donnés."}
  - {fr: "Perspective de cycle de vie", en: "Life cycle perspective", dom: environnement, def: "Prise en compte de toutes les étapes d'un produit ou service, des achats à la fin de vie."}
  - {fr: "Usage énergétique significatif", en: "Significant energy use (SEU)", dom: energie, def: "Usage qui pèse lourd dans la consommation ou qui offre un fort potentiel d'économie."}
  - {fr: "Revue énergétique", en: "Energy review", dom: energie, def: "Analyse des consommations, des usages et de leurs facteurs d'influence pour trouver les gisements d'économie."}
  - {fr: "Situation énergétique de référence", en: "Energy baseline (EnB)", dom: energie, def: "Point de comparaison chiffré à partir duquel on mesure les progrès de performance énergétique."}
  - {fr: "Indicateur de performance énergétique", en: "Energy performance indicator (EnPI)", dom: energie, def: "Valeur mesurée ou calculée qui traduit la performance énergétique, souvent rapportée à une variable (production, surface, météo)."}
  - {fr: "Établissement recevant du public (ERP)", en: "Public access building", dom: maroc, def: "Bâtiment qui accueille des personnes extérieures, soumis à des règles renforcées d'évacuation et de sécurité incendie."}
  - {fr: "Inspection du travail", en: "Labour inspectorate", dom: maroc, def: "Autorité qui contrôle l'application de la législation du travail, y compris en santé-sécurité."}
  - {fr: "Bulletin Officiel (BO)", en: "Official Gazette", dom: maroc, def: "Publication officielle des lois, décrets et arrêtés du Royaume du Maroc, en édition arabe puis en traduction française."}
  - {fr: "Organisme certificateur", en: "Certification body", dom: audit, def: "Organisme accrédité qui audite et délivre les certificats de conformité aux normes."}
  - {fr: "Accréditation", en: "Accreditation", dom: audit, def: "Reconnaissance officielle de la compétence d'un organisme certificateur ou d'un laboratoire."}
  - {fr: "Système intégré QSE", en: "Integrated management system (IMS)", dom: hls, def: "Système unique couvrant à la fois la qualité, la santé-sécurité et l'environnement, avec des processus et des documents communs."}
